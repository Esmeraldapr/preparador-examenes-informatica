<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · Preparador de Exámenes</title>
<link rel="icon" type="image/png" href="img/favicon-64.png" />
<meta name="description" content="Test de exámenes oficiales para preparar el Grado en Ingeniería Informática." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Grado en Ingeniería Informática · Preparador de Exámenes" />
<meta property="og:description" content="Test de exámenes oficiales para preparar el Grado en Ingeniería Informática." />
<meta property="og:image" content="https://preparador-ingenieria-informatica.onrender.com/img/og.jpg" />
<meta property="og:url" content="https://preparador-ingenieria-informatica.onrender.com/" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="pagina-login">
  <div class="tarjeta-login">
    <img class="logo-img" src="img/logo.png" alt="Logo" width="88" height="88" />
    <h1>Grado en Ingeniería Informática</h1>
    <p class="subtitulo">Preparador de Exámenes</p>

    <div class="tabs-login">
      <button id="tab-entrar" class="activa">Ya tengo cuenta</button>
      <button id="tab-crear">Crear cuenta</button>
    </div>

    <div id="mensaje"></div>

    <!-- Formulario: iniciar sesión -->
    <form id="form-entrar">
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="entrar-email" required autocomplete="email" />
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <div class="campo-password">
          <input type="password" id="entrar-pass" required autocomplete="current-password" />
          <button type="button" class="btn-ojo" data-objetivo="entrar-pass">👁️</button>
        </div>
      </div>
      <label class="campo-recordar">
        <input type="checkbox" id="entrar-recordar" />
        Recordar mi correo en este dispositivo
      </label>
      <button type="submit" class="btn btn-primario btn-bloque">Entrar</button>
      <div class="enlace-olvido"><a href="#" id="ir-olvido">¿Has olvidado tu contraseña?</a></div>
    </form>

    <!-- Formulario: recuperar contraseña -->
    <form id="form-olvido" style="display:none">
      <p class="texto-olvido">Escribe tu correo y te enviaremos un enlace para elegir una contraseña nueva.</p>
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="olvido-email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primario btn-bloque" id="olvido-enviar">Enviarme el enlace</button>
      <div class="enlace-olvido"><a href="#" id="volver-entrar">← Volver a entrar</a></div>
    </form>

    <!-- Formulario: crear cuenta -->
    <form id="form-crear" style="display:none">
      <div class="campo">
        <label>Nombre</label>
        <input type="text" id="crear-nombre" required />
      </div>
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="crear-email" required autocomplete="email" />
      </div>
      <div class="campo">
        <label>Contraseña (mínimo 6 caracteres)</label>
        <div class="campo-password">
          <input type="password" id="crear-pass" required minlength="6" autocomplete="new-password" />
          <button type="button" class="btn-ojo" data-objetivo="crear-pass">👁️</button>
        </div>
      </div>
      <div class="campo">
        <label>Repetir contraseña</label>
        <div class="campo-password">
          <input type="password" id="crear-pass2" required minlength="6" autocomplete="new-password" />
          <button type="button" class="btn-ojo" data-objetivo="crear-pass2">👁️</button>
        </div>
        <div id="aviso-coincide" class="aviso-coincide"></div>
      </div>
      <button type="submit" class="btn btn-primario btn-bloque">Crear mi cuenta</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const tabEntrar = document.getElementById("tab-entrar");
    const tabCrear = document.getElementById("tab-crear");
    const formEntrar = document.getElementById("form-entrar");
    const formCrear = document.getElementById("form-crear");
    const mensaje = document.getElementById("mensaje");

    document.querySelectorAll(".btn-ojo").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.objetivo);
        const mostrar = input.type === "password";
        input.type = mostrar ? "text" : "password";
        btn.textContent = mostrar ? "🙈" : "👁️";
      });
    });

    const passCrear = document.getElementById("crear-pass");
    const passCrear2 = document.getElementById("crear-pass2");
    const avisoCoincide = document.getElementById("aviso-coincide");
    function contraseñasCoinciden() {
      if (!passCrear2.value) {
        avisoCoincide.textContent = "";
        return true;
      }
      if (passCrear.value === passCrear2.value) {
        avisoCoincide.textContent = "✓ Las contraseñas coinciden";
        avisoCoincide.className = "aviso-coincide ok";
        return true;
      }
      avisoCoincide.textContent = "✗ Las contraseñas no coinciden";
      avisoCoincide.className = "aviso-coincide mal";
      return false;
    }
    passCrear.addEventListener("input", contraseñasCoinciden);
    passCrear2.addEventListener("input", contraseñasCoinciden);

    const formOlvido = document.getElementById("form-olvido");
    const tabsLogin = document.querySelector(".tabs-login");
    tabEntrar.addEventListener("click", () => {
      tabEntrar.classList.add("activa");
      tabCrear.classList.remove("activa");
      formEntrar.style.display = "block";
      formCrear.style.display = "none";
      formOlvido.style.display = "none";
      tabsLogin.style.display = "flex";
      mensaje.innerHTML = "";
    });
    tabCrear.addEventListener("click", () => {
      tabCrear.classList.add("activa");
      tabEntrar.classList.remove("activa");
      formCrear.style.display = "block";
      formEntrar.style.display = "none";
      formOlvido.style.display = "none";
      tabsLogin.style.display = "flex";
      mensaje.innerHTML = "";
    });

    // ---- ¿Has olvidado tu contraseña? ----
    document.getElementById("ir-olvido").addEventListener("click", (e) => {
      e.preventDefault();
      mensaje.innerHTML = "";
      document.getElementById("olvido-email").value = document.getElementById("entrar-email").value;
      formEntrar.style.display = "none";
      formCrear.style.display = "none";
      tabsLogin.style.display = "none";
      formOlvido.style.display = "block";
    });
    document.getElementById("volver-entrar").addEventListener("click", (e) => {
      e.preventDefault();
      tabEntrar.click();
    });
    formOlvido.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensaje.innerHTML = "";
      const boton = document.getElementById("olvido-enviar");
      const email = document.getElementById("olvido-email").value.trim();
      boton.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/restablecer.html",
      });
      boton.disabled = false;
      if (error) {
        const limite = /rate|seconds|limit/i.test(error.message);
        mostrarError(limite
          ? "Has pedido demasiados correos seguidos. Espera unos minutos y vuelve a intentarlo."
          : "No se pudo enviar el correo: " + error.message);
        return;
      }
      mostrarOk("Listo. Si ese correo tiene cuenta, te llegará un enlace para cambiar la contraseña. Mira también en spam.");
    });

    function mostrarError(texto) {
      mensaje.innerHTML = `<div class="mensaje-error">${texto}</div>`;
    }
    function mostrarOk(texto) {
      mensaje.innerHTML = `<div class="mensaje-ok">${texto}</div>`;
    }

    const campoEmailEntrar = document.getElementById("entrar-email");
    const campoRecordar = document.getElementById("entrar-recordar");
    const correoGuardado = localStorage.getItem("correo_recordado");
    if (correoGuardado) {
      campoEmailEntrar.value = correoGuardado;
      campoRecordar.checked = true;
    }

    (async () => {
      const sesion = await obtenerSesion();
      if (sesion) window.location.href = "index.html";
    })();

    formEntrar.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensaje.innerHTML = "";
      const email = document.getElementById("entrar-email").value.trim();
      const password = document.getElementById("entrar-pass").value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        mostrarError("No se pudo entrar: " + error.message);
        return;
      }
      if (campoRecordar.checked) {
        localStorage.setItem("correo_recordado", email);
      } else {
        localStorage.removeItem("correo_recordado");
      }
      window.location.href = "index.html";
    });

    formCrear.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensaje.innerHTML = "";
      const nombre = document.getElementById("crear-nombre").value.trim();
      const email = document.getElementById("crear-email").value.trim();
      const password = document.getElementById("crear-pass").value;
      if (!contraseñasCoinciden()) {
        mostrarError("Las dos contraseñas no coinciden. Revísalas antes de continuar.");
        return;
      }
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { nombre } },
      });
      if (error) {
        mostrarError("No se pudo crear la cuenta: " + error.message);
        return;
      }
      if (data.session) {
        window.location.href = "index.html";
      } else {
        mostrarOk(
          "Cuenta creada. Revisa tu correo para confirmar la cuenta y después inicia sesión."
        );
        tabEntrar.click();
      }
    });
  </script>
</body>
</html>
