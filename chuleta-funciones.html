<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de dominio y recorrido · Cálculo</title><link rel="icon" href="img/favicon-64.png">
<style>
:root{--m:#7c3aed;--rj:#ef4444;--az:#3b82f6;--vd:#16a34a;--tx:#1f2937;--su:#6b7280;--bg:#f6f4fb;--card:#fff;--ln:#e5e1f3}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:8px clamp(8px,2vw,16px)}
header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1{font-size:clamp(14px,2.2vw,19px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid #d9d2f3;background:#fff;color:var(--m);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit}
.btn.on{background:var(--m);color:#fff;border-color:var(--m)}
.todo{flex:1;min-height:0;display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(6px,1.2vw,14px)}
/* simulador */
.sim{background:var(--card);border:2px solid var(--m);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;min-height:0}
.simtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fn{font-size:clamp(17px,2.6vw,24px);font-weight:800;color:var(--m)}
.dr{font-size:clamp(12px,1.7vw,15px);font-weight:700}
.dr .d{color:var(--vd)} .dr .r{color:var(--rj)}
#lienzo{flex:1;min-height:0;width:100%}
.lect{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:clamp(13px,1.9vw,17px);min-height:1.6em}
.lect .x{color:var(--vd);font-weight:700}
.lect .y{color:var(--rj);font-weight:700}
.lect .no{color:var(--rj);font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:4px}
input[type=range]{flex:1;accent-color:var(--m);height:28px}
.pista{font-size:12px;color:var(--su);margin-top:2px}
/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(5px,1vw,9px);min-height:0}
.c{font:inherit;color:inherit;text-align:left;background:var(--card);border:2px solid var(--ln);border-radius:11px;padding:5px 7px;min-width:0;min-height:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.c.sel{border-color:var(--m);background:#f3eefe;box-shadow:0 0 0 2px #e4dafc}
.c .n{font-weight:800;font-size:clamp(13px,1.9vw,16px)}
.c .d,.c .r{font-size:clamp(11px,1.6vw,14px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .d b{color:var(--vd)} .c .r b{color:var(--rj)}
.c i{font-style:normal;font-weight:700}
.c .d i{color:var(--vd)} .c .r i{color:var(--rj)}
body.tapar .c i{color:transparent;background:#e9e5f7;border-radius:4px;display:inline-block;width:5.5em;vertical-align:middle}
body.tapar .dr i{color:transparent;background:#e9e5f7;border-radius:4px;display:inline-block;width:5.5em;vertical-align:middle}
body.tapar.ver .dr i,body.tapar.ver .c.sel i{color:inherit;background:none;width:auto}
body.tapar.ver .c.sel .d i{color:var(--vd)} body.tapar.ver .c.sel .r i{color:var(--rj)}
footer{font-size:12px;color:var(--rj);font-weight:600;text-align:center;margin-top:6px}
@media (max-width:760px){
 .todo{grid-template-columns:1fr;grid-template-rows:1.25fr 1fr}
 .pista{display:none}
 footer{font-size:11px}
}
</style></head><body>
<header><a class="btn" href="javascript:history.length>1?history.back():location.href='asignatura.html?asignatura=1'">← Volver</a><h1>Simulador: dominio y recorrido</h1><button class="btn" id="tapar" type="button">🙈 Tapar</button></header>
<div class="todo">
 <section class="sim">
  <div class="simtop"><span class="fn" id="fn">sen x</span><span class="dr"><span class="d">D = <i id="dd"></i></span> · <span class="r">R = <i id="rr"></i></span></span></div>
  <svg id="lienzo" viewBox="0 0 400 230" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Gráfica de la función con el punto que se mueve"></svg>
  <div class="lect" id="lect"></div>
  <div class="ctrl"><button class="btn" id="play" type="button">▶ Recorrer</button><input type="range" id="barra" min="0" max="1000" value="500" aria-label="Mueve x"></div>
  <p class="pista" id="pista"></p>
 </section>
 <section class="cards" id="cards"></section>
</div>
<footer>Ojo: el PDF dice que el recorrido de la tangente es [−1, 1] y es FALSO: es todo ℝ. · En el examen: 3 veces en 6 oficiales (pregunta 2).</footer>
<script>
const PI=Math.PI;
const F=[
 {k:'sen',n:'sen x',f:Math.sin,x:[-7,7],y:[-1.8,1.8],D:'ℝ',R:'[−1, 1]',ok:x=>true,hy:[1,-1],tx:[[PI,'π'],[-PI,'−π']],ty:[[1,'1'],[-1,'−1']],dom:[[null,null,1,1]],rec:[[-1,1,1,1]],p:'Mete cualquier x. Lo que sale nunca pasa de 1 ni baja de −1.'},
 {k:'cos',n:'cos x',f:Math.cos,x:[-7,7],y:[-1.8,1.8],D:'ℝ',R:'[−1, 1]',ok:x=>true,hy:[1,-1],tx:[[PI,'π'],[-PI,'−π']],ty:[[1,'1'],[-1,'−1']],dom:[[null,null,1,1]],rec:[[-1,1,1,1]],p:'Igual que el seno, pero empieza arriba: cos 0 = 1.'},
 {k:'tg',n:'tg x',f:Math.tan,x:[-4.7,4.7],y:[-4,4],D:'ℝ − {π/2 + kπ}',R:'ℝ',ok:x=>Math.abs(Math.cos(x))>1e-9,vx:[-3*PI/2,-PI/2,PI/2,3*PI/2],tx:[[PI/2,'π/2'],[-PI/2,'−π/2']],ty:[],dom:[[null,-PI/2,0,0],[-PI/2,PI/2,0,0],[PI/2,null,0,0]],rec:[[null,null,1,1]],p:'Acerca la barra a π/2 ≈ 1,57: la tangente se dispara hacia arriba o hacia abajo.'},
 {k:'arcsen',n:'arcsen x',f:Math.asin,x:[-2,2],y:[-2,2],D:'[−1, 1]',R:'[−π/2, π/2]',ok:x=>Math.abs(x)<=1+1e-9,tx:[[1,'1'],[-1,'−1']],ty:[[PI/2,'π/2'],[-PI/2,'−π/2']],dom:[[-1,1,1,1]],rec:[[-PI/2,PI/2,1,1]],p:'Lleva la barra más allá de 1: arcsen(1,5) no existe.'},
 {k:'arccos',n:'arccos x',f:Math.acos,x:[-2,2],y:[-0.6,3.6],D:'[−1, 1]',R:'[0, π]',ok:x=>Math.abs(x)<=1+1e-9,tx:[[1,'1'],[-1,'−1']],ty:[[PI,'π']],dom:[[-1,1,1,1]],rec:[[0,PI,1,1]],p:'Sale de 0 a π: siempre positivo. Fuera de [−1, 1] no existe.'},
 {k:'arctg',n:'arctg x',f:Math.atan,x:[-8,8],y:[-2.1,2.1],D:'ℝ',R:'(−π/2, π/2)',ok:x=>true,hy:[PI/2,-PI/2],ty:[[PI/2,'π/2'],[-PI/2,'−π/2']],tx:[],dom:[[null,null,1,1]],rec:[[-PI/2,PI/2,0,0]],p:'Lleva la barra al final: se acerca a π/2 ≈ 1,57 pero nunca lo toca.'},
 {k:'ln',n:'ln x',f:Math.log,x:[-2,7],y:[-3.2,2.6],D:'(0, +∞)',R:'ℝ',ok:x=>x>1e-9,vx:[0],tx:[[1,'1']],ty:[],dom:[[0,null,0,0]],rec:[[null,null,1,1]],p:'Lleva la barra a 0 o a negativos: ln no existe. ln 1 = 0.'},
 {k:'exp',n:'eˣ',f:Math.exp,x:[-4,2.2],y:[-1,6.5],D:'ℝ',R:'(0, +∞)',ok:x=>true,hy:[0],tx:[[1,'1']],ty:[[1,'1']],dom:[[null,null,1,1]],rec:[[0,null,0,0]],p:'Lleva la barra muy a la izquierda: sale casi 0, pero nunca 0 ni negativo.'},
 {k:'inv',n:'1/x',f:x=>1/x,x:[-5,5],y:[-5,5],D:'ℝ − {0}',R:'ℝ − {0}',ok:x=>Math.abs(x)>1e-9,vx:[0],hy:[0],tx:[[1,'1']],ty:[[1,'1']],dom:[[null,0,0,0],[0,null,0,0]],rec:[[null,0,0,0],[0,null,0,0]],p:'Pon la barra justo en 0: 1/0 no existe. Y nunca sale 0.'}
];
const $=id=>document.getElementById(id), S=$('lienzo'), barra=$('barra');
const W=400,H=230,X0=34,X1=390,Y0=10,Y1=220;
let cur=F[0], anim=null, dir=1;
const fmt=v=>{if(!isFinite(v))return '∞';const r=Math.round(v*100)/100;return (Object.is(r,-0)?0:r).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})};
function sx(x){return X0+(x-cur.x[0])/(cur.x[1]-cur.x[0])*(X1-X0)}
function sy(y){return Y1-(y-cur.y[0])/(cur.y[1]-cur.y[0])*(Y1-Y0)}
function xval(){const t=barra.value/1000;return Math.round((cur.x[0]+t*(cur.x[1]-cur.x[0]))*100)/100}
function camino(hasta){
 let d='',pen=false,prev=null;const N=500;
 for(let i=0;i<=N;i++){const x=cur.x[0]+(cur.x[1]-cur.x[0])*i/N; if(hasta!=null&&x>hasta)break;
  if(!cur.ok(x)){pen=false;continue}
  const y=cur.f(x); if(!isFinite(y)){pen=false;continue}
  const R=cur.y[1]-cur.y[0],yy=Math.max(cur.y[0]-2*R,Math.min(cur.y[1]+2*R,y));
  if(prev!=null&&Math.abs(y-prev)>(cur.y[1]-cur.y[0])*1.5)pen=false;
  d+=(pen?'L':'M')+sx(x).toFixed(1)+','+sy(yy).toFixed(1);pen=true;prev=y}
 return d}
function barras(){
 let s='',ox=sx(Math.max(cur.x[0],Math.min(cur.x[1],0))),oy=sy(Math.max(cur.y[0],Math.min(cur.y[1],0)));
 const pts=[];
 for(const[a,b,ca,cb]of cur.dom){const A=a==null?X0:sx(a),B=b==null?X1:sx(b);s+=`<line x1="${A}" y1="${oy}" x2="${B}" y2="${oy}" stroke="#16a34a" stroke-width="6" stroke-opacity=".35"/>`;
  if(a!=null)pts.push([A,oy,ca,'#16a34a']); if(b!=null)pts.push([B,oy,cb,'#16a34a'])}
 for(const[a,b,ca,cb]of cur.rec){const A=a==null?Y1:sy(a),B=b==null?Y0:sy(b);s+=`<line x1="${ox}" y1="${A}" x2="${ox}" y2="${B}" stroke="#ef4444" stroke-width="6" stroke-opacity=".35"/>`;
  if(a!=null)pts.push([ox,A,ca,'#ef4444']); if(b!=null)pts.push([ox,B,cb,'#ef4444'])}
 for(const[x,y,c,col]of pts)s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${c?col:'#fff'}" stroke="${col}" stroke-width="1.6"/>`;
 return s}
function dibuja(){
 const x=xval(), ok=cur.ok(x), y=ok?cur.f(x):NaN;
 const ox=sx(Math.max(cur.x[0],Math.min(cur.x[1],0))), oy=sy(Math.max(cur.y[0],Math.min(cur.y[1],0)));
 let s=`<line x1="${X0}" y1="${oy}" x2="${X1}" y2="${oy}" stroke="#999"/><line x1="${ox}" y1="${Y0}" x2="${ox}" y2="${Y1}" stroke="#999"/>`;
 for(const a of cur.vx||[])s+=`<line x1="${sx(a)}" y1="${Y0}" x2="${sx(a)}" y2="${Y1}" stroke="#3b82f6" stroke-dasharray="4 3"/>`;
 for(const a of cur.hy||[])s+=`<line x1="${X0}" y1="${sy(a)}" x2="${X1}" y2="${sy(a)}" stroke="#3b82f6" stroke-dasharray="4 3"/>`;
 s+=barras();
 s+=`<clipPath id="cl"><rect x="${X0}" y="${Y0-6}" width="${X1-X0}" height="${Y1-Y0+12}"/></clipPath><g clip-path="url(#cl)"><path d="${camino(null)}" fill="none" stroke="#c4b5fd" stroke-width="2"/><path d="${camino(x)}" fill="none" stroke="#7c3aed" stroke-width="3"/></g>`;
 for(const[v,t]of cur.tx)s+=`<text x="${sx(v)}" y="${oy+14}" font-size="11" fill="#555" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">${t}</text>`;
 for(const[v,t]of cur.ty)s+=`<text x="${ox-6}" y="${sy(v)+4}" font-size="11" fill="#555" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">${t}</text>`;
 const px=sx(x);
 if(ok&&isFinite(y)){
  const vis=y>=cur.y[0]&&y<=cur.y[1], py=sy(Math.max(cur.y[0],Math.min(cur.y[1],y)));
  s+=`<line x1="${px}" y1="${oy}" x2="${px}" y2="${py}" stroke="#16a34a" stroke-dasharray="3 3"/><line x1="${px}" y1="${py}" x2="${ox}" y2="${py}" stroke="#ef4444" stroke-dasharray="3 3"/>`;
  s+=`<circle cx="${px}" cy="${oy}" r="5" fill="#16a34a"/>`;
  if(vis){s+=`<circle cx="${ox}" cy="${py}" r="5" fill="#ef4444"/><circle cx="${px}" cy="${py}" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>`}
  else s+=`<text x="${px}" y="${y>0?Y0+12:Y1-4}" font-size="16" fill="#7c3aed" text-anchor="middle">${y>0?'↑':'↓'}</text>`;
  $('lect').innerHTML=`<span class="x">entra x = ${fmt(x)}</span><span>→</span><span class="y">sale y = ${Math.abs(y)>9999?(y>0?'muy grande (+∞)':'muy negativo (−∞)'):fmt(y)}</span>`;
 }else{
  s+=`<line x1="${px}" y1="${Y0}" x2="${px}" y2="${Y1}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${px}" y="${oy-8}" font-size="18" fill="#ef4444" text-anchor="middle" font-weight="bold">✕</text>`;
  $('lect').innerHTML=`<span class="x">x = ${fmt(x)}</span><span class="no">❌ no se puede meter: no está en el dominio ${cur.D}</span>`;
 }
 S.innerHTML=s;
}
function elige(k){
 cur=F.find(f=>f.k===k);parar();barra.value=500;
 $('fn').textContent=cur.n;$('dd').textContent=cur.D;$('rr').textContent=cur.R;$('pista').textContent='👉 '+cur.p+(document.body.classList.contains('tapar')?' (Vuelve a tocar la tarjeta para ver la respuesta.)':'');
 document.querySelectorAll('.c').forEach(c=>c.classList.toggle('sel',c.dataset.k===k));
 document.body.classList.remove('ver');dibuja();
}
function parar(){if(anim){clearInterval(anim);anim=null;$('play').textContent='▶ Recorrer'}}
$('play').onclick=()=>{if(anim)return parar();$('play').textContent='⏸ Parar';
 anim=setInterval(()=>{let v=+barra.value+4*dir;if(v>=1000||v<=0)dir*=-1;barra.value=Math.max(0,Math.min(1000,v));dibuja()},30)};
barra.oninput=()=>{parar();dibuja()};
$('cards').innerHTML=F.map(f=>`<button class="c" type="button" data-k="${f.k}"><span class="n">${f.n}</span><span class="d"><b>D</b> <i>${f.D}</i></span><span class="r"><b>R</b> <i>${f.R}</i></span></button>`).join('');
document.querySelectorAll('.c').forEach(c=>c.onclick=()=>{if(document.body.classList.contains('tapar')&&c.classList.contains('sel')){document.body.classList.toggle('ver');return}elige(c.dataset.k)});
$('tapar').onclick=()=>{const on=document.body.classList.toggle('tapar');$('tapar').classList.toggle('on',on);$('tapar').textContent=on?'👀 Enseñar':'🙈 Tapar';document.body.classList.remove('ver')};
elige('sen');
</script>
</body></html>
