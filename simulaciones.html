<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulaciones · Preparador de Exámenes</title>
<link rel="icon" type="image/png" href="img/favicon-64.png" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .sm-ud{background:#fff; border:1px solid var(--borde); border-radius:14px; margin-bottom:12px; overflow:hidden}
  .sm-ud > summary{cursor:pointer; padding:12px 16px; font-weight:700; color:var(--morado-osc); list-style:none}
  .sm-ud > summary::-webkit-details-marker{display:none}
  .sm-ud > summary::before{content:"▸ "; display:inline-block; transition:transform .15s}
  .sm-ud[open] > summary::before{transform:rotate(90deg)}
  .sm-ud > summary .sm-n{font-weight:400; color:var(--texto-suave); margin-left:6px}
  .sm-lista{padding:0 12px 10px}
  .sm-item{display:flex; gap:12px; align-items:flex-start; padding:12px 6px; border-top:1px solid var(--borde); text-decoration:none; color:inherit}
  .sm-item:hover{background:rgba(124,58,237,.06)}
  .sm-ico{flex:0 0 40px; height:40px; border-radius:12px; background:#7c3aed; color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.2rem}
  .sm-tit{font-weight:700; line-height:1.35}
  .sm-para{font-size:.9rem; margin-top:4px; line-height:1.5}
  .sm-meta{font-size:.82rem; color:var(--texto-suave); margin-top:4px}
</style>
</head>
<body>
  <div class="navbar" id="navbar"></div>
  <div class="contenedor">
    <h1>🧪 Simulaciones</h1>
    <p class="subtitulo"><span id="nombre-asignatura"></span> · Dibujos que se mueven: cambias un valor y ves qué pasa. Se abren en otra pestaña.</p>
    <div id="lista-simulaciones"><div class="spinner"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/simulaciones.js"></script>
</body>
</html>
