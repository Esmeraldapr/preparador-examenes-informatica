<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 116" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_1702" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_1702" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a3_1702" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a4_1702" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="14.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">(f &#8728; g)(x) = f(g(x))</text><circle cx="24.0" cy="50.0" r="3.4" fill="#333" stroke="#333" stroke-width="1.6"/><text x="24.0" y="68.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">x</text><line x1="32.0" y1="50.0" x2="62.0" y2="50.0" stroke="#999" stroke-width="1.4" marker-end="url(#a1_1702)"/><rect x="64.0" y="36.0" width="54.0" height="28.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="91.0" y="55.0" font-size="9.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">g: x + 1</text><text x="91.0" y="30.0" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="bold">1&#186;</text><line x1="120.0" y1="50.0" x2="148.0" y2="50.0" stroke="#999" stroke-width="1.4" marker-end="url(#a2_1702)"/><text x="166.0" y="54.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">x + 1</text><line x1="186.0" y1="50.0" x2="206.0" y2="50.0" stroke="#999" stroke-width="1.4" marker-end="url(#a3_1702)"/><rect x="208.0" y="36.0" width="48.0" height="28.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="232.0" y="55.0" font-size="9.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">f: ( )&#178;</text><text x="232.0" y="30.0" font-size="8" fill="#3b82f6" text-anchor="middle" font-weight="bold">2&#186;</text><line x1="258.0" y1="50.0" x2="276.0" y2="50.0" stroke="#999" stroke-width="1.4" marker-end="url(#a4_1702)"/><text x="246.0" y="80.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">(x + 1)&#178;</text><text x="150.0" y="98.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">Se lee de DERECHA a IZQUIERDA: primero act&#250;a g y despu&#233;s f.</text><text x="150.0" y="110.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">La trampa es contestar x&#178; + 1, que es (g &#8728; f)(x).</text></svg>