<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Para qu&#233; sirve un documento de directrices</text><rect x="12.0" y="24.0" width="90.0" height="62.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="57.0" y="42.0" font-size="7.8" fill="#7c3aed" text-anchor="middle" font-weight="bold">LENGUAJE COM&#218;N</text><text x="57.0" y="60.0" font-size="6.9" fill="#333" text-anchor="middle">la misma palabra para</text><text x="57.0" y="70.0" font-size="6.9" fill="#333" text-anchor="middle">lo mismo en todo el equipo</text><rect x="105.0" y="24.0" width="90.0" height="62.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/><text x="150.0" y="42.0" font-size="7.8" fill="#3b82f6" text-anchor="middle" font-weight="bold">APARIENCIA COM&#218;N</text><text x="150.0" y="60.0" font-size="6.9" fill="#333" text-anchor="middle">todo se parece, aunque</text><text x="150.0" y="70.0" font-size="6.9" fill="#333" text-anchor="middle">lo haga otro dise&#241;ador</text><rect x="198.0" y="24.0" width="90.0" height="62.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><text x="243.0" y="42.0" font-size="7.8" fill="#16a34a" text-anchor="middle" font-weight="bold">SECUENCIA CLARA</text><text x="243.0" y="60.0" font-size="6.9" fill="#333" text-anchor="middle">las acciones se hacen</text><text x="243.0" y="70.0" font-size="6.9" fill="#333" text-anchor="middle">siempre en el mismo orden</text><rect x="12.0" y="94.0" width="276.0" height="20.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="150.0" y="108.0" font-size="7.8" fill="#16a34a" text-anchor="middle" font-weight="bold">Todo esto sirve para una cosa: que el usuario APRENDA antes.</text><rect x="12.0" y="118.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/><text x="150.0" y="130.0" font-size="7.4" fill="#333" text-anchor="middle">Ejemplo del temario: en Microsoft Office todas las aplicaciones</text><text x="150.0" y="140.0" font-size="7.4" fill="#333" text-anchor="middle">tienen el men&#250; Archivo en el mismo sitio y con los mismos comandos.</text></svg>