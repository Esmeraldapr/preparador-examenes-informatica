<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">El problema estrella: asociaci&#243;n mixta</text><circle cx="26" cy="35" r="8" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="26.0" y="39.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">1</text><text x="40.0" y="39.0" font-size="8" fill="#333" text-anchor="start">Mira qu&#233; condensadores comparten LOS DOS extremos</text><circle cx="26" cy="56" r="8" fill="#fff" stroke="#16a34a" stroke-width="1.6"/><text x="26.0" y="60.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">2</text><text x="40.0" y="60.0" font-size="8" fill="#333" text-anchor="start">&#201;sos van en paralelo: s&#250;malos directamente</text><circle cx="26" cy="77" r="8" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><text x="26.0" y="81.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold">3</text><text x="40.0" y="81.0" font-size="8" fill="#333" text-anchor="start">Los que van uno detr&#225;s de otro van en serie:</text><circle cx="26" cy="98" r="8" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><text x="26.0" y="102.0" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="bold">4</text><text x="40.0" y="102.0" font-size="8" fill="#333" text-anchor="start">suma los inversos y al final INVIERTE el resultado</text><circle cx="26" cy="119" r="8" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="26.0" y="123.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">5</text><text x="40.0" y="123.0" font-size="8" fill="#333" text-anchor="start">Repite hasta que quede un solo condensador</text><rect x="14.0" y="132.0" width="272.0" height="16.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1"/><text x="150.0" y="144.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">Error t&#237;pico: olvidarse de invertir al final en la serie.</text></svg>