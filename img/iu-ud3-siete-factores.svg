<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Arial, sans-serif"><rect width="600" height="330" fill="#fff"/><text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Cómo favorecer la funcionalidad: 7 factores</text><rect x="20" y="36" width="270" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="42" cy="67" r="14" fill="#7c3aed"/><text x="42" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><text x="64" y="56" font-size="13" font-weight="bold" fill="#7c3aed">Mensajes de error</text><text x="64" y="74" font-size="11" fill="#333">claros, sin culpar</text><text x="64" y="89" font-size="11" fill="#333">y con una solución</text><rect x="310" y="36" width="270" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="332" cy="67" r="14" fill="#7c3aed"/><text x="332" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><text x="354" y="56" font-size="13" font-weight="bold" fill="#7c3aed">No antropomórfico</text><text x="354" y="74" font-size="11" fill="#333">no hacer creer que</text><text x="354" y="89" font-size="11" fill="#333">hay ALGUIEN dentro</text><rect x="20" y="108" width="270" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="42" cy="139" r="14" fill="#7c3aed"/><text x="42" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><text x="64" y="128" font-size="13" font-weight="bold" fill="#7c3aed">Diseño de la pantalla</text><text x="64" y="146" font-size="11" fill="#333">lo importante, ordenado</text><text x="64" y="161" font-size="11" fill="#333">y agrupado</text><rect x="310" y="108" width="270" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><circle cx="332" cy="139" r="14" fill="#16a34a"/><text x="332" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><text x="354" y="128" font-size="13" font-weight="bold" fill="#16a34a">Para la impresión  (nuevo)</text><text x="354" y="146" font-size="11" fill="#333">sencillo; las empresas</text><text x="354" y="161" font-size="11" fill="#333">imprimen en blanco y negro</text><rect x="20" y="180" width="270" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><circle cx="42" cy="211" r="14" fill="#16a34a"/><text x="42" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><text x="64" y="200" font-size="13" font-weight="bold" fill="#16a34a">Internacionalización  (nuevo)</text><text x="64" y="218" font-size="11" fill="#333">la fecha: día/mes/año</text><text x="64" y="233" font-size="11" fill="#333">no es igual en todo país</text><rect x="310" y="180" width="270" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="332" cy="211" r="14" fill="#7c3aed"/><text x="332" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">6</text><text x="354" y="200" font-size="13" font-weight="bold" fill="#7c3aed">Páginas web</text><text x="354" y="218" font-size="11" fill="#333">ni enterrar ni sobrecargar;</text><text x="354" y="233" font-size="11" fill="#333">enlaces claros</text><rect x="165" y="252" width="270" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="187" cy="283" r="14" fill="#7c3aed"/><text x="187" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">7</text><text x="209" y="272" font-size="13" font-weight="bold" fill="#7c3aed">Color</text><text x="209" y="290" font-size="11" fill="#333">3-4 colores como máximo;</text><text x="209" y="305" font-size="11" fill="#333">primero en monocromo</text></svg>