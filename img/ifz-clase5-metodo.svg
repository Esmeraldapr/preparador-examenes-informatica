<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 480' width='900' height='480'><rect width='900' height='480' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='21' fill='#1e1b4b' text-anchor='start' font-weight="bold">Experimentos: las fases del método científico</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Variable independiente = la que yo cambio. Dependiente = la que mido.</text><rect x='20' y='78' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='106' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">1. Observación</text><text x='340' y='106' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Veo algo que quiero medir.</text><line x1='170' y1='122' x2='170' y2='134' stroke='#999' stroke-width='3'/><rect x='20' y='134' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='162' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">2. Planteamiento del problema</text><text x='340' y='162' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Se usa esta tarea tanto como antes?</text><line x1='170' y1='178' x2='170' y2='190' stroke='#999' stroke-width='3'/><rect x='20' y='190' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='218' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">3. Hipótesis</text><text x='340' y='218' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Una explicación que se puede comprobar.</text><line x1='170' y1='234' x2='170' y2='246' stroke='#999' stroke-width='3'/><rect x='20' y='246' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='274' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">4. Experimentación</text><text x='340' y='274' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Pruebas controladas con variables.</text><line x1='170' y1='290' x2='170' y2='302' stroke='#999' stroke-width='3'/><rect x='20' y='302' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='330' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">5. Análisis de resultados</text><text x='340' y='330' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Estudio los datos con estadística.</text><line x1='170' y1='346' x2='170' y2='358' stroke='#999' stroke-width='3'/><rect x='20' y='358' width='300' height='44' rx='10' fill='#16a34a'/><text x='170' y='386' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">6. Conclusiones</text><text x='340' y='386' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Acepto o rechazo la hipótesis.</text><line x1='170' y1='402' x2='170' y2='414' stroke='#999' stroke-width='3'/><rect x='20' y='414' width='300' height='44' rx='10' fill='#7c3aed'/><text x='170' y='442' font-family='Arial, Helvetica, sans-serif' font-size='16' fill='white' text-anchor='middle' font-weight="bold">7. Comunicación</text><text x='340' y='442' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Lo cuento (dentro o fuera).</text></svg>