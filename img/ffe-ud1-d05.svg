<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Las seis propiedades de las l&#237;neas de campo</text><rect x="14.0" y="26.0" width="272.0" height="22.0" rx="3" fill="#f6fbf7" stroke="#16a34a" stroke-width="1"/><circle cx="26.0" cy="37.0" r="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="36.0" y="41.0" font-size="8.5" fill="#333" text-anchor="start">El campo es TANGENTE a la l&#237;nea en cada punto</text><rect x="14.0" y="51.0" width="272.0" height="22.0" rx="3" fill="#f6fbf7" stroke="#16a34a" stroke-width="1"/><circle cx="26.0" cy="62.0" r="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="36.0" y="66.0" font-size="8.5" fill="#333" text-anchor="start">Son ABIERTAS: salen de las + y llegan a las &#8722;</text><rect x="14.0" y="76.0" width="272.0" height="22.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1"/><circle cx="26.0" cy="87.0" r="3" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="36.0" y="91.0" font-size="8.5" fill="#333" text-anchor="start">NO pueden cortarse nunca</text><rect x="14.0" y="101.0" width="272.0" height="22.0" rx="3" fill="#f6fbf7" stroke="#16a34a" stroke-width="1"/><circle cx="26.0" cy="112.0" r="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="36.0" y="116.0" font-size="8.5" fill="#333" text-anchor="start">Donde hay m&#225;s densidad de l&#237;neas, el campo es mayor</text><rect x="14.0" y="126.0" width="272.0" height="22.0" rx="3" fill="#f6fbf7" stroke="#16a34a" stroke-width="1"/><circle cx="26.0" cy="137.0" r="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="36.0" y="141.0" font-size="8.5" fill="#333" text-anchor="start">El n&#186; de l&#237;neas es proporcional a la carga</text><rect x="14.0" y="151.0" width="272.0" height="22.0" rx="3" fill="#f6fbf7" stroke="#16a34a" stroke-width="1"/><circle cx="26.0" cy="162.0" r="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="36.0" y="166.0" font-size="8.5" fill="#333" text-anchor="start">Muy lejos: igualmente espaciadas y radiales</text><text x="150.0" y="186.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">La de rojo es la que ponen como FALSA en el examen.</text></svg>