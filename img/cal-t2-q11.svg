<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_8877" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_8877" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">lím (x + 3)²/(x − 3)³  cuando x → 9</text><rect x="14.0" y="24.0" width="128.0" height="52.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="78.0" y="38.0" font-size="8.8" fill="#333" text-anchor="middle" font-weight="bold">Arriba: (9 + 3)²</text><text x="78.0" y="53.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">= 12² = 144</text><text x="78.0" y="68.0" font-size="7.8" fill="#999" text-anchor="middle">(no es 0)</text><rect x="158.0" y="24.0" width="128.0" height="52.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.2"/><text x="222.0" y="38.0" font-size="8.8" fill="#333" text-anchor="middle" font-weight="bold">Abajo: (9 − 3)³</text><text x="222.0" y="53.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">= 6³ = 216</text><text x="222.0" y="68.0" font-size="7.8" fill="#999" text-anchor="middle">(no es 0)</text><line x1="78.0" y1="78.0" x2="130.0" y2="96.0" stroke="#999" stroke-width="1.2" marker-end="url(#a1_8877)"/><line x1="222.0" y1="78.0" x2="170.0" y2="96.0" stroke="#999" stroke-width="1.2" marker-end="url(#a2_8877)"/><rect x="80.0" y="98.0" width="140.0" height="28.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="116.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">144/216 = 2/3</text><text x="150.0" y="142.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Sin 0 abajo y sin ∞: no hay indeterminación → sustituir</text><text x="150.0" y="155.0" font-size="7.8" fill="#999" text-anchor="middle">(144 y 216 se dividen entre 72: 2 y 3)</text></svg>