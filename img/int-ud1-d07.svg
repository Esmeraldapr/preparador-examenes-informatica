<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Lo que pasa dentro de la cabeza del usuario</text><rect x="12.0" y="22.0" width="134.0" height="102.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="79.0" y="36.0" font-size="8" fill="#3b82f6" text-anchor="middle" font-weight="bold">PROCESOS COGNITIVOS</text><text x="20.0" y="50.0" font-size="7" fill="#333" text-anchor="start">&#183; Memoria a corto plazo</text><text x="20.0" y="60.5" font-size="7" fill="#333" text-anchor="start">&#183; Memoria a largo plazo</text><text x="20.0" y="71.0" font-size="7" fill="#333" text-anchor="start">&#183; Resolver problemas</text><text x="20.0" y="81.5" font-size="7" fill="#333" text-anchor="start">&#183; Tomar decisiones</text><text x="20.0" y="92.0" font-size="7" fill="#333" text-anchor="start">&#183; Lenguaje</text><text x="20.0" y="102.5" font-size="7" fill="#333" text-anchor="start">&#183; Memoria de b&#250;squeda</text><text x="20.0" y="113.0" font-size="7" fill="#333" text-anchor="start">&#183; Aprendizaje</text><rect x="154.0" y="22.0" width="134.0" height="102.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.3"/><text x="221.0" y="36.0" font-size="7.4" fill="#ef4444" text-anchor="middle" font-weight="bold">LO QUE BAJA EL RENDIMIENTO</text><text x="162.0" y="50.0" font-size="7" fill="#333" text-anchor="start">&#183; Fatiga y falta de sue&#241;o</text><text x="162.0" y="60.5" font-size="7" fill="#333" text-anchor="start">&#183; Carga mental excesiva</text><text x="162.0" y="71.0" font-size="7" fill="#333" text-anchor="start">&#183; Monoton&#237;a y aburrimiento</text><text x="162.0" y="81.5" font-size="7" fill="#333" text-anchor="start">&#183; Miedo, ansiedad, &#225;nimo</text><text x="162.0" y="92.0" font-size="7" fill="#333" text-anchor="start">&#183; Nutrici&#243;n y dieta</text><text x="162.0" y="102.5" font-size="7" fill="#333" text-anchor="start">&#183; Drogas, tabaco, alcohol</text><text x="162.0" y="113.0" font-size="7" fill="#333" text-anchor="start">&#183; Ritmos psicol&#243;gicos</text><rect x="12.0" y="130.0" width="276.0" height="20.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="150.0" y="144.0" font-size="7.6" fill="#16a34a" text-anchor="middle" font-weight="bold">La realimentaci&#243;n (saber el resultado) tambi&#233;n influye, y para bien.</text><rect x="12.0" y="154.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#333" stroke-width="1.2"/><text x="150.0" y="166.0" font-size="7.4" fill="#333" text-anchor="middle">Ojo: la INTELIGENCIA no est&#225; en la lista a prop&#243;sito; el temario dice</text><text x="150.0" y="176.0" font-size="7.4" fill="#333" text-anchor="middle" font-weight="bold">que su naturaleza es controvertida y dif&#237;cil de medir.</text></svg>