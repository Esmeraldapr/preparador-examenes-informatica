<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" font-family="Arial, sans-serif">
<rect width="600" height="230" fill="#ffffff"/>
<defs><marker id="c4la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="150" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1) ACERCO el polo N</text>
<rect x="20" y="70" width="50" height="40" fill="#3b82f6"/><rect x="70" y="70" width="50" height="40" fill="#ef4444"/>
<text x="45" y="96" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">S</text><text x="95" y="96" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">N</text>
<line x1="70" y1="130" x2="130" y2="130" stroke="#333" stroke-width="3" marker-end="url(#c4la)"/>
<text x="100" y="150" text-anchor="middle" font-size="12" fill="#333">el imán se acerca</text>
<ellipse cx="200" cy="90" rx="10" ry="45" fill="none" stroke="#7c3aed" stroke-width="5"/>
<text x="180" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#ef4444">N</text>
<text x="150" y="180" text-anchor="middle" font-size="13" fill="#333">La espira se hace un polo N</text>
<text x="150" y="198" text-anchor="middle" font-size="13" fill="#333">mirando al imán: N contra N</text>
<text x="150" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444">→ lo EMPUJA (frena el acercamiento)</text>
<line x1="300" y1="10" x2="300" y2="225" stroke="#ddd" stroke-width="2"/>
<text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2) ALEJO el polo N</text>
<rect x="320" y="70" width="50" height="40" fill="#3b82f6"/><rect x="370" y="70" width="50" height="40" fill="#ef4444"/>
<text x="345" y="96" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">S</text><text x="395" y="96" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">N</text>
<line x1="420" y1="130" x2="360" y2="130" stroke="#333" stroke-width="3" marker-end="url(#c4la)"/>
<text x="390" y="150" text-anchor="middle" font-size="12" fill="#333">el imán se aleja</text>
<ellipse cx="500" cy="90" rx="10" ry="45" fill="none" stroke="#7c3aed" stroke-width="5"/>
<text x="480" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3b82f6">S</text>
<text x="450" y="180" text-anchor="middle" font-size="13" fill="#333">La espira se hace un polo S</text>
<text x="450" y="198" text-anchor="middle" font-size="13" fill="#333">mirando al imán: S y N se atraen</text>
<text x="450" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">→ lo TIRA hacia atrás (frena la huida)</text>
</svg>
