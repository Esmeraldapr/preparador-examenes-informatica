<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 420' width='900' height='420'><defs></defs><rect width='900' height='420' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='bold' fill='#1e1b4b' text-anchor='start'>El ciclo de la interacción y el tiempo de respuesta</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Lo que explicó el profe al empezar la UD3. Se lee de izquierda a derecha.</text><line x1='40' y1='170' x2='860' y2='170' stroke='#999' stroke-width='2'/><circle cx='60' cy='170' r='9' fill='#7c3aed'/><text x='60' y='205' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#7c3aed' text-anchor='middle'>El usuario</text><text x='60' y='224' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#7c3aed' text-anchor='middle'>pulsa (clic, Intro)</text><circle cx='330' cy='170' r='9' fill='#3b82f6'/><text x='330' y='205' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#3b82f6' text-anchor='middle'>El sistema EMPIEZA</text><text x='330' y='224' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#3b82f6' text-anchor='middle'>a mostrar</text><circle cx='560' cy='170' r='9' fill='#3b82f6'/><text x='560' y='205' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#3b82f6' text-anchor='middle'>El sistema</text><text x='560' y='224' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#3b82f6' text-anchor='middle'>TERMINA</text><circle cx='830' cy='170' r='9' fill='#7c3aed'/><text x='830' y='205' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#7c3aed' text-anchor='middle'>Siguiente</text><text x='830' y='224' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#7c3aed' text-anchor='middle'>orden</text><rect x='60' y='112' width='270' height='40' rx='8' fill='#ef4444' fill-opacity='.12' stroke='#ef4444' stroke-width='2'/><text x='195' y='137' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#ef4444' text-anchor='middle'>TIEMPO DE RESPUESTA</text><rect x='330' y='112' width='230' height='40' rx='8' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2'/><text x='445' y='137' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#3b82f6' text-anchor='middle'>sale el resultado</text><rect x='560' y='112' width='270' height='40' rx='8' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2'/><text x='695' y='137' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#7c3aed' text-anchor='middle'>el usuario PIENSA</text><text x='20' y='270' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#1e1b4b' text-anchor='start'>Los números que dijo el profe:</text><circle cx='30' cy='295' r='6' fill='#16a34a'/><text x='46' y='300' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#16a34a' text-anchor='start'>Unos 160 milisegundos (0,16 s):</text><text x='300' y='300' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>el usuario empieza a notar que ya no es inmediato.</text><circle cx='30' cy='325' r='6' fill='#16a34a'/><text x='46' y='330' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#16a34a' text-anchor='start'>Menos de 1 segundo:</text><text x='300' y='330' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>suele mejorar el rendimiento (en tareas sencillas).</text><circle cx='30' cy='355' r='6' fill='#ef4444'/><text x='46' y='360' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#ef4444' text-anchor='start'>Más de unos 15 segundos:</text><text x='300' y='360' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>la productividad cae mucho y los errores suben.</text><circle cx='30' cy='385' r='6' fill='#ef4444'/><text x='46' y='390' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#ef4444' text-anchor='start'>Ni muy rápido ni muy lento:</text><text x='300' y='390' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>demasiado rápido, la gente decide sin pensar y se equivoca.</text></svg>