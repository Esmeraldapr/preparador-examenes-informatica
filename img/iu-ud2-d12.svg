<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Lo que hace bueno a un formulario</text><circle cx="26.0" cy="31.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="34.0" font-size="8" fill="#333" text-anchor="start">T&#237;tulo claro, sin jerga inform&#225;tica</text><circle cx="26.0" cy="47.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="50.0" font-size="8" fill="#333" text-anchor="start">Instrucciones breves y familiares</text><circle cx="26.0" cy="63.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="66.0" font-size="8" fill="#333" text-anchor="start">Campos relacionados juntos y en orden l&#243;gico</text><circle cx="26.0" cy="79.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="82.0" font-size="8" fill="#333" text-anchor="start">Etiquetas alineadas: sensaci&#243;n de orden</text><circle cx="26.0" cy="95.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="98.0" font-size="8" fill="#333" text-anchor="start">Moverse con el tabulador y las flechas</text><circle cx="26.0" cy="111.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="114.0" font-size="8" fill="#333" text-anchor="start">Impedir valores incorrectos antes de enviar</text><circle cx="26.0" cy="127.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="130.0" font-size="8" fill="#333" text-anchor="start">Errores con EJEMPLOS de valores v&#225;lidos</text><circle cx="26.0" cy="143.0" r="2.6" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="34.0" y="146.0" font-size="8" fill="#333" text-anchor="start">Obligatorios marcados a la vista (asterisco)</text><circle cx="26.0" cy="159.0" r="2.6" fill="#16a34a" stroke="#16a34a" stroke-width="1.6"/><text x="34.0" y="162.0" font-size="8" fill="#333" text-anchor="start">Se&#241;al clara de que has terminado</text><text x="150.0" y="186.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">La marcada en rojo es la que cae en el examen.</text></svg>