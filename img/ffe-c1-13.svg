<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 222" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Condensadores: capacidad y asociación</text><rect x="10.0" y="22.0" width="138.0" height="26.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="79.0" y="40.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">C = Q / V</text><rect x="152.0" y="22.0" width="138.0" height="26.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="221.0" y="40.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">C = ε₀ · S / d</text><text x="79.0" y="57.0" font-size="7.4" fill="#999" text-anchor="middle">unidad: faradio [F]</text><text x="221.0" y="57.0" font-size="7" fill="#999" text-anchor="middle">S = área de las placas, d = separación</text><rect x="10.0" y="66.0" width="138.0" height="74.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="79.0" y="80.0" font-size="8.6" fill="#ef4444" text-anchor="middle" font-weight="bold">EN SERIE</text><line x1="26.0" y1="96.0" x2="54.0" y2="96.0" stroke="#333" stroke-width="1.3"/><line x1="54.0" y1="87.0" x2="54.0" y2="105.0" stroke="#333" stroke-width="2"/><line x1="60.0" y1="87.0" x2="60.0" y2="105.0" stroke="#333" stroke-width="2"/><line x1="60.0" y1="96.0" x2="76.0" y2="96.0" stroke="#333" stroke-width="1.3"/><line x1="76.0" y1="87.0" x2="76.0" y2="105.0" stroke="#333" stroke-width="2"/><line x1="82.0" y1="87.0" x2="82.0" y2="105.0" stroke="#333" stroke-width="2"/><line x1="82.0" y1="96.0" x2="110.0" y2="96.0" stroke="#333" stroke-width="1.3"/><text x="57.0" y="116.0" font-size="7.6" fill="#333" text-anchor="middle">C₁</text><text x="79.0" y="116.0" font-size="7.6" fill="#333" text-anchor="middle">C₂</text><text x="79.0" y="132.0" font-size="7.4" fill="#ef4444" text-anchor="middle" font-weight="bold">1/C = 1/C₁ + 1/C₂ (suman las inversas)</text><rect x="152.0" y="66.0" width="138.0" height="74.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="221.0" y="80.0" font-size="8.6" fill="#16a34a" text-anchor="middle" font-weight="bold">EN PARALELO</text><line x1="176.0" y1="92.0" x2="266.0" y2="92.0" stroke="#333" stroke-width="1.3"/><line x1="176.0" y1="120.0" x2="266.0" y2="120.0" stroke="#333" stroke-width="1.3"/><line x1="200.0" y1="92.0" x2="200.0" y2="100.0" stroke="#333" stroke-width="1.3"/><line x1="191.0" y1="100.0" x2="209.0" y2="100.0" stroke="#333" stroke-width="2"/><line x1="191.0" y1="106.0" x2="209.0" y2="106.0" stroke="#333" stroke-width="2"/><line x1="200.0" y1="106.0" x2="200.0" y2="120.0" stroke="#333" stroke-width="1.3"/><line x1="242.0" y1="92.0" x2="242.0" y2="100.0" stroke="#333" stroke-width="1.3"/><line x1="233.0" y1="100.0" x2="251.0" y2="100.0" stroke="#333" stroke-width="2"/><line x1="233.0" y1="106.0" x2="251.0" y2="106.0" stroke="#333" stroke-width="2"/><line x1="242.0" y1="106.0" x2="242.0" y2="120.0" stroke="#333" stroke-width="1.3"/><text x="200.0" y="130.0" font-size="7.6" fill="#333" text-anchor="middle">C₁</text><text x="242.0" y="130.0" font-size="7.6" fill="#333" text-anchor="middle">C₂</text><text x="221.0" y="132.0" font-size="7" fill="#333" text-anchor="middle"></text><text x="221.0" y="146.0" font-size="7.8" fill="#16a34a" text-anchor="middle" font-weight="bold">C = C₁ + C₂ (se suman)</text><rect x="10.0" y="156.0" width="280.0" height="26.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="150.0" y="172.0" font-size="8.4" fill="#3b82f6" text-anchor="middle" font-weight="bold">En serie la capacidad equivalente es MENOR que en paralelo</text><text x="150.0" y="196.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">Truco: con los condensadores es al revés que con las resistencias.</text><text x="150.0" y="212.0" font-size="8" fill="#999" text-anchor="middle">Almacenan energía en forma de carga eléctrica.</text></svg>