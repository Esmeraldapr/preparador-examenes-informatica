<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Los tres tipos de material</text><rect x="10.0" y="24.0" width="88.0" height="84.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><text x="54.0" y="40.0" font-size="8.5" fill="#16a34a" text-anchor="middle" font-weight="bold">CONDUCTOR</text><text x="54.0" y="62.0" font-size="7.5" fill="#333" text-anchor="middle">los electrones se</text><text x="54.0" y="73.0" font-size="7.5" fill="#333" text-anchor="middle">mueven casi libres</text><text x="54.0" y="98.0" font-size="7.5" fill="#999" text-anchor="middle">cobre, metales</text><rect x="106.0" y="24.0" width="88.0" height="84.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="40.0" font-size="8.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">SEMICONDUCTOR</text><text x="150.0" y="62.0" font-size="7.5" fill="#333" text-anchor="middle">cuesta m&#225;s, pero</text><text x="150.0" y="73.0" font-size="7.5" fill="#333" text-anchor="middle">con campo se mueven</text><text x="150.0" y="98.0" font-size="7.5" fill="#999" text-anchor="middle">silicio, germanio</text><rect x="202.0" y="24.0" width="88.0" height="84.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.3"/><text x="246.0" y="40.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">AISLANTE o</text><text x="246.0" y="51.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">DIEL&#201;CTRICO</text><text x="246.0" y="66.0" font-size="7.5" fill="#333" text-anchor="middle">casi no se mueven:</text><text x="246.0" y="77.0" font-size="7.5" fill="#333" text-anchor="middle">se consideran fijas</text><text x="246.0" y="98.0" font-size="7.5" fill="#999" text-anchor="middle">pl&#225;stico, vidrio</text><text x="150.0" y="126.0" font-size="8.5" fill="#333" text-anchor="middle">El semiconductor es el del medio, y es la base de la</text><text x="150.0" y="138.0" font-size="8.5" fill="#333" text-anchor="middle">industria electr&#243;nica: sus propiedades se pueden cambiar</text><text x="150.0" y="150.0" font-size="8.5" fill="#333" text-anchor="middle">a&#241;adiendo peque&#241;as cantidades de otros materiales.</text></svg>