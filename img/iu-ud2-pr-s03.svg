<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_2142" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_2142" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker></defs><text x="150.0" y="13.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">C&#243;mo se implementa el deshacer: una PILA</text><rect x="70.0" y="26.0" width="160.0" height="24.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="42.0" font-size="9" fill="#7c3aed" text-anchor="middle">escribir &#171;hola&#187;</text><rect x="70.0" y="54.0" width="160.0" height="24.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="70.0" font-size="9" fill="#7c3aed" text-anchor="middle">poner negrita</text><rect x="70.0" y="82.0" width="160.0" height="24.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="98.0" font-size="9" fill="#ef4444" text-anchor="middle">borrar l&#237;nea</text><line x1="246.0" y1="34.0" x2="246.0" y2="96.0" stroke="#999" stroke-width="1.2" marker-end="url(#a1_2142)"/><text x="262.0" y="60.0" font-size="7.5" fill="#999" text-anchor="middle">entran</text><text x="262.0" y="70.0" font-size="7.5" fill="#999" text-anchor="middle">por abajo</text><line x1="54.0" y1="96.0" x2="54.0" y2="34.0" stroke="#16a34a" stroke-width="1.3" marker-end="url(#a2_2142)"/><text x="34.0" y="60.0" font-size="7.5" fill="#16a34a" text-anchor="middle">sale la</text><text x="34.0" y="70.0" font-size="7.5" fill="#16a34a" text-anchor="middle">&#250;ltima</text><text x="150.0" y="126.0" font-size="8.5" fill="#333" text-anchor="middle">Las acciones se insertan al final de la estructura y, al</text><text x="150.0" y="138.0" font-size="8.5" fill="#333" text-anchor="middle">deshacer, se extraen las &#218;LTIMAS para revertir su efecto.</text><text x="150.0" y="153.0" font-size="8.5" fill="#16a34a" text-anchor="middle" font-weight="bold">Por eso deshacer va siempre hacia atr&#225;s, en orden inverso.</text></svg>