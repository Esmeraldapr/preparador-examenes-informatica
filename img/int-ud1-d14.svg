<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Entrada de datos: los cinco objetivos</text><rect x="12.0" y="24.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="38.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">1. Consistencia</text><text x="124.0" y="38.5" font-size="7.4" fill="#7c3aed" text-anchor="start">mismas secuencias y abreviaturas siempre</text><rect x="12.0" y="48.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="62.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">2. M&#237;nimas acciones</text><text x="124.0" y="62.5" font-size="7.4" fill="#3b82f6" text-anchor="start">elegir de una lista mejor que teclear</text><rect x="12.0" y="72.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="86.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">3. M&#237;nima memoria</text><text x="124.0" y="86.5" font-size="7.4" fill="#16a34a" text-anchor="start">nada de c&#243;digos largos de memoria</text><rect x="12.0" y="96.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="110.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">4. Compatibilidad</text><text x="124.0" y="110.5" font-size="7.4" fill="#ef4444" text-anchor="start">lo que se teclea igual que lo que se ve</text><rect x="12.0" y="120.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#999" stroke-width="1"/><text x="22.0" y="134.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">5. Flexibilidad</text><text x="124.0" y="134.5" font-size="7.4" fill="#999" text-anchor="start">el experto elige su propio orden</text><rect x="12.0" y="148.0" width="276.0" height="36.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="161.0" font-size="7.4" fill="#333" text-anchor="middle">Ojo con el 5: la flexibilidad va EN CONTRA de la consistencia,</text><text x="150.0" y="173.0" font-size="7.4" fill="#ef4444" text-anchor="middle" font-weight="bold">as&#237; que el temario avisa de usarla con precauci&#243;n.</text></svg>