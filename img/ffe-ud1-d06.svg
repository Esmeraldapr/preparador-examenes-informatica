<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 164" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a2_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a3_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a4_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a5_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a6_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a7_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker><marker id="a8_7946" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker></defs><text x="150.0" y="13.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">El flujo depende de c&#243;mo pongas la superficie</text><text x="78.0" y="30.0" font-size="8.5" fill="#333" text-anchor="middle">Superficie PARALELA al campo</text><line x1="20.0" y1="42.0" x2="136.0" y2="42.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a1_7946)"/><line x1="20.0" y1="51.0" x2="136.0" y2="51.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a2_7946)"/><line x1="20.0" y1="60.0" x2="136.0" y2="60.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a3_7946)"/><line x1="20.0" y1="69.0" x2="136.0" y2="69.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a4_7946)"/><line x1="50" y1="58" x2="106" y2="58" stroke="#ef4444" stroke-width="4"/><text x="78.0" y="92.0" font-size="8" fill="#ef4444" text-anchor="middle">no la atraviesa ninguna l&#237;nea</text><text x="78.0" y="105.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">&#966; = 0  (flujo NULO)</text><text x="226.0" y="30.0" font-size="8.5" fill="#333" text-anchor="middle">Superficie PERPENDICULAR</text><line x1="168.0" y1="42.0" x2="284.0" y2="42.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a5_7946)"/><line x1="168.0" y1="51.0" x2="284.0" y2="51.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a6_7946)"/><line x1="168.0" y1="60.0" x2="284.0" y2="60.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a7_7946)"/><line x1="168.0" y1="69.0" x2="284.0" y2="69.0" stroke="#16a34a" stroke-width="1.1" marker-end="url(#a8_7946)"/><line x1="226" y1="38" x2="226" y2="82" stroke="#ef4444" stroke-width="4"/><text x="226.0" y="92.0" font-size="8" fill="#16a34a" text-anchor="middle">la atraviesan todas</text><text x="226.0" y="105.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">&#966; = M&#193;XIMO</text><text x="150.0" y="128.0" font-size="8.5" fill="#333" text-anchor="middle">El flujo es el producto escalar de E por el vector superficie,</text><text x="150.0" y="140.0" font-size="8.5" fill="#333" text-anchor="middle">y ese vector es PERPENDICULAR a la superficie.</text><text x="150.0" y="158.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">Por eso &#171;superficie perpendicular al campo&#187; = flujo m&#225;ximo.</text></svg>