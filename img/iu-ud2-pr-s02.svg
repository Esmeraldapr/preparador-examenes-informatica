<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="78.0" y="13.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="bold">BIEN: en gris</text><text x="226.0" y="13.0" font-size="9.5" fill="#ef4444" text-anchor="middle" font-weight="bold">MAL: eliminado</text><rect x="26.0" y="22.0" width="104.0" height="76.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="78.0" y="38.0" font-size="9" fill="#333" text-anchor="middle">Cortar</text><text x="78.0" y="55.0" font-size="9" fill="#333" text-anchor="middle">Copiar</text><text x="78.0" y="72.0" font-size="9" fill="#bbb" text-anchor="middle">Pegar</text><text x="78.0" y="89.0" font-size="9" fill="#333" text-anchor="middle">Buscar</text><rect x="174.0" y="22.0" width="104.0" height="76.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="226.0" y="38.0" font-size="9" fill="#333" text-anchor="middle">Cortar</text><text x="226.0" y="55.0" font-size="9" fill="#333" text-anchor="middle">Copiar</text><text x="226.0" y="72.0" font-size="9" fill="#333" text-anchor="middle">Buscar</text><text x="226.0" y="89.0" font-size="7" fill="#ef4444" text-anchor="middle">(Buscar se ha movido)</text><text x="150.0" y="116.0" font-size="8.5" fill="#333" text-anchor="middle">Si quitas la opci&#243;n, las dem&#225;s cambian de sitio</text><text x="150.0" y="128.0" font-size="8.5" fill="#333" text-anchor="middle">y el usuario ya no las encuentra donde esperaba.</text><text x="150.0" y="144.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">La constancia en las posiciones es un principio:</text><text x="150.0" y="155.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">lo que no se puede usar se pone en gris, no se borra.</text></svg>