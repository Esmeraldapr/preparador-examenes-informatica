<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">√2 = 1,41421356… sin patrón que se repita</text><rect x="10.0" y="24.0" width="280.0" height="30.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.3"/><text x="150.0" y="44.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">1,41421356237309504880…</text><text x="150.0" y="70.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">No se corta nunca y nunca se repite un bloque</text><text x="150.0" y="84.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">→ no se puede escribir como fracción de enteros</text><rect x="70.0" y="96.0" width="160.0" height="24.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.5"/><text x="150.0" y="112.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">IRRACIONAL</text><line x1="24.0" y1="140.0" x2="276.0" y2="140.0" stroke="#999" stroke-width="1.3"/><line x1="100.0" y1="136.0" x2="100.0" y2="144.0" stroke="#999" stroke-width="1.2"/><text x="100.0" y="156.0" font-size="8.5" fill="#999" text-anchor="middle">1</text><line x1="240.0" y1="136.0" x2="240.0" y2="144.0" stroke="#999" stroke-width="1.2"/><text x="240.0" y="156.0" font-size="8.5" fill="#999" text-anchor="middle">2</text><circle cx="158.0" cy="140.0" r="4" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="158.0" y="130.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">√2</text><text x="150.0" y="174.0" font-size="8" fill="#999" text-anchor="middle">Está entre 1 y 2: por eso no es natural ni entero.</text></svg>