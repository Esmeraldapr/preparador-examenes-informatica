<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 192" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Cada tipo de sistema prioriza una cosa</text><rect x="12.0" y="24.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="38.0" font-size="7.6" fill="#333" text-anchor="start" font-weight="bold">Cr&#237;ticos para la vida</text><text x="130.0" y="38.0" font-size="7.6" fill="#ef4444" text-anchor="start">fiabilidad sin errores; da igual el coste</text><rect x="12.0" y="47.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="61.0" font-size="7.6" fill="#333" text-anchor="start" font-weight="bold">Industriales y comerciales</text><text x="130.0" y="61.0" font-size="7.6" fill="#3b82f6" text-anchor="start">el COSTE manda; y la seguridad</text><rect x="12.0" y="70.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="84.0" font-size="7.6" fill="#333" text-anchor="start" font-weight="bold">Casa y entretenimiento</text><text x="130.0" y="84.0" font-size="7.6" fill="#16a34a" text-anchor="start">facilidad de uso y satisfacci&#243;n</text><rect x="12.0" y="93.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="107.0" font-size="7.6" fill="#333" text-anchor="start" font-weight="bold">Exploraci&#243;n y creativas</text><text x="130.0" y="107.0" font-size="7.6" fill="#7c3aed" text-anchor="start">que el ordenador &#171;desaparezca&#187;</text><rect x="12.0" y="116.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#999" stroke-width="1"/><text x="22.0" y="130.0" font-size="7.6" fill="#333" text-anchor="start" font-weight="bold">Sociot&#233;cnicos</text><text x="130.0" y="130.0" font-size="7.6" fill="#999" text-anchor="start">confianza, privacidad y responsabilidad</text><rect x="12.0" y="143.0" width="276.0" height="42.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="157.0" font-size="7.6" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen: &#171;en sistemas cr&#237;ticos para la vida se asume un</text><text x="150.0" y="168.0" font-size="7.6" fill="#333" text-anchor="middle">periodo largo de aprendizaje porque se quiere obtener un</text><text x="150.0" y="179.0" font-size="7.6" fill="#333" text-anchor="middle">manejo r&#225;pido y libre de errores&#187;.</text></svg>