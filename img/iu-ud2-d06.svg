<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Qu&#233; debe traer un mensaje de error</text><rect x="16.0" y="24.0" width="268.0" height="24.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="35.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">1. Qu&#233; software lo genera</text><text x="26.0" y="45.0" font-size="7.5" fill="#333" text-anchor="start">programa, m&#243;dulo o librer&#237;a</text><rect x="16.0" y="51.0" width="268.0" height="24.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="62.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">2. C&#243;digo un&#237;voco</text><text x="26.0" y="72.0" font-size="7.5" fill="#333" text-anchor="start">para poder buscarlo</text><rect x="16.0" y="78.0" width="268.0" height="24.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="89.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">3. Nivel de gravedad</text><text x="26.0" y="99.0" font-size="7.5" fill="#333" text-anchor="start">&#191;puedo seguir trabajando?</text><rect x="16.0" y="105.0" width="268.0" height="24.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="116.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">4. Qu&#233; pasa y por qu&#233;</text><text x="26.0" y="126.0" font-size="7.5" fill="#333" text-anchor="start">claro, sencillo y concreto</text><rect x="16.0" y="132.0" width="268.0" height="24.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="143.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">5. C&#243;mo solucionarlo</text><text x="26.0" y="153.0" font-size="7.5" fill="#333" text-anchor="start">al menos un camino a seguir</text><text x="150.0" y="166.0" font-size="7.5" fill="#ef4444" text-anchor="middle">Mal: &#171;Error&#187;, &#171;Operaci&#243;n ilegal&#187;. Bien: &#171;Los meses van del 1 al 12&#187;.</text></svg>