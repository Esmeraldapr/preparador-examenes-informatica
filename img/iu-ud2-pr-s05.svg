<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="78.0" y="13.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">MAL</text><text x="226.0" y="13.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">BIEN</text><rect x="14.0" y="22.0" width="124.0" height="54.0" rx="3" fill="#fff6f6" stroke="#ef4444" stroke-width="1.3"/><text x="76.0" y="44.0" font-size="9.5" fill="#ef4444" text-anchor="middle" font-weight="bold">Error de sintaxis</text><text x="76.0" y="60.0" font-size="9.5" fill="#ef4444" text-anchor="middle" font-weight="bold">Operaci&#243;n ilegal</text><rect x="162.0" y="22.0" width="124.0" height="54.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.3"/><text x="224.0" y="40.0" font-size="8.5" fill="#16a34a" text-anchor="middle">La impresora est&#225;</text><text x="224.0" y="52.0" font-size="8.5" fill="#16a34a" text-anchor="middle">apagada, por favor,</text><text x="224.0" y="64.0" font-size="8.5" fill="#16a34a" text-anchor="middle">enci&#233;ndala</text><text x="78.0" y="90.0" font-size="8" fill="#999" text-anchor="middle">vago y hostil</text><text x="226.0" y="90.0" font-size="8" fill="#999" text-anchor="middle">espec&#237;fico y constructivo</text><text x="150.0" y="112.0" font-size="8.5" fill="#333" text-anchor="middle">Un buen mensaje dice QU&#201; HACER, no solo que hay</text><text x="150.0" y="124.0" font-size="8.5" fill="#333" text-anchor="middle">un problema. Y as&#237; se resuelven m&#225;s errores, se repiten</text><text x="150.0" y="136.0" font-size="8.5" fill="#333" text-anchor="middle">menos en el futuro y sube la satisfacci&#243;n subjetiva.</text><text x="150.0" y="148.0" font-size="8" fill="#ef4444" text-anchor="middle">Pero prevenir el error sigue siendo mejor que explicarlo.</text></svg>