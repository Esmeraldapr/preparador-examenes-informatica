<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Intervalos: paréntesis o corchete</text><text x="150.0" y="30.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">( ) = el extremo NO entra    [ ] = el extremo SÍ entra</text><line x1="24.0" y1="56.0" x2="276.0" y2="56.0" stroke="#999" stroke-width="1.2"/><line x1="108.0" y1="56.0" x2="192.0" y2="56.0" stroke="#7c3aed" stroke-width="4.5"/><circle cx="108.0" cy="56.0" r="4.2" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><circle cx="192.0" cy="56.0" r="4.2" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="108.0" y="70.0" font-size="8.5" fill="#333" text-anchor="middle">2</text><text x="192.0" y="70.0" font-size="8.5" fill="#333" text-anchor="middle">5</text><text x="276.0" y="49.0" font-size="9" fill="#7c3aed" text-anchor="end" font-weight="bold">(2, 5]</text><line x1="24.0" y1="100.0" x2="276.0" y2="100.0" stroke="#999" stroke-width="1.2"/><line x1="136.0" y1="100.0" x2="248.0" y2="100.0" stroke="#7c3aed" stroke-width="4.5"/><circle cx="136.0" cy="100.0" r="4.2" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><circle cx="248.0" cy="100.0" r="4.2" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="136.0" y="114.0" font-size="8.5" fill="#333" text-anchor="middle">3</text><text x="248.0" y="114.0" font-size="8.5" fill="#333" text-anchor="middle">7</text><text x="276.0" y="93.0" font-size="9" fill="#7c3aed" text-anchor="end" font-weight="bold">(3, 7]  =  3 &lt; x ≤ 7</text><line x1="24.0" y1="144.0" x2="276.0" y2="144.0" stroke="#999" stroke-width="1.2"/><line x1="52.0" y1="144.0" x2="164.0" y2="144.0" stroke="#7c3aed" stroke-width="4.5"/><circle cx="52.0" cy="144.0" r="4.2" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><circle cx="164.0" cy="144.0" r="4.2" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><text x="52.0" y="158.0" font-size="8.5" fill="#333" text-anchor="middle">0</text><text x="164.0" y="158.0" font-size="8.5" fill="#333" text-anchor="middle">4</text><text x="276.0" y="137.0" font-size="9" fill="#7c3aed" text-anchor="end" font-weight="bold">[0, 4)</text><rect x="10.0" y="160.0" width="280.0" height="30.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.3"/><text x="150.0" y="173.0" font-size="8.8" fill="#16a34a" text-anchor="middle" font-weight="bold">&lt; y &gt; → paréntesis   ·   ≤ y ≥ → corchete</text><text x="150.0" y="185.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">∞ siempre con paréntesis: (−∞, 3]  ·  (0, +∞)</text></svg>