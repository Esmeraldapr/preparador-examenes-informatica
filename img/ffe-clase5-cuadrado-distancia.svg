<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="290" fill="#fff"/>
<circle cx="150" cy="140" r="40" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="150" cy="140" r="80" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="150" cy="140" r="120" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="150" cy="140" r="7" fill="#f59e0b"/>
<text x="120" y="160" font-size="11" fill="#333">bombilla</text>
<text x="180" y="112" font-size="12" fill="#ef4444" font-weight="bold">1 m</text>
<text x="218" y="78" font-size="12" fill="#7c3aed" font-weight="bold">2 m</text>
<text x="252" y="44" font-size="12" fill="#3b82f6" font-weight="bold">3 m</text>
<text x="300" y="30" font-size="15" fill="#333" font-weight="bold">La misma luz se reparte</text><text x="300" y="50" font-size="15" fill="#333" font-weight="bold">en esferas más grandes</text>
<text x="300" y="80" font-size="14" fill="#ef4444">A 1 m: I = 80 mW/m²</text>
<text x="300" y="110" font-size="14" fill="#7c3aed">A 2 m: distancia x 2</text>
<text x="300" y="130" font-size="14" fill="#7c3aed">2² = 4</text>
<text x="300" y="150" font-size="14" fill="#7c3aed">I = 80 / 4 = 20 mW/m²</text>
<text x="300" y="180" font-size="14" fill="#3b82f6">A 3 m: distancia x 3</text>
<text x="300" y="200" font-size="14" fill="#3b82f6">3² = 9</text>
<text x="300" y="220" font-size="14" fill="#3b82f6">I = 80 / 9 = 8,9 mW/m²</text>
<text x="20" y="275" font-size="14" fill="#16a34a" font-weight="bold">Regla: el doble de lejos → la cuarta parte (1/4). El triple → la novena parte (1/9).</text>
</svg>