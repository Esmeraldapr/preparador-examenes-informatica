<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 172" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">24/99: simplifica y mira si queda entero</text><rect x="60.0" y="24.0" width="180.0" height="30.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="44.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">24/99 = 8/33</text><text x="150.0" y="68.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">33 no divide a 8 → NO es un número entero</text><text x="150.0" y="84.0" font-size="8.6" fill="#333" text-anchor="middle">pero sigue siendo una fracción de dos enteros</text><rect x="60.0" y="96.0" width="180.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="112.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">Número RACIONAL</text><rect x="10.0" y="128.0" width="280.0" height="36.0" rx="3" fill="#f7f7f9" stroke="#999" stroke-width="1.1"/><text x="150.0" y="142.0" font-size="8.2" fill="#999" text-anchor="middle" font-weight="bold">Natural o entero solo si al simplificar queda un entero</text><text x="150.0" y="156.0" font-size="8.2" fill="#999" text-anchor="middle">(por ejemplo 24/8 = 3 sí sería natural y entero).</text></svg>