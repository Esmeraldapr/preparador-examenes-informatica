<text x='20' y='372' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b'>Cada número es más grande que el anterior: 1, 2, 3, 4… (monótona creciente).</text>
<text x='20' y='396' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b'>Pero no tiene techo, se va a infinito: NO converge. Monótona sola NO basta.</text>
