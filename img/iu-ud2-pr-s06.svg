<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">Por qu&#233; hablarle al ordenador no es la soluci&#243;n</text><rect x="14.0" y="24.0" width="128.0" height="54.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.2"/><text x="78.0" y="42.0" font-size="8.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">El ordenador MUESTRA</text><text x="78.0" y="58.0" font-size="15" fill="#3b82f6" text-anchor="middle" font-weight="bold">&#215;1000</text><text x="78.0" y="72.0" font-size="7.5" fill="#333" text-anchor="middle">m&#225;s r&#225;pido</text><rect x="158.0" y="24.0" width="128.0" height="54.0" rx="3" fill="#fff6f6" stroke="#ef4444" stroke-width="1.2"/><text x="222.0" y="42.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">El humano ESCRIBE</text><text x="222.0" y="58.0" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">despacio</text><text x="222.0" y="72.0" font-size="7.5" fill="#333" text-anchor="middle">y con errores</text><text x="150.0" y="96.0" font-size="8.5" fill="#333" text-anchor="middle">Si el cuello de botella es lo que tarda la persona en</text><text x="150.0" y="108.0" font-size="8.5" fill="#333" text-anchor="middle">escribir, hablarle al ordenador no arregla nada.</text><text x="150.0" y="126.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">La ventaja real del ordenador es ENSE&#209;AR mucha</text><text x="150.0" y="138.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">informaci&#243;n y dejar que el usuario SELECCIONE.</text><text x="150.0" y="154.0" font-size="8" fill="#999" text-anchor="middle">Por eso los men&#250;s siguen ganando al lenguaje natural.</text></svg>