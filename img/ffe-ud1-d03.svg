<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Campo y fuerza: no son lo mismo</text><rect x="12.0" y="22.0" width="134.0" height="76.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="79.0" y="38.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">CAMPO  E</text><text x="79.0" y="54.0" font-size="8" fill="#333" text-anchor="middle">lo crea la carga fuente</text><text x="79.0" y="66.0" font-size="8" fill="#333" text-anchor="middle">y existe aunque no</text><text x="79.0" y="77.0" font-size="8" fill="#333" text-anchor="middle">pongas nada ah&#237;</text><text x="79.0" y="92.0" font-size="7.5" fill="#999" text-anchor="middle">se mide en N/C</text><rect x="154.0" y="22.0" width="134.0" height="76.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.3"/><text x="221.0" y="38.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">FUERZA  F</text><text x="221.0" y="54.0" font-size="8" fill="#333" text-anchor="middle">aparece solo cuando</text><text x="221.0" y="66.0" font-size="8" fill="#333" text-anchor="middle">pones una carga</text><text x="221.0" y="77.0" font-size="8" fill="#333" text-anchor="middle">de prueba en el campo</text><text x="221.0" y="92.0" font-size="7.5" fill="#999" text-anchor="middle">se mide en newtons</text><rect x="40.0" y="106.0" width="220.0" height="26.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.2"/><text x="150.0" y="123.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">F = q&#8320; &#183; E</text><text x="150.0" y="146.0" font-size="8.5" fill="#333" text-anchor="middle">El campo es la fuerza POR UNIDAD de carga: E = F / q&#8320;.</text></svg>