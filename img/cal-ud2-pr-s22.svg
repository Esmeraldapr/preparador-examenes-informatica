<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Bolzano: cu&#225;nto hace falta pedir</text><rect x="14.0" y="26.0" width="272.0" height="40.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="22.0" y="42.0" font-size="9.5" fill="#16a34a" text-anchor="start" font-weight="bold">Que EXISTA ra&#237;z</text><text x="22.0" y="57.0" font-size="8.5" fill="#333" text-anchor="start">continua + cambio de signo</text><rect x="14.0" y="72.0" width="272.0" height="40.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="22.0" y="88.0" font-size="9.5" fill="#3b82f6" text-anchor="start" font-weight="bold">Que sea &#218;NICA</text><text x="22.0" y="103.0" font-size="8.5" fill="#333" text-anchor="start">lo anterior + derivable y mon&#243;tona</text><rect x="14.0" y="118.0" width="272.0" height="40.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="22.0" y="134.0" font-size="9.5" fill="#ef4444" text-anchor="start" font-weight="bold">Que NO haya ra&#237;z</text><text x="22.0" y="149.0" font-size="8.5" fill="#333" text-anchor="start">producto &gt; 0 + continua, derivable</text><text x="150.0" y="176.0" font-size="8.5" fill="#ef4444" text-anchor="middle">Si solo piden que exista, derivable NO hace falta.</text></svg>