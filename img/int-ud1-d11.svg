<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Accesibilidad: las guías del W3C</text><rect x="12.0" y="24.0" width="276.0" height="23.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="39.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Alternativas textuales</text><text x="124.0" y="39.0" font-size="7.4" fill="#7c3aed" text-anchor="start">texto para toda imagen, audio o v&#237;deo</text><rect x="12.0" y="49.0" width="276.0" height="23.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="64.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Recursos con el tiempo</text><text x="124.0" y="64.0" font-size="7.4" fill="#3b82f6" text-anchor="start">subt&#237;tulos y audiodescripci&#243;n</text><rect x="12.0" y="74.0" width="276.0" height="23.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="89.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Distinguible</text><text x="124.0" y="89.0" font-size="7.4" fill="#16a34a" text-anchor="start">separar fondo y contenido; el color NO basta</text><rect x="12.0" y="99.0" width="276.0" height="23.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="114.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Predecible</text><text x="124.0" y="114.0" font-size="7.4" fill="#ef4444" text-anchor="start">que la p&#225;gina act&#250;e siempre igual</text><rect x="12.0" y="128.0" width="276.0" height="36.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="141.0" font-size="7.4" fill="#333" text-anchor="middle">Hay TRES niveles de conformidad y el propio W3C da herramientas</text><text x="150.0" y="153.0" font-size="7.4" fill="#333" text-anchor="middle" font-weight="bold">para comprobarlos. Todo esto sirve a los lectores de pantalla.</text></svg>