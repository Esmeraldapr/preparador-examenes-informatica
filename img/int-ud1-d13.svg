<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 206" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Ocho formas de atraer la atenci&#243;n (con n&#250;mero)</text><rect x="12.0" y="22.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="34.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Intensidad</text><text x="116.0" y="34.0" font-size="7.2" fill="#7c3aed" text-anchor="start">solo DOS niveles (negrita y normal)</text><rect x="12.0" y="41.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="53.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Marcar</text><text x="116.0" y="53.0" font-size="7.2" fill="#3b82f6" text-anchor="start">subrayar, recuadrar, flecha, asterisco</text><rect x="12.0" y="60.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="72.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Tama&#241;o</text><text x="116.0" y="72.0" font-size="7.2" fill="#16a34a" text-anchor="start">hasta CUATRO tama&#241;os de letra</text><rect x="12.0" y="79.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="91.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Fuentes</text><text x="116.0" y="91.0" font-size="7.2" fill="#7c3aed" text-anchor="start">hasta TRES tipos de letra distintos</text><rect x="12.0" y="98.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="110.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">V&#237;deo inverso</text><text x="116.0" y="110.0" font-size="7.2" fill="#3b82f6" text-anchor="start">invertir los colores</text><rect x="12.0" y="117.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="129.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Parpadeo</text><text x="116.0" y="129.0" font-size="7.2" fill="#ef4444" text-anchor="start">con mucho cuidado y en zonas peque&#241;as</text><rect x="12.0" y="136.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="148.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Color</text><text x="116.0" y="148.0" font-size="7.2" fill="#16a34a" text-anchor="start">hasta CUATRO colores est&#225;ndar</text><rect x="12.0" y="155.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="167.0" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Sonido</text><text x="116.0" y="167.0" font-size="7.2" fill="#ef4444" text-anchor="start">suave = bien; duro = emergencia</text><rect x="12.0" y="176.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="188.0" font-size="7.4" fill="#ef4444" text-anchor="middle" font-weight="bold">Los n&#250;meros son lo que preguntan: 2 intensidades, 3 fuentes,</text><text x="150.0" y="198.0" font-size="7.2" fill="#333" text-anchor="middle">4 tama&#241;os y 4 colores. Pas&#225;rse crea pantallas abarrotadas.</text></svg>