<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a2_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a3_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a4_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a5_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a6_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a7_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker><marker id="a8_3274" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ley de Gauss: lo que importa es la carga de DENTRO</text><rect x="10.0" y="22.0" width="280.0" height="26.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="150.0" y="40.0" font-size="9.4" fill="#333" text-anchor="middle" font-weight="bold">Φ = Q interior / ε₀         ε₀ = 8,854 × 10⁻¹² C²/(N·m²)</text><path d="M38,105 C38,61 122,61 122,105 C122,147 38,147 38,105" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.6"/><circle cx="80.0" cy="105.0" r="6" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="80.0" y="107.6" font-size="7.5" fill="#fff" text-anchor="middle" font-weight="bold">+</text><line x1="88.0" y1="105.0" x2="134.0" y2="105.0" stroke="#333" stroke-width="1" marker-end="url(#a1_3274)"/><line x1="85.7" y1="99.3" x2="118.2" y2="66.8" stroke="#333" stroke-width="1" marker-end="url(#a2_3274)"/><line x1="80.0" y1="97.0" x2="80.0" y2="51.0" stroke="#333" stroke-width="1" marker-end="url(#a3_3274)"/><line x1="74.3" y1="99.3" x2="41.8" y2="66.8" stroke="#333" stroke-width="1" marker-end="url(#a4_3274)"/><line x1="72.0" y1="105.0" x2="26.0" y2="105.0" stroke="#333" stroke-width="1" marker-end="url(#a5_3274)"/><line x1="74.3" y1="110.7" x2="41.8" y2="143.2" stroke="#333" stroke-width="1" marker-end="url(#a6_3274)"/><line x1="80.0" y1="113.0" x2="80.0" y2="159.0" stroke="#333" stroke-width="1" marker-end="url(#a7_3274)"/><line x1="85.7" y1="110.7" x2="118.2" y2="143.2" stroke="#333" stroke-width="1" marker-end="url(#a8_3274)"/><text x="80.0" y="167.0" font-size="7.6" fill="#16a34a" text-anchor="middle" font-weight="bold">superficie cerrada</text><rect x="140.0" y="62.0" width="150.0" height="86.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.2"/><text x="215.0" y="78.0" font-size="8.8" fill="#3b82f6" text-anchor="middle" font-weight="bold">¿Para qué sirve?</text><text x="215.0" y="94.0" font-size="7.8" fill="#333" text-anchor="middle" font-weight="bold">Cuando hay mucha SIMETRÍA</text><text x="215.0" y="106.0" font-size="7.8" fill="#333" text-anchor="middle">(esfera, cilindro, plano) permite</text><text x="215.0" y="118.0" font-size="7.8" fill="#333" text-anchor="middle">sacar el campo sin integrar.</text><text x="215.0" y="136.0" font-size="7.8" fill="#ef4444" text-anchor="middle" font-weight="bold">Una carga fuera NO aporta flujo.</text><text x="150.0" y="180.0" font-size="8.2" fill="#333" text-anchor="middle">El flujo neto por una superficie cerrada solo depende de la</text><text x="150.0" y="192.0" font-size="8.2" fill="#333" text-anchor="middle">carga encerrada dentro, no de la forma de la superficie.</text><text x="150.0" y="208.0" font-size="7.8" fill="#999" text-anchor="middle">En clase: ε₀ aproximado según lo que indique el enunciado.</text></svg>