<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">¿Cuándo se quita un valor del dominio?</text><rect x="10.0" y="24.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="38.0" font-size="9" fill="#ef4444" text-anchor="start" font-weight="bold">1 / g(x)</text><text x="20.0" y="51.0" font-size="8.2" fill="#333" text-anchor="start" font-weight="bold">se quitan los x con g(x) = 0</text><text x="282.0" y="51.0" font-size="7.4" fill="#999" text-anchor="end">(no se divide entre 0)</text><rect x="10.0" y="64.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="20.0" y="78.0" font-size="9" fill="#3b82f6" text-anchor="start" font-weight="bold">√g(x)  (índice par)</text><text x="20.0" y="91.0" font-size="8.2" fill="#333" text-anchor="start" font-weight="bold">se exige g(x) ≥ 0</text><text x="282.0" y="91.0" font-size="7.4" fill="#999" text-anchor="end">(no hay raíz de un negativo)</text><rect x="10.0" y="104.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="20.0" y="118.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">ln g(x)</text><text x="20.0" y="131.0" font-size="8.2" fill="#333" text-anchor="start" font-weight="bold">se exige g(x) > 0</text><text x="282.0" y="131.0" font-size="7.4" fill="#999" text-anchor="end">(el log solo de positivos)</text><rect x="10.0" y="148.0" width="280.0" height="44.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="164.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">2x⁵ + 6x³ + 8x² − 5: ninguna de las tres</text><text x="150.0" y="178.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="bold">No hay nada que quitar  →  Dom = ℝ</text></svg>