<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_8811" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_8811" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">La evoluci&#243;n hacia la manipulaci&#243;n directa</text><rect x="12.0" y="24.0" width="86.0" height="74.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="55.0" y="38.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">1980</text><text x="55.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">editor de l&#237;nea</text><text x="55.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">ves UNA l&#237;nea</text><text x="55.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">todo por comandos</text><text x="55.0" y="81.0" font-size="7.5" fill="#333" text-anchor="middle">(VI, LaTeX)</text><rect x="107.0" y="24.0" width="86.0" height="74.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="38.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">A&#241;os 80</text><text x="150.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">editor de pantalla</text><text x="150.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">ves varias l&#237;neas</text><text x="150.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">a&#250;n con comandos</text><text x="150.0" y="81.0" font-size="7.5" fill="#333" text-anchor="middle">(WordStar)</text><rect x="202.0" y="24.0" width="86.0" height="74.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="245.0" y="38.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">A&#241;os 90</text><text x="245.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">WYSIWYG</text><text x="245.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">lo ves como</text><text x="245.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">va a quedar</text><text x="245.0" y="81.0" font-size="7.5" fill="#333" text-anchor="middle">(Word)</text><line x1="100.0" y1="60.0" x2="105.0" y2="60.0" stroke="#999" stroke-width="1.2" marker-end="url(#a1_8811)"/><line x1="195.0" y1="60.0" x2="200.0" y2="60.0" stroke="#999" stroke-width="1.2" marker-end="url(#a2_8811)"/><text x="150.0" y="116.0" font-size="9" fill="#333" text-anchor="middle">WYSIWYG = &#171;lo que ves es lo que obtienes&#187;.</text><text x="150.0" y="129.0" font-size="8.5" fill="#333" text-anchor="middle">Su contrario es WYSIWYM, &#171;lo que ves es lo que QUIERES</text><text x="150.0" y="140.0" font-size="8.5" fill="#333" text-anchor="middle">DECIR&#187;, que es el enfoque de LaTeX.</text><text x="150.0" y="150.0" font-size="8" fill="#ef4444" text-anchor="middle">Ojo: se parecen much&#237;simo y los cambian en las opciones.</text></svg>