<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">Lo que a&#241;ade el v&#237;deo a cada regla</text><rect x="12.0" y="22.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="35.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">1 Consistencia</text><text x="118.0" y="35.0" font-size="7.2" fill="#7c3aed" text-anchor="start">palabras, color, letra, forma y colocaci&#243;n</text><rect x="12.0" y="43.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="56.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">2 Usabilidad universal</text><text x="118.0" y="56.0" font-size="7.2" fill="#3b82f6" text-anchor="start">ayudas al novato y atajos al experto</text><rect x="12.0" y="64.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="77.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">3 Retroalimentaci&#243;n</text><text x="118.0" y="77.0" font-size="7.2" fill="#16a34a" text-anchor="start">da sensaci&#243;n de SEGURIDAD al usuario</text><rect x="12.0" y="85.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="98.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">4 Di&#225;logos cerrados</text><text x="118.0" y="98.0" font-size="7.2" fill="#ef4444" text-anchor="start">al EMPEZAR, decir objetivo y pasos</text><rect x="12.0" y="106.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="119.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">5 Prevenir errores</text><text x="118.0" y="119.0" font-size="7.2" fill="#ef4444" text-anchor="start">deshabilitar &#62; avisar despu&#233;s del fallo</text><rect x="12.0" y="127.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="140.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">6 Revertir acciones</text><text x="118.0" y="140.0" font-size="7.2" fill="#7c3aed" text-anchor="start">una acci&#243;n reversible deja de ser grave</text><rect x="12.0" y="148.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="161.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">7 Control interno</text><text x="118.0" y="161.0" font-size="7.2" fill="#3b82f6" text-anchor="start">sin ambig&#252;edad y con convenciones universales</text><rect x="12.0" y="169.0" width="276.0" height="19.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="182.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">8 Memoria corto plazo</text><text x="118.0" y="182.0" font-size="7.2" fill="#16a34a" text-anchor="start">que recuerde la aplicaci&#243;n, no la persona</text><rect x="12.0" y="192.0" width="276.0" height="26.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="204.0" font-size="7.4" fill="#333" text-anchor="middle" font-weight="bold">Aplicarlas no es solo hacerlo bien: es dejar de hacerlo mal.</text></svg>