<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 206" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">Lo que m&#225;s cae de esta unidad</text><rect x="12.0" y="22.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="35.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Web abarrotada (5)</text><text x="134.0" y="35.5" font-size="7.2" fill="#ef4444" text-anchor="start">interfaz muy mala: satura y no hay orden</text><rect x="12.0" y="44.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="57.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Factores de usabilidad (3)</text><text x="134.0" y="57.5" font-size="7.2" fill="#7c3aed" text-anchor="start">curva de aprendizaje, estandarizar, facilitar</text><rect x="12.0" y="66.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="79.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Factores de utilidad (1)</text><text x="134.0" y="79.5" font-size="7.2" fill="#7c3aed" text-anchor="start">productividad y lograr el objetivo</text><rect x="12.0" y="88.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="101.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Requisitos imposibles (2)</text><text x="134.0" y="101.5" font-size="7.2" fill="#3b82f6" text-anchor="start">cierto: hay que buscar el equilibrio</text><rect x="12.0" y="110.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="123.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Sistemas cr&#237;ticos (1)</text><text x="134.0" y="123.5" font-size="7.2" fill="#3b82f6" text-anchor="start">aprendizaje largo por manejo libre de errores</text><rect x="12.0" y="132.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="145.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Internacionalizaci&#243;n (1)</text><text x="134.0" y="145.5" font-size="7.2" fill="#16a34a" text-anchor="start">NO se ocupa de d&#243;nde van los elementos</text><rect x="12.0" y="154.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="167.5" font-size="7.2" fill="#333" text-anchor="start" font-weight="bold">Web imprimible (1)</text><text x="134.0" y="167.5" font-size="7.2" fill="#16a34a" text-anchor="start">que se imprima y se lea bien en papel</text><rect x="12.0" y="178.0" width="276.0" height="24.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="192.0" font-size="7.4" fill="#333" text-anchor="middle" font-weight="bold">Entre par&#233;ntesis, las veces que ha ca&#237;do en los ex&#225;menes cargados.</text></svg>