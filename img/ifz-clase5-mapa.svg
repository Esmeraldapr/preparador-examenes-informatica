<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 440' width='900' height='440'><rect width='900' height='440' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' fill='#1e1b4b' text-anchor='start' font-weight="bold">Las 6 formas de evaluar una interfaz (UD4)</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>En el mismo orden que el índice de la clase.</text><rect x='20' y='80' width='280' height='160' rx='12' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='34' y='110' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">1. Revisión por expertos</text><text x='34' y='140' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Gente con mucha</text><text x='34' y='164' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>experiencia mira</text><text x='34' y='188' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>la interfaz.</text><text x='34' y='212' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Sale un informe.</text><rect x='310' y='80' width='280' height='160' rx='12' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='324' y='110' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">2. Pruebas de usabilidad</text><text x='324' y='140' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Usuarios reales</text><text x='324' y='164' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>hacen tareas en un</text><text x='324' y='188' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>laboratorio.</text><text x='324' y='212' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Se mira y se graba.</text><rect x='600' y='80' width='280' height='160' rx='12' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='614' y='110' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#3b82f6' text-anchor='start' font-weight="bold">3. Encuestas</text><text x='614' y='140' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Muchas personas</text><text x='614' y='164' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>responden a la vez</text><text x='614' y='188' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>(de «muy de acuerdo»</text><text x='614' y='212' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>a «muy en desacuerdo»).</text><rect x='20' y='260' width='280' height='160' rx='12' fill='#ef4444' fill-opacity='.10' stroke='#ef4444' stroke-width='2.5'/><text x='34' y='290' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#ef4444' text-anchor='start' font-weight="bold">4. Test de aceptación</text><text x='34' y='320' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Cumple lo que pidió</text><text x='34' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>el cliente? Tiempos,</text><text x='34' y='368' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>documentación...</text><text x='34' y='392' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>No busca mejorar.</text><rect x='310' y='260' width='280' height='160' rx='12' fill='#16a34a' fill-opacity='.10' stroke='#16a34a' stroke-width='2.5'/><text x='324' y='290' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#16a34a' text-anchor='start' font-weight="bold">5. Evaluación en uso</text><text x='324' y='320' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Ya lo usan cada día:</text><text x='324' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>entrevistas, logging</text><text x='324' y='368' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>continuo y soporte</text><text x='324' y='392' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>a los usuarios.</text><rect x='600' y='260' width='280' height='160' rx='12' fill='#999' fill-opacity='.10' stroke='#999' stroke-width='2.5'/><text x='614' y='290' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#999' text-anchor='start' font-weight="bold">6. Experimentos</text><text x='614' y='320' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Método científico:</text><text x='614' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>hipótesis, variables,</text><text x='614' y='368' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>experimento y</text><text x='614' y='392' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>estadística.</text></svg>