<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ejercicio 3: condensadores</text><text x="150.0" y="27.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">C₁: placas de 6 cm de lado, separadas 2 cm</text><text x="150.0" y="39.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">C₂: placas de 8 cm de lado, separadas 3 cm</text><rect x="10.0" y="46.0" width="280.0" height="20.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="60.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">C = ε₀ · S / d       con ε₀ = 8,854 × 10⁻⁹</text><rect x="10.0" y="72.0" width="138.0" height="46.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="79.0" y="86.0" font-size="7.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">C₁ = 8,854×10⁻⁹ · 0,06²/0,02</text><text x="79.0" y="104.0" font-size="9.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">C₁ = 1,59 × 10⁻⁹ F</text><rect x="152.0" y="72.0" width="138.0" height="46.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="221.0" y="86.0" font-size="7.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">C₂ = 8,854×10⁻⁹ · 0,08²/0,03</text><text x="221.0" y="104.0" font-size="9.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">C₂ = 1,89 × 10⁻⁹ F</text><rect x="10.0" y="124.0" width="138.0" height="56.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="79.0" y="138.0" font-size="8.4" fill="#ef4444" text-anchor="middle" font-weight="bold">EN SERIE</text><text x="79.0" y="152.0" font-size="7.8" fill="#333" text-anchor="middle">1/C = 1/1,59 + 1/1,89</text><text x="79.0" y="170.0" font-size="9.6" fill="#ef4444" text-anchor="middle" font-weight="bold">C = 0,86 × 10⁻⁹ F</text><rect x="152.0" y="124.0" width="138.0" height="56.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="221.0" y="138.0" font-size="8.4" fill="#16a34a" text-anchor="middle" font-weight="bold">EN PARALELO</text><text x="221.0" y="152.0" font-size="7.8" fill="#333" text-anchor="middle">C = 1,59 + 1,89</text><text x="221.0" y="170.0" font-size="9.6" fill="#16a34a" text-anchor="middle" font-weight="bold">C = 3,48 × 10⁻⁹ F</text><text x="150.0" y="196.0" font-size="8.2" fill="#ef4444" text-anchor="middle" font-weight="bold">Área de una placa cuadrada: S = lado². Pasa cm a metros.</text><text x="150.0" y="212.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">Comprueba: en serie sale MENOS que el más pequeño de los dos.</text></svg>