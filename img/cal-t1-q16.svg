<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">DOMINIO: los valores de ENTRADA</text><rect x="10.0" y="24.0" width="280.0" height="40.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="42.0" font-size="9.4" fill="#16a34a" text-anchor="middle" font-weight="bold">Dominio = los x donde la función está definida</text><text x="150.0" y="56.0" font-size="8.2" fill="#333" text-anchor="middle">(los que puedes meter en la máquina sin que falle)</text><rect x="10.0" y="72.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.1"/><text x="20.0" y="89.0" font-size="8.4" fill="#333" text-anchor="start" font-weight="bold">El conjunto de valores f(x) que se obtienen</text><text x="282.0" y="89.0" font-size="8.2" fill="#ef4444" text-anchor="end" font-weight="bold">eso es el RECORRIDO</text><rect x="10.0" y="102.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.1"/><text x="20.0" y="119.0" font-size="8.4" fill="#333" text-anchor="start" font-weight="bold">La representación gráfica</text><text x="282.0" y="119.0" font-size="8.2" fill="#ef4444" text-anchor="end" font-weight="bold">es un DIBUJO de la función</text><rect x="10.0" y="132.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.1"/><text x="20.0" y="149.0" font-size="8.4" fill="#333" text-anchor="start" font-weight="bold">La expresión analítica</text><text x="282.0" y="149.0" font-size="8.2" fill="#ef4444" text-anchor="end" font-weight="bold">es la FÓRMULA de la función</text><text x="150.0" y="176.0" font-size="8" fill="#999" text-anchor="middle">Dibujo y fórmula son formas de DAR la función, no su dominio.</text></svg>