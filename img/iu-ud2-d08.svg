<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">Los TRES principios de la manipulaci&#243;n directa</text><rect x="16.0" y="24.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="37.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">1. Representaci&#243;n continua</text><text x="26.0" y="48.0" font-size="7.5" fill="#333" text-anchor="start">los objetos est&#225;n siempre a la vista,</text><text x="26.0" y="58.0" font-size="7.5" fill="#333" text-anchor="start">con met&#225;foras visuales con sentido</text><rect x="16.0" y="68.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="81.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">2. Acciones f&#237;sicas</text><text x="26.0" y="92.0" font-size="7.5" fill="#333" text-anchor="start">pulsar, arrastrar o soltar,</text><text x="26.0" y="102.0" font-size="7.5" fill="#333" text-anchor="start">en vez de escribir una sintaxis</text><rect x="16.0" y="112.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="125.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">3. Efectos visibles al momento</text><text x="26.0" y="136.0" font-size="7.5" fill="#333" text-anchor="start">r&#225;pidas, incrementales</text><text x="26.0" y="146.0" font-size="7.5" fill="#333" text-anchor="start">y REVERSIBLES</text><text x="150.0" y="166.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen: dan cuatro y piden cu&#225;l NO es principio.</text></svg>