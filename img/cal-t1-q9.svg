<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 156" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">3 &lt; x ≤ 7 escrito como intervalo</text><rect x="14.0" y="24.0" width="128.0" height="40.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.3"/><text x="78.0" y="40.0" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="bold">3 &lt; x</text><text x="78.0" y="56.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">estricto → paréntesis</text><rect x="158.0" y="24.0" width="128.0" height="40.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.3"/><text x="222.0" y="40.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">x ≤ 7</text><text x="222.0" y="56.0" font-size="8" fill="#16a34a" text-anchor="middle" font-weight="bold">con igual → corchete</text><line x1="24.0" y1="92.0" x2="276.0" y2="92.0" stroke="#999" stroke-width="1.3"/><line x1="110.0" y1="92.0" x2="210.0" y2="92.0" stroke="#7c3aed" stroke-width="5"/><circle cx="110.0" cy="92.0" r="5" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><circle cx="210.0" cy="92.0" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="110.0" y="110.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">3</text><text x="210.0" y="110.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">7</text><rect x="95.0" y="122.0" width="110.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="139.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">(3, 7]</text></svg>