<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Dominio: los tres sitios donde mirar</text><rect x="10.0" y="24.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="38.0" font-size="8.8" fill="#ef4444" text-anchor="start" font-weight="bold">¿Hay denominador?</text><text x="20.0" y="52.0" font-size="8.4" fill="#333" text-anchor="start">quita los x que lo anulan</text><text x="282.0" y="52.0" font-size="7.6" fill="#999" text-anchor="end">1/(x+1) → ℝ − {−1}</text><rect x="10.0" y="68.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="20.0" y="82.0" font-size="8.8" fill="#3b82f6" text-anchor="start" font-weight="bold">¿Hay raíz de índice par?</text><text x="20.0" y="96.0" font-size="8.4" fill="#333" text-anchor="start">exige lo de dentro ≥ 0</text><text x="282.0" y="96.0" font-size="7.6" fill="#999" text-anchor="end">√(x−2) → [2, +∞)</text><rect x="10.0" y="112.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="20.0" y="126.0" font-size="8.8" fill="#7c3aed" text-anchor="start" font-weight="bold">¿Hay logaritmo?</text><text x="20.0" y="140.0" font-size="8.4" fill="#333" text-anchor="start">exige lo de dentro &gt; 0</text><text x="282.0" y="140.0" font-size="7.6" fill="#999" text-anchor="end">ln(x−1) → (1, +∞)</text><rect x="10.0" y="158.0" width="280.0" height="46.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="173.0" font-size="9.4" fill="#16a34a" text-anchor="middle" font-weight="bold">Si no hay ninguna de las tres  →  Dom = ℝ</text><text x="150.0" y="187.0" font-size="8.2" fill="#333" text-anchor="middle">(polinomios, sen x, cos x, eˣ: dominio ℝ siempre)</text><text x="150.0" y="198.0" font-size="7.6" fill="#999" text-anchor="middle">Si hay varias, se cumplen TODAS a la vez (intersección).</text></svg>