<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 166" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="78.0" y="13.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">A favor</text><text x="226.0" y="13.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">En contra</text><rect x="10.0" y="22.0" width="136.0" height="112.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><rect x="154.0" y="22.0" width="136.0" height="112.0" rx="3" fill="#fff6f6" stroke="#ef4444" stroke-width="1.2"/><text x="78.0" y="38.0" font-size="8" fill="#333" text-anchor="middle">se aprende mirando</text><text x="78.0" y="52.0" font-size="8" fill="#333" text-anchor="middle">los expertos van r&#225;pido</text><text x="78.0" y="66.0" font-size="8" fill="#333" text-anchor="middle">casi no hacen falta</text><text x="78.0" y="80.0" font-size="8" fill="#333" text-anchor="middle">mensajes de error</text><text x="78.0" y="94.0" font-size="8" fill="#333" text-anchor="middle">se deshace f&#225;cil</text><text x="78.0" y="108.0" font-size="8" fill="#333" text-anchor="middle">menos ansiedad</text><text x="78.0" y="122.0" font-size="8" fill="#333" text-anchor="middle">sensaci&#243;n de control</text><text x="226.0" y="38.0" font-size="8" fill="#333" text-anchor="middle">mala para invidentes</text><text x="226.0" y="52.0" font-size="8" fill="#333" text-anchor="middle">ocupa mucha pantalla</text><text x="226.0" y="66.0" font-size="8" fill="#333" text-anchor="middle">hay que aprender qu&#233;</text><text x="226.0" y="80.0" font-size="8" fill="#333" text-anchor="middle">significa cada icono</text><text x="226.0" y="94.0" font-size="8" fill="#333" text-anchor="middle">el dibujo puede enga&#241;ar</text><text x="226.0" y="108.0" font-size="8" fill="#333" text-anchor="middle">lento si escribes r&#225;pido</text><text x="226.0" y="122.0" font-size="8" fill="#333" text-anchor="middle">iconos diminutos en m&#243;vil</text><text x="150.0" y="150.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">Ning&#250;n estilo gana siempre: depende de la tarea</text><text x="150.0" y="162.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">y del tipo de usuario que la vaya a hacer.</text></svg>