<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 176" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Conductor en equilibrio electrost&#225;tico</text><rect x="20.0" y="24.0" width="86.0" height="80.0" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/><text x="63.0" y="68.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="bold">E = 0</text><text x="63.0" y="82.0" font-size="8" fill="#ef4444" text-anchor="middle">dentro</text><text x="24.0" y="36.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="102.0" y="36.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="24.0" y="52.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="102.0" y="52.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="24.0" y="68.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="102.0" y="68.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="24.0" y="84.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="102.0" y="84.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="24.0" y="100.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="102.0" y="100.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">+</text><text x="63.0" y="116.0" font-size="8" fill="#3b82f6" text-anchor="middle">la carga va a la SUPERFICIE</text><text x="118.0" y="38.0" font-size="8" fill="#333" text-anchor="start">El campo dentro es NULO</text><text x="118.0" y="55.0" font-size="8" fill="#333" text-anchor="start">La superficie es EQUIPOTENCIAL</text><text x="118.0" y="72.0" font-size="8" fill="#333" text-anchor="start">La carga se va a la superficie,</text><text x="118.0" y="89.0" font-size="8" fill="#333" text-anchor="start">donde m&#225;s se curva (puntas)</text><text x="118.0" y="106.0" font-size="8" fill="#333" text-anchor="start">Fuera, el campo es PERPENDICULAR</text><text x="150.0" y="136.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">Lo que NO dice: que el potencial sea nulo.</text><text x="150.0" y="150.0" font-size="8.5" fill="#ef4444" text-anchor="middle">El potencial es CONSTANTE, pero no tiene por qu&#233; valer cero.</text><text x="150.0" y="168.0" font-size="8" fill="#ef4444" text-anchor="middle">Esa es la trampa que han puesto en el examen.</text></svg>