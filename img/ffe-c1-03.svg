<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 226" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">El átomo y la carga eléctrica</text><ellipse cx="70" cy="62" rx="38" ry="14" fill="none" stroke="#ddd" stroke-width="1.2" transform="rotate(0 70 62)"/><ellipse cx="70" cy="62" rx="38" ry="14" fill="none" stroke="#ddd" stroke-width="1.2" transform="rotate(60 70 62)"/><ellipse cx="70" cy="62" rx="38" ry="14" fill="none" stroke="#ddd" stroke-width="1.2" transform="rotate(120 70 62)"/><circle cx="70.0" cy="62.0" r="9" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="70.0" y="65.0" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">+</text><circle cx="106.0" cy="56.0" r="4.5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="106.0" y="58.6" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">–</text><circle cx="50.0" cy="92.0" r="4.5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="50.0" y="94.6" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">–</text><circle cx="56.0" cy="32.0" r="4.5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="56.0" y="34.6" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">–</text><text x="70.0" y="104.0" font-size="7.6" fill="#333" text-anchor="middle" font-weight="bold">núcleo: protones (+) y neutrones</text><text x="70.0" y="114.0" font-size="7.6" fill="#333" text-anchor="middle" font-weight="bold">electrones (–) orbitando</text><rect x="140.0" y="24.0" width="150.0" height="88.0" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/><text x="215.0" y="38.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">Átomo NEUTRO</text><text x="215.0" y="50.0" font-size="7.6" fill="#999" text-anchor="middle">mismo número de + que de –</text><text x="215.0" y="68.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">Si PIERDE electrones → queda +</text><text x="215.0" y="82.0" font-size="8" fill="#3b82f6" text-anchor="middle" font-weight="bold">Si GANA electrones → queda –</text><text x="215.0" y="100.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">e = 1,602 × 10⁻¹⁹ C</text><rect x="10.0" y="122.0" width="280.0" height="26.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.1"/><text x="20.0" y="139.0" font-size="8.8" fill="#7c3aed" text-anchor="start" font-weight="bold">Dualidad</text><text x="282.0" y="139.0" font-size="8" fill="#333" text-anchor="end">hay dos signos: + y –</text><rect x="10.0" y="151.0" width="280.0" height="26.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.1"/><text x="20.0" y="168.0" font-size="8.8" fill="#16a34a" text-anchor="start" font-weight="bold">Conservación</text><text x="282.0" y="168.0" font-size="8" fill="#333" text-anchor="end">no se crea ni se destruye: solo se transfiere</text><rect x="10.0" y="180.0" width="280.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="20.0" y="197.0" font-size="8.8" fill="#3b82f6" text-anchor="start" font-weight="bold">Cuantización</text><text x="282.0" y="197.0" font-size="8" fill="#333" text-anchor="end">toda carga es un múltiplo de la carga elemental e</text><text x="150.0" y="220.0" font-size="8" fill="#999" text-anchor="middle">Mismo signo se repelen · signo contrario se atraen.</text></svg>