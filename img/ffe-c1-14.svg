<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_8404" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker><marker id="a2_8404" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ejercicio 1: fuerza entre dos cargas</text><text x="150.0" y="28.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">q₁ = 6 µC , q₂ = 3 µC , r = 9 cm , en el vacío</text><circle cx="80.0" cy="62.0" r="7" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="80.0" y="64.6" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">+</text><circle cx="220.0" cy="62.0" r="7" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="220.0" y="64.6" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">+</text><line x1="88.0" y1="62.0" x2="212.0" y2="62.0" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="74.0" y1="62.0" x2="44.0" y2="62.0" stroke="#ef4444" stroke-width="2" marker-end="url(#a1_8404)"/><line x1="226.0" y1="62.0" x2="256.0" y2="62.0" stroke="#ef4444" stroke-width="2" marker-end="url(#a2_8404)"/><text x="80.0" y="48.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">6 µC</text><text x="220.0" y="48.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">3 µC</text><text x="150.0" y="78.0" font-size="8.6" fill="#ef4444" text-anchor="middle" font-weight="bold">r = 0,09 m</text><rect x="10.0" y="90.0" width="280.0" height="22.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="150.0" y="105.0" font-size="9.4" fill="#333" text-anchor="middle" font-weight="bold">F = 9×10⁹ · (6×10⁻⁶ · 3×10⁻⁶) / (0,09)²</text><text x="150.0" y="126.0" font-size="8.4" fill="#333" text-anchor="middle">arriba: 9×10⁹ · 18×10⁻¹² = 162×10⁻³</text><text x="150.0" y="138.0" font-size="8.4" fill="#333" text-anchor="middle">abajo: 0,09² = 0,0081</text><rect x="80.0" y="146.0" width="140.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="162.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">F = 20 N</text><text x="150.0" y="184.0" font-size="8.2" fill="#ef4444" text-anchor="middle" font-weight="bold">⚠ Pasa los µC a 10⁻⁶ y los cm a metros ANTES de operar.</text><text x="150.0" y="198.0" font-size="8" fill="#ef4444" text-anchor="middle">Es el fallo que más puntos cuesta en este ejercicio.</text></svg>