<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Potencial eléctrico: un ESCALAR</text><rect x="10.0" y="22.0" width="280.0" height="26.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="150.0" y="40.0" font-size="9.4" fill="#333" text-anchor="middle" font-weight="bold">V = K · q / r       ·       1 voltio = 1 julio / 1 culombio</text><rect x="10.0" y="58.0" width="280.0" height="28.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="20.0" y="70.0" font-size="8.8" fill="#16a34a" text-anchor="start" font-weight="bold">Campo conservativo</text><text x="20.0" y="81.0" font-size="8" fill="#333" text-anchor="start">el trabajo no depende del camino, solo de los extremos</text><rect x="10.0" y="90.0" width="280.0" height="28.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="20.0" y="102.0" font-size="8.8" fill="#3b82f6" text-anchor="start" font-weight="bold">Relación con E</text><text x="20.0" y="113.0" font-size="8" fill="#333" text-anchor="start">E = −dV/dr: el campo apunta a donde el potencial BAJA</text><rect x="10.0" y="122.0" width="280.0" height="28.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="20.0" y="134.0" font-size="8.8" fill="#7c3aed" text-anchor="start" font-weight="bold">Sistema de cargas</text><text x="20.0" y="145.0" font-size="8" fill="#333" text-anchor="start">el potencial total es la SUMA ARITMÉTICA de cada uno</text><rect x="10.0" y="154.0" width="280.0" height="28.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="166.0" font-size="8.8" fill="#ef4444" text-anchor="start" font-weight="bold">Unidad</text><text x="20.0" y="177.0" font-size="8" fill="#333" text-anchor="start">el voltio [V]; es la base de la tensión en circuitos</text><rect x="10.0" y="188.0" width="280.0" height="24.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.3"/><text x="150.0" y="203.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">Campo = VECTOR (suma vectorial) · Potencial = ESCALAR (suma normal)</text></svg>