<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img"><rect width="300" height="110" fill="#fff"/><defs><marker id="s16-ef4444" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs><polyline points="40,40 123,40" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="177,40 260,40" fill="none" stroke="#333" stroke-width="1.6"/><rect x="123.0" y="33" width="54" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="150" y="29" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">R = 20 Ω</text><line x1="60" y1="30" x2="100" y2="30" stroke="#ef4444" stroke-width="1.8" marker-end="url(#s16-ef4444)"/><text x="80" y="23" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="700" font-family="Arial, sans-serif">I = 3 A</text><text x="150" y="72" text-anchor="middle" font-size="10.5" fill="#333" font-family="Arial, sans-serif">P = I² · R = 3² × 20 = 9 × 20</text><text x="150" y="92" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">P = 180 W</text><text x="150" y="105" text-anchor="middle" font-size="9" fill="#666" font-family="Arial, sans-serif">(60 es la tensión: V = I · R = 60 V)</text></svg>