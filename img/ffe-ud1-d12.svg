68" fill="none" stroke="#333" stroke-width="1.4"/><polyline points="252,68 282,68" fill="none" stroke="#333" stroke-width="1.4"/><text x="226.0" y="108.0" font-size="10.5" fill="#ef4444" text-anchor="middle" font-weight="bold">1/C = 1/C&#8321; + 1/C&#8322;</text><text x="226.0" y="122.0" font-size="8" fill="#333" text-anchor="middle">se suman los INVERSOS</text><text x="226.0" y="134.0" font-size="7.5" fill="#999" text-anchor="middle">misma carga Q</text><rect x="14.0" y="144.0" width="272.0" height="30.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="158.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">En PARALELO sale MAYOR que el mayor.</text><text x="150.0" y="169.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">En SERIE sale MENOR que el menor. Justo al rev&#233;s que las R.</text></svg>