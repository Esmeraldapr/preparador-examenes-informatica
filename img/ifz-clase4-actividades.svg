<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 520' width='900' height='520'><defs><marker id='a4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#7c3aed'/></marker></defs><rect width='900' height='520' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='bold' fill='#1e1b4b' text-anchor='start'>Las 4 actividades básicas del diseño iterativo</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Se hacen en rueda: al evaluar, se vuelve a empezar hasta que el diseño es bueno.</text><rect x='310' y='72' width='280' height='76' rx='14' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='450' y='104' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#7c3aed' text-anchor='middle'>1. Identificar necesidades</text><text x='450' y='128' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='middle'>y establecer requisitos</text><rect x='580' y='207' width='280' height='76' rx='14' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='720' y='239' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#3b82f6' text-anchor='middle'>2. Desarrollar diseños</text><text x='720' y='263' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='middle'>alternativos</text><rect x='310' y='342' width='280' height='76' rx='14' fill='#16a34a' fill-opacity='.10' stroke='#16a34a' stroke-width='2.5'/><text x='450' y='374' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#16a34a' text-anchor='middle'>3. Construir versiones</text><text x='450' y='398' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='middle'>interactivas</text><rect x='40' y='207' width='280' height='76' rx='14' fill='#ef4444' fill-opacity='.10' stroke='#ef4444' stroke-width='2.5'/><text x='180' y='239' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#ef4444' text-anchor='middle'>4. Evaluar lo que</text><text x='180' y='263' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='middle'>se está construyendo</text><line x1='595' y1='120' x2='690' y2='200' stroke='#7c3aed' stroke-width='3' marker-end='url(#a4)'/><line x1='690' y1='290' x2='595' y2='370' stroke='#7c3aed' stroke-width='3' marker-end='url(#a4)'/><line x1='305' y1='370' x2='210' y2='290' stroke='#7c3aed' stroke-width='3' marker-end='url(#a4)'/><line x1='210' y1='200' x2='305' y2='120' stroke='#7c3aed' stroke-width='3' marker-end='url(#a4)'/><text x='450' y='470' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#1e1b4b' text-anchor='middle'>El diseño 2 se parte en: CONCEPTUAL (qué hace el producto)</text><text x='450' y='494' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#1e1b4b' text-anchor='middle'>y FÍSICO (colores, sonidos, iconos, menús, distribución).</text></svg>