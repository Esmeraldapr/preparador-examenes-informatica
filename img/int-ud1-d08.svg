<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Qu&#233; hay que tocar para internacionalizar</text><rect x="12.0" y="24.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="36.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Caracteres y signos</text><text x="140.0" y="36.0" font-size="7.2" fill="#7c3aed" text-anchor="start">acentos, e&#241;es, diacr&#237;ticos</text><rect x="12.0" y="43.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="55.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Sentido de lectura</text><text x="140.0" y="55.0" font-size="7.2" fill="#7c3aed" text-anchor="start">izq-dcha, dcha-izq, vertical</text><rect x="12.0" y="62.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="74.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Fecha, hora y moneda</text><text x="140.0" y="74.0" font-size="7.2" fill="#7c3aed" text-anchor="start">formatos distintos por pa&#237;s</text><rect x="12.0" y="81.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="93.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Pesos y medidas</text><text x="140.0" y="93.0" font-size="7.2" fill="#7c3aed" text-anchor="start">kilos o libras, km o millas</text><rect x="12.0" y="100.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="112.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Tel&#233;fonos y direcciones</text><text x="140.0" y="112.0" font-size="7.2" fill="#7c3aed" text-anchor="start">y n&#250;meros de identidad</text><rect x="12.0" y="119.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="131.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Iconos, botones y colores</text><text x="140.0" y="131.0" font-size="7.2" fill="#7c3aed" text-anchor="start">no significan lo mismo</text><rect x="12.0" y="138.0" width="276.0" height="17.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="150.0" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">Tono y metáforas</text><text x="140.0" y="150.0" font-size="7.2" fill="#7c3aed" text-anchor="start">etiqueta, formalidad, pol&#237;tica</text><rect x="12.0" y="161.0" width="276.0" height="30.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="174.0" font-size="7.6" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen: &#171;la internacionalizaci&#243;n NO se preocupa de&#8230;&#187;</text><text x="150.0" y="185.0" font-size="7.6" fill="#333" text-anchor="middle">y la respuesta es la UBICACI&#211;N de los elementos en la pantalla.</text></svg>