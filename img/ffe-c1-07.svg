<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 238" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_2469" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7c3aed"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Líneas de campo: las 6 reglas</text><circle cx="90.0" cy="70.0" r="7" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="90.0" y="72.6" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">+</text><circle cx="210.0" cy="70.0" r="7" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="210.0" y="72.6" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">–</text><path d="M98,70 Q150.0,19.0 202,70" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M98,70 Q150.0,43.0 202,70" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M98,70 Q150.0,70.0 202,70" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M98,70 Q150.0,97.0 202,70" fill="none" stroke="#7c3aed" stroke-width="1.2"/><path d="M98,70 Q150.0,121.0 202,70" fill="none" stroke="#7c3aed" stroke-width="1.2"/><line x1="144.0" y1="70.0" x2="156.0" y2="70.0" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#a1_2469)"/><text x="150.0" y="110.0" font-size="8.2" fill="#7c3aed" text-anchor="middle" font-weight="bold">salen de la + y entran en la –</text><rect x="10.0" y="120.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="0.9"/><text x="18.0" y="130.5" font-size="7.6" fill="#7c3aed" text-anchor="start" font-weight="bold">Tangentes</text><text x="284.0" y="130.5" font-size="7.2" fill="#333" text-anchor="end">el vector E es tangente a la línea</text><rect x="10.0" y="137.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="0.9"/><text x="18.0" y="147.5" font-size="7.6" fill="#3b82f6" text-anchor="start" font-weight="bold">Abiertas</text><text x="284.0" y="147.5" font-size="7.2" fill="#333" text-anchor="end">salen de + y acaban en – (o en el infinito)</text><rect x="10.0" y="154.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="0.9"/><text x="18.0" y="164.5" font-size="7.6" fill="#ef4444" text-anchor="start" font-weight="bold">No se cortan</text><text x="284.0" y="164.5" font-size="7.2" fill="#333" text-anchor="end">si se cortaran habría dos direcciones en un punto</text><rect x="10.0" y="171.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="0.9"/><text x="18.0" y="181.5" font-size="7.6" fill="#16a34a" text-anchor="start" font-weight="bold">Densidad</text><text x="284.0" y="181.5" font-size="7.2" fill="#333" text-anchor="end">más juntas = campo más intenso</text><rect x="10.0" y="188.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="0.9"/><text x="18.0" y="198.5" font-size="7.6" fill="#7c3aed" text-anchor="start" font-weight="bold">Número</text><text x="284.0" y="198.5" font-size="7.2" fill="#333" text-anchor="end">proporcional a la magnitud de la carga</text><rect x="10.0" y="205.0" width="280.0" height="15.0" rx="3" fill="#fff" stroke="#999" stroke-width="0.9"/><text x="18.0" y="215.5" font-size="7.6" fill="#999" text-anchor="start" font-weight="bold">De lejos</text><text x="284.0" y="215.5" font-size="7.2" fill="#333" text-anchor="end">un sistema se ve como una sola carga neta</text><text x="150.0" y="232.0" font-size="7.8" fill="#999" text-anchor="middle">Las introdujo Michael Faraday.</text></svg>