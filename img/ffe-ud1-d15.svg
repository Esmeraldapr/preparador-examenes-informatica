<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Qu&#233; f&#243;rmula toca seg&#250;n lo que te pidan</text><rect x="12.0" y="26.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="39.0" font-size="7.6" fill="#333" text-anchor="start">Fuerza entre dos cargas</text><text x="180.0" y="39.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">F = K q&#8321;q&#8322; / r&#178;</text><rect x="12.0" y="47.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="60.0" font-size="7.6" fill="#333" text-anchor="start">Campo de una carga</text><text x="180.0" y="60.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">E = K q / r&#178;</text><rect x="12.0" y="68.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="81.0" font-size="7.6" fill="#333" text-anchor="start">Fuerza sobre una carga en un campo</text><text x="180.0" y="81.0" font-size="9" fill="#3b82f6" text-anchor="start" font-weight="bold">F = q &#183; E</text><rect x="12.0" y="89.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="102.0" font-size="7.6" fill="#333" text-anchor="start">Potencial de varias cargas</text><text x="180.0" y="102.0" font-size="9" fill="#3b82f6" text-anchor="start" font-weight="bold">V = &#931; K q&#7522; / r&#7522;</text><rect x="12.0" y="110.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="123.0" font-size="7.6" fill="#333" text-anchor="start">Flujo por una superficie cerrada</text><text x="180.0" y="123.0" font-size="9" fill="#16a34a" text-anchor="start" font-weight="bold">&#966; = Q interior / &#949;&#8320;</text><rect x="12.0" y="131.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="144.0" font-size="7.6" fill="#333" text-anchor="start">Carga de un condensador</text><text x="180.0" y="144.0" font-size="9" fill="#ef4444" text-anchor="start" font-weight="bold">Q = C &#183; V</text><rect x="12.0" y="152.0" width="162.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="165.0" font-size="7.6" fill="#333" text-anchor="start">Capacidad de un condensador plano</text><text x="180.0" y="165.0" font-size="9" fill="#ef4444" text-anchor="start" font-weight="bold">C = &#949;&#8320; S / d</text><text x="150.0" y="176.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">Lee bien si te piden FUERZA, CAMPO o POTENCIAL: son tres cosas.</text></svg>