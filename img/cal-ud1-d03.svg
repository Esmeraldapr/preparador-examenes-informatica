<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 146" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">M&#237;rale los decimales</text><rect x="12.0" y="24.0" width="276.0" height="32.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="22.0" y="44.0" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="bold">1,25</text><text x="118.0" y="37.0" font-size="7.8" fill="#333" text-anchor="start">se acaban &#8594; EXACTOS</text><text x="118.0" y="49.0" font-size="7" fill="#999" text-anchor="start"></text><text x="278.0" y="44.0" font-size="9" fill="#16a34a" text-anchor="end" font-weight="bold">RACIONAL</text><rect x="12.0" y="62.0" width="276.0" height="32.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="22.0" y="82.0" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="bold">0,242424&#8230;</text><text x="118.0" y="75.0" font-size="7.8" fill="#333" text-anchor="start">se repiten &#8594; PERI&#211;DICOS</text><text x="118.0" y="87.0" font-size="7" fill="#999" text-anchor="start"></text><text x="278.0" y="82.0" font-size="9" fill="#16a34a" text-anchor="end" font-weight="bold">RACIONAL</text><rect x="12.0" y="100.0" width="276.0" height="32.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="22.0" y="120.0" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="bold">3,14159265&#8230;</text><text x="118.0" y="113.0" font-size="7.8" fill="#333" text-anchor="start">no se repiten nunca</text><text x="118.0" y="125.0" font-size="7" fill="#999" text-anchor="start">infinitas cifras aperi&#243;dicas</text><text x="278.0" y="120.0" font-size="9" fill="#ef4444" text-anchor="end" font-weight="bold">IRRACIONAL</text><text x="150.0" y="142.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Exactos o peri&#243;dicos = racional. Aperi&#243;dicos = irracional.</text></svg>