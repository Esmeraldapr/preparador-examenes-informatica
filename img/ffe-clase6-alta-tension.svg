<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial, sans-serif"><rect x="0" y="0" width="600" height="300" fill="#fff"/><text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Mismos 1000 W por un cable de 10 Ω</text><rect x="20" y="70" width="90" height="60" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="65" y="96" text-anchor="middle" font-size="12" fill="#333">Central</text><text x="65" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">230 V</text><line x1="110" y1="100" x2="480" y2="100" stroke="#ef4444" stroke-width="9"/><rect x="480" y="70" width="100" height="60" rx="8" fill="#eef2ff" stroke="#3b82f6" stroke-width="2"/><text x="530" y="105" text-anchor="middle" font-size="12" fill="#333">Ciudad</text><text x="295" y="86" text-anchor="middle" font-size="13" fill="#333">I = 1000 ÷ 230 = 4,35 A</text><text x="295" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">Pérdida = 4,35² × 10 = 189 W</text><rect x="20" y="190" width="90" height="60" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><text x="65" y="216" text-anchor="middle" font-size="12" fill="#333">Central</text><text x="65" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">23 000 V</text><line x1="110" y1="220" x2="480" y2="220" stroke="#16a34a" stroke-width="2"/><rect x="480" y="190" width="100" height="60" rx="8" fill="#eef2ff" stroke="#3b82f6" stroke-width="2"/><text x="530" y="225" text-anchor="middle" font-size="12" fill="#333">Ciudad</text><text x="295" y="206" text-anchor="middle" font-size="13" fill="#333">I = 1000 ÷ 23 000 = 0,0435 A</text><text x="295" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">Pérdida = 0,0435² × 10 = 0,019 W</text><text x="300" y="288" text-anchor="middle" font-size="13" fill="#333">Más tensión → menos corriente → mucho menos calor (P = I² · R)</text></svg>