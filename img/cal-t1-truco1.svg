<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 204" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">¿Qué tipo de número es?</text><rect x="10.0" y="20.0" width="280.0" height="142.0" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/><text x="150.0" y="34.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">ℝ reales</text><rect x="22.0" y="42.0" width="256.0" height="96.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="56.0" font-size="8.4" fill="#7c3aed" text-anchor="middle" font-weight="bold">ℚ racionales: se escriben como fracción</text><rect x="36.0" y="64.0" width="228.0" height="60.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="150.0" y="78.0" font-size="8.4" fill="#3b82f6" text-anchor="middle" font-weight="bold">ℤ enteros  …−2, −1, 0, 1, 2…</text><rect x="52.0" y="86.0" width="196.0" height="26.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.3"/><text x="150.0" y="100.0" font-size="8.4" fill="#16a34a" text-anchor="middle" font-weight="bold">ℕ naturales  1, 2, 3…</text><text x="150.0" y="178.0" font-size="8.4" fill="#7c3aed" text-anchor="middle" font-weight="bold">−5/2 y 24/99 son FRACCIONES → racionales</text><text x="150.0" y="190.0" font-size="8.4" fill="#ef4444" text-anchor="middle" font-weight="bold">√2, π, e: decimales infinitos sin repetirse → IRRACIONALES</text><text x="150.0" y="200.0" font-size="7.6" fill="#ef4444" text-anchor="middle">(los irracionales viven en ℝ pero FUERA de ℚ)</text></svg>