<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">a<tspan dy="2" font-size="7">n</tspan><tspan dy="-2"> </tspan>= 1/n&#178;: tiene m&#225;ximo, pero NO m&#237;nimo</text><line x1="46.0" y1="112.0" x2="268.0" y2="112.0" stroke="#999" stroke-width="1"/><line x1="46.0" y1="118.0" x2="46.0" y2="30.0" stroke="#999" stroke-width="1"/><line x1="46.0" y1="36.0" x2="268.0" y2="36.0" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/><text x="272.0" y="39.0" font-size="9" fill="#16a34a" text-anchor="start" font-weight="bold">1</text><line x1="46.0" y1="112.0" x2="268.0" y2="112.0" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3"/><text x="272.0" y="115.0" font-size="9" fill="#ef4444" text-anchor="start" font-weight="bold">0</text><circle cx="54.0" cy="36.0" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="54.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">1</text><circle cx="80.0" cy="93.0" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="80.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">2</text><circle cx="106.0" cy="103.6" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="106.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">3</text><circle cx="132.0" cy="107.2" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="132.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">4</text><circle cx="158.0" cy="109.0" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="158.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">5</text><circle cx="184.0" cy="109.9" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="184.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">6</text><circle cx="210.0" cy="110.4" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="210.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">7</text><circle cx="236.0" cy="110.8" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="236.0" y="123.0" font-size="6.8" fill="#999" text-anchor="middle">8</text><text x="54.0" y="30.0" font-size="7.8" fill="#16a34a" text-anchor="start" font-weight="bold">m&#225;ximo = 1 (se alcanza)</text><text x="178.0" y="94.0" font-size="7.6" fill="#ef4444" text-anchor="middle" font-weight="bold">&#237;nfimo = 0: NO se alcanza, no hay m&#237;nimo</text><rect x="12.0" y="128.0" width="276.0" height="36.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="142.0" font-size="7.8" fill="#333" text-anchor="middle">SUPREMO = la menor cota superior. &#205;NFIMO = la mayor cota inferior.</text><text x="150.0" y="155.0" font-size="7.8" fill="#333" text-anchor="middle" font-weight="bold">M&#193;XIMO y M&#205;NIMO solo existen si ese valor se toca de verdad.</text></svg>