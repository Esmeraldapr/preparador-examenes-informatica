<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 470' width='600' height='470'>
<rect width='600' height='470' fill='white'/>
<text x='20' y='30' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='bold' fill='#1e1b4b'>El mapa: acotada, monótona y convergente</text>
<rect x='12' y='48' width='576' height='318' rx='12' fill='#f8fafc' stroke='#999' stroke-width='1.5'/>
<text x='24' y='68' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#666'>Todas las sucesiones</text>
<circle cx='240' cy='205' r='135' fill='#3b82f6' fill-opacity='.12' stroke='#3b82f6' stroke-width='2.5'/>
<path d='M 330.3 104.7 A 135 135 0 0 1 330.3 305.3 A 104.6 104.6 0 0 1 330.3 104.7 Z' fill='#16a34a' fill-opacity='.22' stroke='#16a34a' stroke-width='2.5'/>
<circle cx='455' cy='205' r='120' fill='#7c3aed' fill-opacity='.12' stroke='#7c3aed' stroke-width='2.5'/>
<text x='150' y='120' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#3b82f6'>ACOTADAS</text>
<text x='318' y='94' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#16a34a' text-anchor='middle'>CONVERGENTES</text>
<text x='488' y='120' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#7c3aed' text-anchor='middle'>MONÓTONAS</text>
<circle cx='165' cy='205' r='5' fill='#3b82f6'/>
<text x='175' y='210' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1e1b4b' text-anchor='start'>(−1)ⁿ</text>
<circle cx='300' cy='255' r='5' fill='#16a34a'/>
<text x='292' y='260' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1e1b4b' text-anchor='end'>(−1)ⁿ/n</text>
<circle cx='355' cy='205' r='5' fill='#ef4444'/>
<text x='365' y='210' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1e1b4b' text-anchor='start'></text>
<line x1='355' y1='205' x2='355' y2='330' stroke='#ef4444' stroke-width='1.5'/>
<text x='355' y='350' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#ef4444' text-anchor='middle'>1 − 1/n: las tres a la vez</text>
<circle cx='500' cy='230' r='5' fill='#7c3aed'/>
<text x='510' y='235' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1e1b4b' text-anchor='start'>n</text>
<circle cx='540' cy='80' r='5' fill='#999'/>
<text x='532' y='85' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1e1b4b' text-anchor='end'>(−1)ⁿ·n</text>
<text x='20' y='392' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#ef4444'>Monótona + acotada (la zona donde se cruzan) ⇒ SIEMPRE convergente.</text>
<text x='20' y='414' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#16a34a'>Convergente ⇒ SIEMPRE acotada (el verde está dentro del azul).</text>
<text x='20' y='436' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#3b82f6'>Acotada sola NO basta: (−1)ⁿ está acotada y no converge.</text>
<text x='20' y='458' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#7c3aed'>Monótona sola NO basta: n sube siempre y no converge.</text>
</svg>