<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Las tres metas de una interfaz de calidad</text><rect x="12.0" y="24.0" width="90.0" height="56.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="57.0" y="44.0" font-size="9.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">USABILIDAD</text><text x="57.0" y="60.0" font-size="7.6" fill="#333" text-anchor="middle">f&#225;cil de aprender</text><text x="57.0" y="71.0" font-size="7.6" fill="#333" text-anchor="middle">y de usar</text><rect x="105.0" y="24.0" width="90.0" height="56.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.4"/><text x="150.0" y="44.0" font-size="9.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">UNIVERSALIDAD</text><text x="150.0" y="60.0" font-size="7.6" fill="#333" text-anchor="middle">vale para</text><text x="150.0" y="71.0" font-size="7.6" fill="#333" text-anchor="middle">todo el mundo</text><rect x="198.0" y="24.0" width="90.0" height="56.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.4"/><text x="243.0" y="44.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="bold">UTILIDAD</text><text x="243.0" y="60.0" font-size="7.6" fill="#333" text-anchor="middle">sirve de verdad</text><text x="243.0" y="71.0" font-size="7.6" fill="#333" text-anchor="middle">para la tarea</text><rect x="12.0" y="88.0" width="276.0" height="32.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="102.0" font-size="7.8" fill="#333" text-anchor="middle">Se alcanzan con: planificaci&#243;n razonada, sensibilidad a las</text><text x="150.0" y="114.0" font-size="7.8" fill="#333" text-anchor="middle">necesidades, an&#225;lisis de requisitos y pruebas concienzudas.</text><rect x="12.0" y="124.0" width="276.0" height="20.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="138.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">Y todo eso sin salirse del calendario ni del presupuesto.</text></svg>