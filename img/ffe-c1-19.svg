<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="mb" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#3b82f6"/></marker><marker id="mr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs><text x="75" y="16" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">(a)</text><line x1="13" y1="40" x2="137" y2="40" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mb)"/><line x1="13" y1="62" x2="137" y2="62" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mb)"/><text x="15" y="34" font-size="9" fill="#3b82f6" font-weight="bold">E</text><circle cx="75" cy="110" r="17" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="75" y="117" font-size="19" fill="#ef4444" text-anchor="middle" font-weight="bold">+</text><text x="75" y="140" font-size="8.5" fill="#333" text-anchor="middle">q₀ positiva</text><line x1="94" y1="110" x2="137" y2="110" stroke="#ef4444" stroke-width="3" marker-end="url(#mr)"/><text x="137" y="100" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">F</text><text x="75" y="160" font-size="8" fill="#333" text-anchor="middle">F apunta igual que E</text><text x="225" y="16" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">(b)</text><line x1="163" y1="40" x2="287" y2="40" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mb)"/><line x1="163" y1="62" x2="287" y2="62" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mb)"/><text x="165" y="34" font-size="9" fill="#3b82f6" font-weight="bold">E</text><circle cx="225" cy="110" r="17" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="225" y="117" font-size="19" fill="#3b82f6" text-anchor="middle" font-weight="bold">−</text><text x="225" y="140" font-size="8.5" fill="#333" text-anchor="middle">q₀ negativa</text><line x1="206" y1="110" x2="163" y2="110" stroke="#ef4444" stroke-width="3" marker-end="url(#mr)"/><text x="163" y="100" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">F</text><text x="225" y="160" font-size="8" fill="#333" text-anchor="middle">F apunta al revés que E</text><line x1="150" y1="6" x2="150" y2="170" stroke="#ddd" stroke-width="1"/><text x="150" y="186" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">F = q₀·E</text><text x="150" y="201" font-size="8" fill="#333" text-anchor="middle">El campo E es el mismo; la fuerza F cambia con el signo de q₀.</text></svg>