<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 232" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ejercicio 2: potencial en un punto</text><text x="150.0" y="27.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">q₁ = 8 nC en (7,0,0) · q₂ = 3 nC en (2,0,0) · P = (5,0,0)</text><line x1="20.0" y1="96.0" x2="284.0" y2="96.0" stroke="#999" stroke-width="1.3"/><line x1="20.0" y1="93.0" x2="20.0" y2="99.0" stroke="#999" stroke-width="1"/><text x="20.0" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">0</text><line x1="49.3" y1="93.0" x2="49.3" y2="99.0" stroke="#999" stroke-width="1"/><text x="49.3" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">1</text><line x1="78.7" y1="93.0" x2="78.7" y2="99.0" stroke="#999" stroke-width="1"/><text x="78.7" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">2</text><line x1="108.0" y1="93.0" x2="108.0" y2="99.0" stroke="#999" stroke-width="1"/><text x="108.0" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">3</text><line x1="137.3" y1="93.0" x2="137.3" y2="99.0" stroke="#999" stroke-width="1"/><text x="137.3" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">4</text><line x1="166.7" y1="93.0" x2="166.7" y2="99.0" stroke="#999" stroke-width="1"/><text x="166.7" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">5</text><line x1="196.0" y1="93.0" x2="196.0" y2="99.0" stroke="#999" stroke-width="1"/><text x="196.0" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">6</text><line x1="225.3" y1="93.0" x2="225.3" y2="99.0" stroke="#999" stroke-width="1"/><text x="225.3" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">7</text><line x1="254.7" y1="93.0" x2="254.7" y2="99.0" stroke="#999" stroke-width="1"/><text x="254.7" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">8</text><line x1="284.0" y1="93.0" x2="284.0" y2="99.0" stroke="#999" stroke-width="1"/><text x="284.0" y="110.0" font-size="7.4" fill="#999" text-anchor="middle">9</text><circle cx="78.7" cy="96.0" r="5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><circle cx="225.3" cy="96.0" r="5" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><circle cx="166.7" cy="96.0" r="5" fill="#ef4444" stroke="#ef4444" stroke-width="1.6"/><text x="78.7" y="86.0" font-size="7.6" fill="#3b82f6" text-anchor="middle" font-weight="bold">q₂ = 3 nC</text><text x="225.3" y="86.0" font-size="7.6" fill="#3b82f6" text-anchor="middle" font-weight="bold">q₁ = 8 nC</text><text x="166.7" y="74.0" font-size="9.4" fill="#ef4444" text-anchor="middle" font-weight="bold">P</text><line x1="166.7" y1="64.0" x2="225.3" y2="64.0" stroke="#7c3aed" stroke-width="1.2"/><text x="196.0" y="60.0" font-size="7.4" fill="#7c3aed" text-anchor="middle" font-weight="bold">r₁ = 2 m</text><line x1="78.7" y1="50.0" x2="166.7" y2="50.0" stroke="#7c3aed" stroke-width="1.2"/><text x="122.7" y="46.0" font-size="7.4" fill="#7c3aed" text-anchor="middle" font-weight="bold">r₂ = 3 m</text><rect x="10.0" y="120.0" width="280.0" height="22.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.3"/><text x="150.0" y="135.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">V = K · (q₁/r₁ + q₂/r₂)</text><text x="150.0" y="156.0" font-size="8.6" fill="#333" text-anchor="middle">V = 9×10⁹ · (8×10⁻⁹/2 + 3×10⁻⁹/3) = 9 · (4 + 1)</text><rect x="80.0" y="166.0" width="140.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="182.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">V = 45 V</text><text x="150.0" y="206.0" font-size="8.2" fill="#16a34a" text-anchor="middle" font-weight="bold">El potencial es ESCALAR: se suman los números, sin vectores.</text><text x="150.0" y="220.0" font-size="8.2" fill="#ef4444" text-anchor="middle" font-weight="bold">La distancia r es la que hay de cada carga AL PUNTO P.</text></svg>