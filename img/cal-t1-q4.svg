<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_5076" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">La trampa: resolver una ecuación que nadie pide</text><rect x="10.0" y="22.0" width="280.0" height="30.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.3"/><text x="150.0" y="34.0" font-size="9.4" fill="#ef4444" text-anchor="middle" font-weight="bold">x⁴ − 12x² + 36 = 0  →  x = ±√6</text><text x="150.0" y="46.0" font-size="7.8" fill="#ef4444" text-anchor="middle">eso son las RAÍCES del polinomio, no valores prohibidos</text><line x1="150.0" y1="56.0" x2="150.0" y2="72.0" stroke="#999" stroke-width="1.3" marker-end="url(#a1_5076)"/><text x="150.0" y="86.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Las raíces solo importan si el polinomio ESTÁ DIVIDIENDO</text><rect x="14.0" y="96.0" width="130.0" height="44.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="79.0" y="112.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">1/(x⁴ − 12x² + 36)</text><text x="79.0" y="128.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">ahí sí se quitan</text><rect x="156.0" y="96.0" width="130.0" height="44.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.2"/><text x="221.0" y="112.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">x⁴ − 12x² + 36</text><text x="221.0" y="128.0" font-size="8" fill="#16a34a" text-anchor="middle" font-weight="bold">aquí no se quita nada</text><rect x="60.0" y="148.0" width="180.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="164.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="bold">Dom = ℝ</text></svg>