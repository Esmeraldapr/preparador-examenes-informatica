444" text-anchor="start">lo de dentro tiene que ser &gt; 0</text><rect x="12.0" y="154.0" width="276.0" height="21.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.1"/><text x="22.0" y="168.0" font-size="8.4" fill="#333" text-anchor="start" font-weight="bold">Exponencial</text><text x="132.0" y="168.0" font-size="8.2" fill="#16a34a" text-anchor="start">nada: Dom = &#8477;</text><text x="150.0" y="188.0" font-size="7.2" fill="#333" text-anchor="middle" font-weight="bold">Solo hay 3 cosas prohibidas: dividir entre 0, ra&#237;z par de negativo y log de no positivo.</text></svg>