<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" role="img"><rect width="300" height="130" fill="#fff"/><defs><marker id="s11-999" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150" y="14" text-anchor="middle" font-size="10" fill="#666" font-family="Arial, sans-serif">Reduce desde lo más alejado de la fuente</text><rect x="30.0" y="37" width="40" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="50" y="33" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">10 + 20</text><text x="50" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="700" font-family="Arial, sans-serif">= 30 Ω</text><polyline points="70,44 100,44" fill="none" stroke="#333" stroke-width="1.6"/><rect x="102.0" y="37" width="40" height="14" rx="3" fill="#ede9fe" stroke="#3b82f6" stroke-width="1.6"/><text x="122" y="33" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">60 ∥ 30</text><text x="122" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="700" font-family="Arial, sans-serif">= 20 Ω</text><line x1="152" y1="44" x2="186" y2="44" stroke="#999" stroke-width="1.8" marker-end="url(#s11-999)"/><rect x="200.0" y="37" width="44" height="14" rx="3" fill="#ede9fe" stroke="#16a34a" stroke-width="1.6"/><text x="222" y="33" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">Req</text><text x="222" y="70" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">30 + 20 = 50 Ω</text><rect x="40" y="88" width="220" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="150" y="107" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">I = V / Req = 120 / 50 = 2,4 A</text></svg>