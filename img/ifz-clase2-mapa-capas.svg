<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 430' width='900' height='430'><rect width='900' height='430' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='bold' fill='#1e1b4b'>Diseño por capas: empiezas sencillo y vas abriendo más</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555'>Ejemplo del profe en clase: un reproductor de vídeo (streaming).</text><rect x='130.0' y='290' width='640' height='78' rx='14' fill='#16a34a' fill-opacity='.12' stroke='#16a34a' stroke-width='2.5'/><text x='148.0' y='322' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#16a34a'>Capa 1 · Básica</text><text x='148.0' y='348' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b'>Solo quiero darle al ▶ play y que funcione.</text><text x='752.0' y='322' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#555' text-anchor='end'>Usuario nuevo</text><rect x='80.0' y='198' width='740' height='78' rx='14' fill='#3b82f6' fill-opacity='.12' stroke='#3b82f6' stroke-width='2.5'/><text x='98.0' y='230' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#3b82f6'>Capa 2 · Más opciones</text><text x='98.0' y='256' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b'>Calidad del vídeo · velocidad · subtítulos · segundo audio.</text><text x='802.0' y='230' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#555' text-anchor='end'>Ya lo usa a diario</text><rect x='30.0' y='106' width='840' height='78' rx='14' fill='#7c3aed' fill-opacity='.12' stroke='#7c3aed' stroke-width='2.5'/><text x='48.0' y='138' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#7c3aed'>Capa 3 · Avanzada</text><text x='48.0' y='164' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b'>Lo que va descubriendo él solo, explorando el menú.</text><text x='852.0' y='138' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#555' text-anchor='end'>Usuario experto</text><text x='450' y='400' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#ef4444' text-anchor='middle'>Las capas no están fijadas: cada aplicación decide las suyas.</text><text x='450' y='422' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' text-anchor='middle'>Con Word igual: primero escribir y negrita → otro día estilos y tablas → otro día referencias e índice.</text></svg>