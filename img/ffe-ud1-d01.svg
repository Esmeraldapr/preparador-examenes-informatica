<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 184" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Las tres propiedades de la carga el&#233;ctrica</text><rect x="14.0" y="26.0" width="272.0" height="42.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="24.0" y="41.0" font-size="9.5" fill="#7c3aed" text-anchor="start" font-weight="bold">1. DUALIDAD</text><text x="24.0" y="53.0" font-size="8" fill="#333" text-anchor="start">hay dos signos: positiva y negativa</text><text x="24.0" y="63.0" font-size="7.5" fill="#999" text-anchor="start">igual se repele, distinto se atrae</text><rect x="14.0" y="73.0" width="272.0" height="42.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="24.0" y="88.0" font-size="9.5" fill="#3b82f6" text-anchor="start" font-weight="bold">2. CONSERVACI&#211;N</text><text x="24.0" y="100.0" font-size="8" fill="#333" text-anchor="start">no se crea ni se destruye</text><text x="24.0" y="110.0" font-size="7.5" fill="#999" text-anchor="start">en un sistema aislado la suma es constante</text><rect x="14.0" y="120.0" width="272.0" height="42.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="24.0" y="135.0" font-size="9.5" fill="#16a34a" text-anchor="start" font-weight="bold">3. CUANTIZACI&#211;N</text><text x="24.0" y="147.0" font-size="8" fill="#333" text-anchor="start">toda carga es m&#250;ltiplo entero de e</text><text x="24.0" y="157.0" font-size="7.5" fill="#999" text-anchor="start">e = 1,602 &#183; 10&#8315;&#185;&#8313; C</text><text x="150.0" y="178.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">La unidad de carga es el CULOMBIO (C).</text></svg>