<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 212" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Regla 1: &#191;consistencia en qu&#233;, exactamente?</text><rect x="12.0" y="24.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.1"/><text x="20.0" y="35.0" font-size="8" fill="#333" text-anchor="start" font-weight="bold">Terminolog&#237;a</text><text x="20.0" y="45.0" font-size="7" fill="#7c3aed" text-anchor="start">el mismo concepto, siempre con la misma palabra</text><rect x="12.0" y="53.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.1"/><text x="20.0" y="64.0" font-size="8" fill="#333" text-anchor="start" font-weight="bold">Colores</text><text x="20.0" y="74.0" font-size="7" fill="#ef4444" text-anchor="start">si el naranja avisa de un riesgo, no decora en otra ventana</text><rect x="12.0" y="82.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="20.0" y="93.0" font-size="8" fill="#333" text-anchor="start" font-weight="bold">Tipos de letra</text><text x="20.0" y="103.0" font-size="7" fill="#3b82f6" text-anchor="start">misma fuente, tama&#241;o y negrita en todos los formularios</text><rect x="12.0" y="111.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.1"/><text x="20.0" y="122.0" font-size="8" fill="#333" text-anchor="start" font-weight="bold">Formas y tama&#241;os</text><text x="20.0" y="132.0" font-size="7" fill="#16a34a" text-anchor="start">el mismo estilo en todo el software</text><rect x="12.0" y="140.0" width="276.0" height="26.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.1"/><text x="20.0" y="151.0" font-size="8" fill="#333" text-anchor="start" font-weight="bold">Organizaci&#243;n de pantalla</text><text x="20.0" y="161.0" font-size="7" fill="#7c3aed" text-anchor="start">si un formulario lleva franja a la izquierda, todos</text><rect x="12.0" y="171.0" width="276.0" height="36.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="184.0" font-size="7.4" fill="#333" text-anchor="middle" font-weight="bold">Lo que busca el usuario es un entorno ESTABLE y PREDECIBLE</text><text x="150.0" y="196.0" font-size="7.4" fill="#333" text-anchor="middle">en el que se maneje sin pensar. Fallar aqu&#237; da mala imagen.</text></svg>