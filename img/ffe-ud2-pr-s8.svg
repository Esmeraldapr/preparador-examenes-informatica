<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img"><rect width="300" height="110" fill="#fff"/><polyline points="60,50 138,50" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="162,50 240,50" fill="none" stroke="#333" stroke-width="1.6"/><line x1="140" y1="22" x2="140" y2="78" stroke="#ef4444" stroke-width="2.4"/><line x1="160" y1="38" x2="160" y2="62" stroke="#3b82f6" stroke-width="5"/><text x="118" y="30" text-anchor="end" font-size="10" fill="#ef4444" font-weight="700" font-family="Arial, sans-serif">raya larga = polo +</text><text x="118" y="43" text-anchor="end" font-size="9" fill="#ef4444" font-family="Arial, sans-serif">(potencial más alto)</text><text x="182" y="30" text-anchor="start" font-size="10" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">raya corta = polo −</text><text x="182" y="43" text-anchor="start" font-size="9" fill="#3b82f6" font-family="Arial, sans-serif">(potencial más bajo)</text><text x="150" y="100" text-anchor="middle" font-size="10" fill="#333" font-weight="700" font-family="Arial, sans-serif">Larga = positivo. Corta = negativo.</text></svg>