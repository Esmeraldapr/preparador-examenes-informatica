<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 164" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Tres disciplinas, dos puntos de vista</text><rect x="10.0" y="24.0" width="90.0" height="64.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="55.0" y="42.0" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">CHI</text><text x="55.0" y="55.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">Interacci&#243;n</text><text x="55.0" y="67.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">hombre-m&#225;quina</text><text x="55.0" y="100.0" font-size="7.4" fill="#333" text-anchor="middle">c&#243;mo nos relacionamos</text><text x="55.0" y="110.0" font-size="7.4" fill="#333" text-anchor="middle">con los dispositivos</text><rect x="105.0" y="24.0" width="90.0" height="64.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/><text x="150.0" y="42.0" font-size="10.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">Dise&#241;o de</text><text x="150.0" y="55.0" font-size="9" fill="#3b82f6" text-anchor="middle" font-weight="bold">interacci&#243;n</text><text x="150.0" y="100.0" font-size="7.4" fill="#333" text-anchor="middle">que el producto encaje</text><text x="150.0" y="110.0" font-size="7.4" fill="#333" text-anchor="middle">en la vida real</text><rect x="200.0" y="24.0" width="90.0" height="64.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><text x="245.0" y="42.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="bold">UX</text><text x="245.0" y="55.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">Experiencia</text><text x="245.0" y="67.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">de usuario</text><text x="245.0" y="100.0" font-size="7.4" fill="#333" text-anchor="middle">qu&#233; opina el usuario</text><text x="245.0" y="110.0" font-size="7.4" fill="#333" text-anchor="middle">del producto</text><rect x="10.0" y="120.0" width="185.0" height="20.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.2"/><text x="102.0" y="134.0" font-size="7.8" fill="#3b82f6" text-anchor="middle" font-weight="bold">punto de vista del DESARROLLADOR</text><rect x="200.0" y="120.0" width="90.0" height="20.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="245.0" y="134.0" font-size="7.8" fill="#16a34a" text-anchor="middle" font-weight="bold">del USUARIO</text><text x="150.0" y="158.0" font-size="7.6" fill="#333" text-anchor="middle" font-weight="bold">Las tres est&#225;n relacionadas: las dos primeras se usan para mejorar la tercera.</text></svg>