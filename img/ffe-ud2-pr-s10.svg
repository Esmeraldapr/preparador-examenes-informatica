<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 135" role="img"><rect width="300" height="135" fill="#fff"/><polyline points="40,30 200,30" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="40,100 200,100" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="110,30 110,50" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="110,80 110,100" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="200,30 200,50" fill="none" stroke="#333" stroke-width="1.6"/><polyline points="200,80 200,100" fill="none" stroke="#333" stroke-width="1.6"/><rect x="103" y="50.0" width="14" height="30" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="99" y="68" text-anchor="end" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">60 Ω</text><rect x="193" y="50.0" width="14" height="30" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="189" y="68" text-anchor="end" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">30 Ω</text><circle cx="40" cy="30" r="4" fill="#ef4444"/><circle cx="40" cy="100" r="4" fill="#ef4444"/><circle cx="110" cy="30" r="3" fill="#333"/><circle cx="110" cy="100" r="3" fill="#333"/><text x="254" y="56" text-anchor="middle" font-size="9.5" fill="#333" font-family="Arial, sans-serif">producto</text><polyline points="228,60 280,60" fill="none" stroke="#333" stroke-width="1.2"/><text x="254" y="72" text-anchor="middle" font-size="9.5" fill="#333" font-family="Arial, sans-serif">suma</text><text x="150" y="118" text-anchor="middle" font-size="10.5" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">Req = (60 × 30) / (60 + 30) = 1800 / 90 = 20 Ω</text><text x="150" y="131" text-anchor="middle" font-size="9" fill="#666" font-family="Arial, sans-serif">Siempre menor que la más pequeña (20 &lt; 30)</text></svg>