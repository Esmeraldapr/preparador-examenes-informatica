<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Los tres perfiles de usuario</text><rect x="10.0" y="24.0" width="88.0" height="66.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="54.0" y="38.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">NUEVO</text><text x="54.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">vocabulario corto</text><text x="54.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">pocas acciones</text><text x="54.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">mucha ayuda</text><rect x="106.0" y="24.0" width="88.0" height="66.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="38.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">INTERMITENTE</text><text x="150.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">men&#250;s ordenados</text><text x="150.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">reconocer, no</text><text x="150.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">recordar</text><rect x="202.0" y="24.0" width="88.0" height="66.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="246.0" y="38.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">EXPERTO</text><text x="246.0" y="51.0" font-size="7.5" fill="#333" text-anchor="middle">atajos y macros</text><text x="246.0" y="61.0" font-size="7.5" fill="#333" text-anchor="middle">respuesta r&#225;pida</text><text x="246.0" y="71.0" font-size="7.5" fill="#333" text-anchor="middle">poca ayuda</text><text x="150.0" y="106.0" font-size="9" fill="#333" text-anchor="middle">El mismo programa tiene que servir a los tres.</text><text x="150.0" y="120.0" font-size="9.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">Soluci&#243;n: aprendizaje EN CAPAS (multicapa)</text><text x="150.0" y="134.0" font-size="8.5" fill="#333" text-anchor="middle">Empiezas con lo m&#237;nimo y vas desbloqueando</text><text x="150.0" y="148.0" font-size="8.5" fill="#333" text-anchor="middle">cosas seg&#250;n ganas confianza.</text></svg>