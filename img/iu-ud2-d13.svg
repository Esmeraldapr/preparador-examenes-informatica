<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Tres formas de organizar los comandos</text><rect x="16.0" y="24.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="37.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">1. Un comando por tarea</text><text x="26.0" y="48.0" font-size="8" fill="#3b82f6" text-anchor="start">BORRAR, COPIAR, IMPRIMIR</text><text x="26.0" y="58.0" font-size="7.5" fill="#333" text-anchor="start">f&#225;cil si hay pocas tareas</text><rect x="16.0" y="68.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="81.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">2. Comando + argumentos</text><text x="26.0" y="92.0" font-size="8" fill="#3b82f6" text-anchor="start">COPY FILE1, FILE2</text><text x="26.0" y="102.0" font-size="7.5" fill="#333" text-anchor="start">o con etiquetas: COPY FROM= TO=</text><rect x="16.0" y="112.0" width="268.0" height="38.0" rx="3" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.2"/><text x="26.0" y="125.0" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="bold">3. Estructura en &#225;rbol</text><text x="26.0" y="136.0" font-size="8" fill="#3b82f6" text-anchor="start">acci&#243;n + objeto + destino</text><text x="26.0" y="146.0" font-size="7.5" fill="#333" text-anchor="start">COPY archivo impresora de red</text><text x="150.0" y="166.0" font-size="8" fill="#999" text-anchor="middle">Las etiquetas quitan el orden de encima, pero se teclea m&#225;s.</text></svg>