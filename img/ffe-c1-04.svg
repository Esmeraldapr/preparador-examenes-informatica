<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_4156" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker><marker id="a2_4156" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ef4444"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ley de Coulomb: la fuerza entre dos cargas</text><rect x="10.0" y="22.0" width="280.0" height="28.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.4"/><text x="150.0" y="41.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">F = K · q₁ · q₂ / r²        K = 9 × 10⁹ N·m²/C²</text><circle cx="90.0" cy="78.0" r="7" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="90.0" y="80.5" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">+</text><circle cx="210.0" cy="78.0" r="7" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.6"/><text x="210.0" y="80.5" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">+</text><line x1="98.0" y1="78.0" x2="202.0" y2="78.0" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="84.0" y1="78.0" x2="50.0" y2="78.0" stroke="#ef4444" stroke-width="2.2" marker-end="url(#a1_4156)"/><line x1="216.0" y1="78.0" x2="250.0" y2="78.0" stroke="#ef4444" stroke-width="2.2" marker-end="url(#a2_4156)"/><text x="90.0" y="64.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">q₁</text><text x="210.0" y="64.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">q₂</text><text x="56.0" y="68.0" font-size="8.6" fill="#ef4444" text-anchor="middle" font-weight="bold">F₂₁</text><text x="244.0" y="68.0" font-size="8.6" fill="#ef4444" text-anchor="middle" font-weight="bold">F₁₂</text><text x="150.0" y="96.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">distancia r</text><text x="150.0" y="108.0" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="bold">mismo signo → se repelen (hacia fuera)</text><rect x="10.0" y="128.0" width="280.0" height="20.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="141.5" font-size="8.2" fill="#7c3aed" text-anchor="start" font-weight="bold">Doblas las cargas</text><text x="282.0" y="141.5" font-size="7.6" fill="#333" text-anchor="end">la fuerza se DOBLA (proporcional al producto)</text><rect x="10.0" y="150.0" width="280.0" height="20.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="163.5" font-size="8.2" fill="#ef4444" text-anchor="start" font-weight="bold">Doblas la distancia</text><text x="282.0" y="163.5" font-size="7.6" fill="#333" text-anchor="end">la fuerza se divide entre 4 (es r al cuadrado)</text><rect x="10.0" y="172.0" width="280.0" height="20.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="185.5" font-size="8.2" fill="#3b82f6" text-anchor="start" font-weight="bold">Dirección</text><text x="282.0" y="185.5" font-size="7.6" fill="#333" text-anchor="end">la recta que une las dos cargas</text><rect x="10.0" y="194.0" width="280.0" height="20.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="207.5" font-size="8.2" fill="#16a34a" text-anchor="start" font-weight="bold">Acción-reacción</text><text x="282.0" y="207.5" font-size="7.6" fill="#333" text-anchor="end">F₁₂ = −F₂₁: igual módulo, sentido contrario</text><text x="150.0" y="220.0" font-size="8" fill="#999" text-anchor="middle">En clase: usa K = 9 × 10⁹ (el valor exacto es 8,98755 × 10⁹).</text></svg>