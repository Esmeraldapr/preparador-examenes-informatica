<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 590' width='900' height='590'><rect width='900' height='590' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='21' fill='#1e1b4b' text-anchor='start' font-weight="bold">Pasos de una prueba de usabilidad (lo que dijo el profe)</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>No es un esquema rígido: depende del producto.</text><circle cx='44' cy='104' r='20' fill='#7c3aed'/><text x='44' y='110' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">1</text><text x='80' y='100' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Decidir qué parte evaluar</text><text x='80' y='122' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Una parte o todo el programa?</text><line x1='44' y1='124' x2='44' y2='142' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='166' r='20' fill='#7c3aed'/><text x='44' y='172' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">2</text><text x='80' y='162' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Elegir las tareas de la prueba</text><text x='80' y='184' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Amplias (visión general) o concretas.</text><line x1='44' y1='186' x2='44' y2='204' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='228' r='20' fill='#7c3aed'/><text x='44' y='234' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">3</text><text x='80' y='224' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Fijar los criterios</text><text x='80' y='246' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Qué es éxito y qué es fallo (rúbrica).</text><line x1='44' y1='248' x2='44' y2='266' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='290' r='20' fill='#7c3aed'/><text x='44' y='296' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">4</text><text x='80' y='286' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Escribir el guion</text><text x='80' y='308' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Para que la prueba sea siempre igual.</text><line x1='44' y1='310' x2='44' y2='328' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='352' r='20' fill='#7c3aed'/><text x='44' y='358' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">5</text><text x='80' y='348' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Preparar y vigilar</text><text x='80' y='370' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>El supervisor es neutral y toma notas.</text><line x1='44' y1='372' x2='44' y2='390' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='414' r='20' fill='#ef4444'/><text x='44' y='420' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">6</text><text x='80' y='410' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#ef4444' text-anchor='start' font-weight="bold">Hacer el estudio</text><text x='80' y='432' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Los usuarios trabajan SIN ayuda.</text><line x1='44' y1='434' x2='44' y2='452' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='476' r='20' fill='#7c3aed'/><text x='44' y='482' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">7</text><text x='80' y='472' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Analizar los resultados</text><text x='80' y='494' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Eficacia, eficiencia, errores, satisfacción.</text><line x1='44' y1='496' x2='44' y2='514' stroke='#ddd' stroke-width='3'/><circle cx='44' cy='538' r='20' fill='#7c3aed'/><text x='44' y='544' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='white' text-anchor='middle' font-weight="bold">8</text><text x='80' y='534' font-family='Arial, Helvetica, sans-serif' font-size='17' fill='#7c3aed' text-anchor='start' font-weight="bold">Publicar (opcional)</text><text x='80' y='556' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Dentro de la empresa o en público.</text></svg>