<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 164" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_2818" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">Lo m&#225;s general arriba, lo m&#225;s concreto abajo</text><rect x="30.0" y="24.0" width="240.0" height="36.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/><text x="150.0" y="39.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">TEOR&#205;AS</text><text x="150.0" y="52.0" font-size="7.5" fill="#333" text-anchor="middle">marco para razonar; unifican la terminolog&#237;a</text><rect x="50.0" y="66.0" width="200.0" height="36.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="81.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">PRINCIPIOS</text><text x="150.0" y="94.0" font-size="7.5" fill="#333" text-anchor="middle">amplia aplicaci&#243;n; duraderos; hay que adaptarlos</text><rect x="70.0" y="108.0" width="160.0" height="36.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><text x="150.0" y="123.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">DIRECTRICES</text><text x="150.0" y="136.0" font-size="7.5" fill="#333" text-anchor="middle">muy focalizadas; se aplican tal cual</text><line x1="16.0" y1="32.0" x2="16.0" y2="124.0" stroke="#999" stroke-width="1.2" marker-end="url(#a1_2818)"/><text x="150.0" y="152.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen: directrices = focalizadas;</text><text x="150.0" y="162.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">principios = de amplia aplicaci&#243;n</text></svg>