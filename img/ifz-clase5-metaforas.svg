<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 500' width='900' height='500'><rect width='900' height='500' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='21' fill='#1e1b4b' text-anchor='start' font-weight="bold">Las metáforas: 5 cosas que revisa el experto</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Metáfora = parecido con algo que ya conoces del mundo real.</text><rect x='20' y='78' width='860' height='72' rx='12' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='40' y='106' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#7c3aed' text-anchor='start' font-weight="bold">1. Hábitos</text><text x='300' y='106' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Iconos y atajos los de siempre? (Ctrl+C, Ctrl+V)</text><text x='300' y='130' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>¿Puedo crear atajos nuevos?</text><rect x='20' y='162' width='860' height='72' rx='12' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='40' y='190' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#3b82f6' text-anchor='start' font-weight="bold">2. Hilo de pensamiento</text><text x='300' y='190' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Me acompaña paso a paso?</text><text x='300' y='214' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Ejemplo: el asistente de instalación.</text><rect x='20' y='246' width='860' height='72' rx='12' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='40' y='274' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#7c3aed' text-anchor='start' font-weight="bold">3. Asociaciones</text><text x='300' y='274' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Cada cosa recuerda a lo que hace?</text><text x='300' y='298' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Ejemplo: Eclipse, paneles siempre en su sitio.</text><rect x='20' y='330' width='860' height='72' rx='12' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='40' y='358' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#3b82f6' text-anchor='start' font-weight="bold">4. Términos</text><text x='300' y='358' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Entiende lo que escribo? ¿Lo entiendo yo?</text><text x='300' y='382' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Ejemplo: buscador demasiado amplio o estrecho.</text><rect x='20' y='414' width='860' height='72' rx='12' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='40' y='442' font-family='Arial, Helvetica, sans-serif' font-size='18' fill='#7c3aed' text-anchor='start' font-weight="bold">5. Conocimiento</text><text x='300' y='442' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>¿Me obliga a saber o recordar de más?</text><text x='300' y='466' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Ejemplo: el mapa rellena nombre y ubicación.</text></svg>