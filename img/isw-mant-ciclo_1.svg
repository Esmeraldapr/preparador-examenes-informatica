<svg viewBox='0 0 300 110' xmlns='http://www.w3.org/2000/svg'><defs><marker id='isw-mc' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L6,3 L0,6 z' fill='#7c3aed'/></marker></defs><text x='150' y='14' font-family='Arial' font-size='10' font-weight='bold' text-anchor='middle' fill='#333'>Después de entregar al cliente…</text><rect x='6' y='28' width='88' height='46' rx='8' fill='#f5f3ff' stroke='#7c3aed' stroke-width='1.5'/><text x='50' y='48' font-family='Arial' font-size='9.5' font-weight='bold' text-anchor='middle' fill='#7c3aed'>1. Incidencias</text><text x='50' y='64' font-family='Arial' font-size='8.5' text-anchor='middle' fill='#333'>salen fallos</text><line x1='95' y1='51' x2='110' y2='51' stroke='#7c3aed' stroke-width='1.5' marker-end='url(#isw-mc)'/><rect x='106' y='28' width='88' height='46' rx='8' fill='#f5f3ff' stroke='#7c3aed' stroke-width='1.5'/><text x='150' y='48' font-family='Arial' font-size='9.5' font-weight='bold' text-anchor='middle' fill='#7c3aed'>2. Modificaciones</text><text x='150' y='64' font-family='Arial' font-size='8.5' text-anchor='middle' fill='#333'>se cambia</text><line x1='195' y1='51' x2='210' y2='51' stroke='#7c3aed' stroke-width='1.5' marker-end='url(#isw-mc)'/><rect x='206' y='28' width='88' height='46' rx='8' fill='#f5f3ff' stroke='#7c3aed' stroke-width='1.5'/><text x='250' y='48' font-family='Arial' font-size='9.5' font-weight='bold' text-anchor='middle' fill='#7c3aed'>3. Lo nuevo</text><text x='250' y='64' font-family='Arial' font-size='8.5' text-anchor='middle' fill='#333'>funciones o migración</text><text x='150' y='96' font-family='Arial' font-size='10' text-anchor='middle' fill='#ef4444'>Primero salen fallos; lo nuevo llega al final</text></svg>