<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 470' width='900' height='470'><rect width='900' height='470' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight="bold" fill='#1e1b4b' text-anchor='start'>Los 3 tipos de usuario y qué necesita cada uno</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Lo contó el profe al empezar la UD2. Una misma interfaz tiene que servir a los tres.</text><rect x='20' y='80' width='276' height='370' rx='14' fill='#16a34a' fill-opacity='.10' stroke='#16a34a' stroke-width='2.5'/><text x='36' y='112' font-family='Arial, Helvetica, sans-serif' font-size='20' font-weight="bold" fill='#16a34a' text-anchor='start'>Nuevo</text><text x='36' y='134' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>(primera vez)</text><text x='36' y='170' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Sabe poco de la tarea</text><text x='36' y='199' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>y poco de la interfaz.</text><text x='36' y='228' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'></text><text x='36' y='257' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight="bold" fill='#1e1b4b' text-anchor='start'>Necesita:</text><text x='36' y='286' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Vocabulario corto y conocido.</text><text x='36' y='315' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Pocas acciones.</text><text x='36' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Avisos al terminar cada tarea.</text><text x='36' y='373' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Errores claros y amables.</text><text x='36' y='402' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Tutoriales y vídeos.</text><rect x='312' y='80' width='276' height='370' rx='14' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='328' y='112' font-family='Arial, Helvetica, sans-serif' font-size='20' font-weight="bold" fill='#3b82f6' text-anchor='start'>Intermitente</text><text x='328' y='134' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>(de vez en cuando)</text><text x='328' y='170' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Conoce la tarea y la</text><text x='328' y='199' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>interfaz, pero se le olvida</text><text x='328' y='228' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>dónde estaba cada cosa.</text><text x='328' y='257' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight="bold" fill='#1e1b4b' text-anchor='start'>Necesita:</text><text x='328' y='286' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Menús bien ordenados.</text><text x='328' y='315' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Mismos nombres siempre.</text><text x='328' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Reconocer mejor que</text><text x='328' y='373' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>  recordar: que la interfaz</text><text x='328' y='402' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>  le guíe.</text><rect x='604' y='80' width='276' height='370' rx='14' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='620' y='112' font-family='Arial, Helvetica, sans-serif' font-size='20' font-weight="bold" fill='#7c3aed' text-anchor='start'>Frecuente</text><text x='620' y='134' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>(todos los días, experto)</text><text x='620' y='170' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Domina la tarea y la</text><text x='620' y='199' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>interfaz. Quiere ir rápido.</text><text x='620' y='228' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'></text><text x='620' y='257' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight="bold" fill='#1e1b4b' text-anchor='start'>Necesita:</text><text x='620' y='286' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Respuestas rápidas.</text><text x='620' y='315' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Atajos de teclado</text><text x='620' y='344' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>  (sin tocar el ratón).</text><text x='620' y='373' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>· Macros: muchos pasos</text><text x='620' y='402' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>  en una sola orden.</text></svg>