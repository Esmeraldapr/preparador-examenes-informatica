<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 164" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Números reales positivos: ℝ⁺ = (0, +∞)</text><line x1="24.0" y1="54.0" x2="276.0" y2="54.0" stroke="#999" stroke-width="1.4"/><line x1="130.0" y1="54.0" x2="276.0" y2="54.0" stroke="#7c3aed" stroke-width="5"/><circle cx="130.0" cy="54.0" r="5" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><text x="130.0" y="74.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">0</text><text x="130.0" y="38.0" font-size="8.4" fill="#ef4444" text-anchor="middle" font-weight="bold">el 0 NO entra</text><text x="215.0" y="38.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">x &gt; 0</text><text x="20.0" y="86.0" font-size="8.8" fill="#16a34a" text-anchor="start" font-weight="bold">x &gt; 0  ✓</text><text x="282.0" y="86.0" font-size="8.2" fill="#333" text-anchor="end">esa es la definición</text><text x="20.0" y="105.0" font-size="8.8" fill="#ef4444" text-anchor="start" font-weight="bold">ℤ  ✗</text><text x="282.0" y="105.0" font-size="8.2" fill="#333" text-anchor="end">son los enteros, otro conjunto</text><text x="20.0" y="124.0" font-size="8.8" fill="#ef4444" text-anchor="start" font-weight="bold">x ≤ 0  ✗</text><text x="282.0" y="124.0" font-size="8.2" fill="#333" text-anchor="end">esos son los NO positivos</text><text x="20.0" y="143.0" font-size="8.8" fill="#ef4444" text-anchor="start" font-weight="bold">incluye al 0  ✗</text><text x="282.0" y="143.0" font-size="8.2" fill="#333" text-anchor="end">el 0 no es positivo ni negativo</text></svg>