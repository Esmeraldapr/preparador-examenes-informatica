<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 252" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Chuleta de la UD1</text><rect x="10.0" y="22.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="35.0" font-size="8.4" fill="#7c3aed" text-anchor="start" font-weight="bold">F = K·q₁·q₂/r²</text><text x="282.0" y="35.0" font-size="7.4" fill="#333" text-anchor="end">fuerza entre dos cargas (vector)</text><rect x="10.0" y="43.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="20.0" y="56.0" font-size="8.4" fill="#3b82f6" text-anchor="start" font-weight="bold">E = F/q₀ = K·q/r²</text><text x="282.0" y="56.0" font-size="7.4" fill="#333" text-anchor="end">campo eléctrico (vector), en N/C</text><rect x="10.0" y="64.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="77.0" font-size="8.4" fill="#16a34a" text-anchor="start" font-weight="bold">Φ = E·S·cos α</text><text x="282.0" y="77.0" font-size="7.4" fill="#333" text-anchor="end">flujo eléctrico (escalar)</text><rect x="10.0" y="85.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="20.0" y="98.0" font-size="8.4" fill="#16a34a" text-anchor="start" font-weight="bold">Φ = Q interior/ε₀</text><text x="282.0" y="98.0" font-size="7.4" fill="#333" text-anchor="end">ley de Gauss</text><rect x="10.0" y="106.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="20.0" y="119.0" font-size="8.4" fill="#7c3aed" text-anchor="start" font-weight="bold">V = K·q/r</text><text x="282.0" y="119.0" font-size="7.4" fill="#333" text-anchor="end">potencial (escalar), en voltios</text><rect x="10.0" y="127.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="140.0" font-size="8.4" fill="#ef4444" text-anchor="start" font-weight="bold">C = Q/V</text><text x="282.0" y="140.0" font-size="7.4" fill="#333" text-anchor="end">capacidad, en faradios</text><rect x="10.0" y="148.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="161.0" font-size="8.4" fill="#ef4444" text-anchor="start" font-weight="bold">C = ε₀·S/d</text><text x="282.0" y="161.0" font-size="7.4" fill="#333" text-anchor="end">condensador plano</text><rect x="10.0" y="169.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="182.0" font-size="8.4" fill="#ef4444" text-anchor="start" font-weight="bold">1/C = 1/C₁+1/C₂</text><text x="282.0" y="182.0" font-size="7.4" fill="#333" text-anchor="end">condensadores en serie</text><rect x="10.0" y="190.0" width="280.0" height="19.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="20.0" y="203.0" font-size="8.4" fill="#ef4444" text-anchor="start" font-weight="bold">C = C₁+C₂</text><text x="282.0" y="203.0" font-size="7.4" fill="#333" text-anchor="end">condensadores en paralelo</text><rect x="10.0" y="213.0" width="280.0" height="34.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="227.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">K = 9 × 10⁹ N·m²/C²    ·    ε₀ = 8,854 × 10⁻¹² C²/(N·m²)</text><text x="150.0" y="240.0" font-size="8.2" fill="#333" text-anchor="middle" font-weight="bold">e = 1,602 × 10⁻¹⁹ C (carga del electrón o del protón)</text></svg>