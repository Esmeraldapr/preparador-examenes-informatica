<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 256" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_8405" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_8405" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a3_8405" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a4_8405" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Límite cuando x → a: SUSTITUYE primero</text><rect x="80.0" y="22.0" width="140.0" height="24.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.4"/><text x="150.0" y="38.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">sustituye x = a</text><line x1="150.0" y1="48.0" x2="150.0" y2="56.0" stroke="#999" stroke-width="1" marker-end="url(#a1_8405)"/><rect x="10.0" y="56.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><text x="18.0" y="70.0" font-size="9.2" fill="#16a34a" text-anchor="start" font-weight="bold">sale un NÚMERO</text><text x="18.0" y="84.0" font-size="8.3" fill="#333" text-anchor="start" font-weight="bold">→ ya está</text><text x="282.0" y="70.0" font-size="7.4" fill="#999" text-anchor="end">(x+3)²/(x−3)³ en 9 → 2/3</text><line x1="150.0" y1="96.0" x2="150.0" y2="104.0" stroke="#999" stroke-width="1" marker-end="url(#a2_8405)"/><rect x="10.0" y="104.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/><text x="18.0" y="118.0" font-size="9.2" fill="#3b82f6" text-anchor="start" font-weight="bold">sale k/0  (k ≠ 0)</text><text x="18.0" y="132.0" font-size="8.3" fill="#333" text-anchor="start" font-weight="bold">→ asíntota vertical: ±∞ según el signo</text><text x="282.0" y="118.0" font-size="7.4" fill="#999" text-anchor="end">mira los dos lados por separado</text><line x1="150.0" y1="144.0" x2="150.0" y2="152.0" stroke="#999" stroke-width="1" marker-end="url(#a3_8405)"/><rect x="10.0" y="152.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.3"/><text x="18.0" y="166.0" font-size="9.2" fill="#ef4444" text-anchor="start" font-weight="bold">sale 0/0</text><text x="18.0" y="180.0" font-size="8.3" fill="#333" text-anchor="start" font-weight="bold">→ factoriza y simplifica</text><text x="282.0" y="166.0" font-size="7.4" fill="#999" text-anchor="end">(x²−9)/(x²−5x+6) en 3 → 6</text><line x1="150.0" y1="192.0" x2="150.0" y2="200.0" stroke="#999" stroke-width="1" marker-end="url(#a4_8405)"/><rect x="10.0" y="200.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="18.0" y="214.0" font-size="9.2" fill="#7c3aed" text-anchor="start" font-weight="bold">sale ∞ − ∞</text><text x="18.0" y="228.0" font-size="8.3" fill="#333" text-anchor="start" font-weight="bold">→ conjugado (raíces) o denominador común</text><text x="282.0" y="214.0" font-size="7.4" fill="#999" text-anchor="end">√(x²+3x) − √(x²+x)</text></svg>