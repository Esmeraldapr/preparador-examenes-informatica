<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Organizar la pantalla: los cinco objetivos</text><rect x="12.0" y="24.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1"/><text x="22.0" y="38.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">1. Consistencia</text><text x="138.0" y="38.5" font-size="7.4" fill="#7c3aed" text-anchor="start">mismo formato y color para cada dato</text><rect x="12.0" y="48.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="22.0" y="62.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">2. Asimilaci&#243;n eficiente</text><text x="138.0" y="62.5" font-size="7.4" fill="#3b82f6" text-anchor="start">columnas claras y n&#250;meros a la derecha</text><rect x="12.0" y="72.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="22.0" y="86.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">3. M&#237;nima carga de memoria</text><text x="138.0" y="86.5" font-size="7.4" fill="#16a34a" text-anchor="start">no recordar algo de una pantalla a otra</text><rect x="12.0" y="96.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="22.0" y="110.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">4. Compatibilidad</text><text x="138.0" y="110.5" font-size="7.4" fill="#ef4444" text-anchor="start">lo que se ve y lo que se pide, igual</text><rect x="12.0" y="120.0" width="276.0" height="22.0" rx="3" fill="#fff" stroke="#999" stroke-width="1"/><text x="22.0" y="134.5" font-size="7.4" fill="#333" text-anchor="start" font-weight="bold">5. Flexibilidad</text><text x="138.0" y="134.5" font-size="7.4" fill="#999" text-anchor="start">que el usuario reordene y configure</text><rect x="12.0" y="148.0" width="276.0" height="42.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="161.0" font-size="7.6" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen cae mucho la pregunta de la web abarrotada:</text><text x="150.0" y="172.0" font-size="7.4" fill="#333" text-anchor="middle">una p&#225;gina llena de texto, anuncios y enlaces es una interfaz</text><text x="150.0" y="182.0" font-size="7.4" fill="#333" text-anchor="middle">MUY MALA, porque satura y no hay orden. Ha ca&#237;do 5 veces.</text></svg>