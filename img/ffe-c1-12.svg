<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 212" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Conductores, aislantes y semiconductores</text><rect x="8.0" y="22.0" width="90.0" height="172.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><rect x="8.0" y="22.0" width="90.0" height="5.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/><text x="53.0" y="40.0" font-size="7.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">CONDUCTORES</text><text x="53.0" y="56.0" font-size="7.2" fill="#333" text-anchor="middle">electrones libres</text><text x="53.0" y="68.0" font-size="7.2" fill="#333" text-anchor="middle">metales: cobre,</text><text x="53.0" y="80.0" font-size="7.2" fill="#333" text-anchor="middle">aluminio…</text><text x="53.0" y="92.0" font-size="7.2" fill="#333" text-anchor="middle">en equilibrio E = 0</text><text x="53.0" y="104.0" font-size="7.2" fill="#333" text-anchor="middle">dentro</text><text x="53.0" y="116.0" font-size="7.2" fill="#333" text-anchor="middle">la carga se queda</text><text x="53.0" y="128.0" font-size="7.2" fill="#333" text-anchor="middle">en la superficie</text><rect x="104.0" y="22.0" width="90.0" height="172.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.3"/><rect x="104.0" y="22.0" width="90.0" height="5.0" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="0"/><text x="149.0" y="40.0" font-size="7.6" fill="#16a34a" text-anchor="middle" font-weight="bold">AISLANTES</text><text x="149.0" y="56.0" font-size="7.2" fill="#333" text-anchor="middle">electrones muy</text><text x="149.0" y="68.0" font-size="7.2" fill="#333" text-anchor="middle">ligados al átomo</text><text x="149.0" y="80.0" font-size="7.2" fill="#333" text-anchor="middle">plástico, vidrio,</text><text x="149.0" y="92.0" font-size="7.2" fill="#333" text-anchor="middle">cerámica…</text><text x="149.0" y="104.0" font-size="7.2" fill="#333" text-anchor="middle">casi no dejan pasar</text><text x="149.0" y="116.0" font-size="7.2" fill="#333" text-anchor="middle">corriente</text><text x="149.0" y="128.0" font-size="7.2" fill="#333" text-anchor="middle">sirven para separar</text><rect x="200.0" y="22.0" width="90.0" height="172.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/><rect x="200.0" y="22.0" width="90.0" height="5.0" rx="3" fill="#3b82f6" stroke="#3b82f6" stroke-width="0"/><text x="245.0" y="40.0" font-size="7.6" fill="#3b82f6" text-anchor="middle" font-weight="bold">SEMICONDUCTORES</text><text x="245.0" y="56.0" font-size="7.2" fill="#333" text-anchor="middle">comportamiento</text><text x="245.0" y="68.0" font-size="7.2" fill="#333" text-anchor="middle">intermedio</text><text x="245.0" y="80.0" font-size="7.2" fill="#333" text-anchor="middle">silicio, germanio</text><text x="245.0" y="92.0" font-size="7.2" fill="#333" text-anchor="middle">se modifican con</text><text x="245.0" y="104.0" font-size="7.2" fill="#333" text-anchor="middle">dopaje o voltaje</text><text x="245.0" y="116.0" font-size="7.2" fill="#333" text-anchor="middle">base de la</text><text x="245.0" y="128.0" font-size="7.2" fill="#333" text-anchor="middle">electrónica moderna</text><text x="150.0" y="208.0" font-size="8" fill="#999" text-anchor="middle">El dieléctrico de un condensador es un aislante.</text></svg>