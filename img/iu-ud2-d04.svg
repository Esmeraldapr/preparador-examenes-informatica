<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">De la tarea a la acci&#243;n at&#243;mica</text><rect x="24.0" y="24.0" width="252.0" height="24.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="34.0" y="39.0" font-size="8" fill="#3b82f6" text-anchor="start" font-weight="bold">TAREA</text><text x="266.0" y="39.0" font-size="7.5" fill="#333" text-anchor="end">escribir una carta</text><rect x="24.0" y="52.0" width="252.0" height="24.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.1"/><text x="34.0" y="67.0" font-size="8" fill="#7c3aed" text-anchor="start" font-weight="bold">ACCIONES DE ALTO NIVEL</text><text x="266.0" y="67.0" font-size="7.5" fill="#333" text-anchor="end">dar formato a un p&#225;rrafo</text><rect x="24.0" y="80.0" width="252.0" height="24.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.1"/><text x="34.0" y="95.0" font-size="8" fill="#7c3aed" text-anchor="start" font-weight="bold">ACCIONES DE NIVEL MEDIO</text><text x="266.0" y="95.0" font-size="7.5" fill="#333" text-anchor="end">poner una palabra en negrita</text><rect x="24.0" y="108.0" width="252.0" height="24.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.1"/><text x="34.0" y="123.0" font-size="8" fill="#16a34a" text-anchor="start" font-weight="bold">ACCIONES AT&#211;MICAS</text><text x="266.0" y="123.0" font-size="7.5" fill="#333" text-anchor="end">pulsar Ctrl + N</text><text x="150.0" y="144.0" font-size="8" fill="#ef4444" text-anchor="middle">Si las at&#243;micas son muy peque&#241;as, el usuario se frustra.</text><text x="150.0" y="155.0" font-size="8" fill="#ef4444" text-anchor="middle">Si son demasiado grandes, no consigue lo que quiere.</text></svg>