<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Por qu&#233; funcionan los men&#250;s</text><rect x="12.0" y="24.0" width="132.0" height="72.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.3"/><text x="78.0" y="40.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">MEN&#218;</text><text x="78.0" y="56.0" font-size="8" fill="#333" text-anchor="middle">te ense&#241;a las opciones</text><text x="78.0" y="68.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">y t&#250; RECONOCES</text><text x="78.0" y="84.0" font-size="7.5" fill="#999" text-anchor="middle">f&#225;cil para el novato</text><rect x="156.0" y="24.0" width="132.0" height="72.0" rx="3" fill="#fff6f6" stroke="#ef4444" stroke-width="1.3"/><text x="222.0" y="40.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">COMANDO</text><text x="222.0" y="56.0" font-size="8" fill="#333" text-anchor="middle">la pantalla est&#225; vac&#237;a</text><text x="222.0" y="68.0" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="bold">y t&#250; RECUERDAS</text><text x="222.0" y="84.0" font-size="7.5" fill="#999" text-anchor="middle">r&#225;pido para el experto</text><text x="150.0" y="116.0" font-size="9" fill="#333" text-anchor="middle">Reconocer cuesta mucho menos que recordar.</text><text x="150.0" y="130.0" font-size="8.5" fill="#333" text-anchor="middle">Esa es toda la ventaja del men&#250;, y tambi&#233;n</text><text x="150.0" y="142.0" font-size="8.5" fill="#333" text-anchor="middle">la raz&#243;n de que sea m&#225;s lento para el experto.</text></svg>