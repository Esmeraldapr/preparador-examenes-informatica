<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 214" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">En +∞ manda el que crece más</text><rect x="18.0" y="114.0" width="38.0" height="14.0" rx="2" fill="#fff" stroke="#999" stroke-width="1.4"/><text x="37.0" y="125.0" font-size="10" fill="#999" text-anchor="middle" font-weight="bold">ln x</text><rect x="64.0" y="100.0" width="38.0" height="28.0" rx="2" fill="#fff" stroke="#3b82f6" stroke-width="1.4"/><text x="83.0" y="118.0" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">√x</text><rect x="110.0" y="84.0" width="38.0" height="44.0" rx="2" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="129.0" y="110.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">x</text><rect x="156.0" y="66.0" width="38.0" height="62.0" rx="2" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/><text x="175.0" y="101.0" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="bold">x²</text><rect x="202.0" y="46.0" width="38.0" height="82.0" rx="2" fill="#fff" stroke="#ef4444" stroke-width="1.4"/><text x="221.0" y="91.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">x³</text><rect x="248.0" y="22.0" width="38.0" height="106.0" rx="2" fill="#fff" stroke="#ef4444" stroke-width="1.4"/><text x="267.0" y="79.0" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">eˣ</text><text x="150.0" y="28.0" font-size="8" fill="#999" text-anchor="middle">de menos a más</text><line x1="16.0" y1="130.0" x2="288.0" y2="130.0" stroke="#999" stroke-width="1"/><text x="150.0" y="146.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">ln x ≪ √x ≪ x ≪ x² ≪ x³ ≪ eˣ</text><text x="150.0" y="162.0" font-size="8.4" fill="#16a34a" text-anchor="middle" font-weight="bold">Polinomio: manda el MAYOR EXPONENTE (con su signo)</text><text x="150.0" y="176.0" font-size="8.4" fill="#3b82f6" text-anchor="middle" font-weight="bold">Resta ∞ − ∞: gana el que crece más (√x pierde con x)</text><text x="150.0" y="190.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Número ÷ ∞ = 0   ·   ∞ ÷ número = ∞</text><text x="150.0" y="205.0" font-size="8" fill="#999" text-anchor="middle">Solo hay indeterminación: ∞/∞, ∞ − ∞, 0/0, 0·∞</text></svg>