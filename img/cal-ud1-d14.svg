<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 154" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_9235" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_9235" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a3_9235" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a4_9235" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Componer: la salida de una entra en la otra</text><circle cx="26.0" cy="56.0" r="3.4" fill="#333" stroke="#333" stroke-width="1.6"/><text x="26.0" y="74.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">x</text><line x1="34.0" y1="56.0" x2="72.0" y2="56.0" stroke="#999" stroke-width="1.4" marker-end="url(#a1_9235)"/><rect x="74.0" y="42.0" width="44.0" height="28.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="96.0" y="61.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">g</text><text x="96.0" y="34.0" font-size="7.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">primero</text><line x1="120.0" y1="56.0" x2="150.0" y2="56.0" stroke="#999" stroke-width="1.4" marker-end="url(#a2_9235)"/><text x="166.0" y="60.0" font-size="9.5" fill="#333" text-anchor="middle">g(x)</text><line x1="184.0" y1="56.0" x2="206.0" y2="56.0" stroke="#999" stroke-width="1.4" marker-end="url(#a3_9235)"/><rect x="208.0" y="42.0" width="44.0" height="28.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="230.0" y="61.0" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">f</text><text x="230.0" y="34.0" font-size="7.6" fill="#3b82f6" text-anchor="middle" font-weight="bold">despu&#233;s</text><line x1="254.0" y1="56.0" x2="274.0" y2="56.0" stroke="#999" stroke-width="1.4" marker-end="url(#a4_9235)"/><text x="268.0" y="76.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">f(g(x))</text><rect x="12.0" y="84.0" width="276.0" height="22.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.2"/><text x="150.0" y="99.0" font-size="9" fill="#333" text-anchor="middle" font-weight="bold">(f &#8728; g)(x) = f(g(x)) &#160;&#160;se lee de DERECHA a IZQUIERDA</text><rect x="12.0" y="112.0" width="276.0" height="34.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="126.0" font-size="7.8" fill="#ef4444" text-anchor="middle">El dominio de la compuesta se ENCOGE: solo valen las x del</text><text x="150.0" y="138.0" font-size="7.8" fill="#ef4444" text-anchor="middle">dominio de g cuyo g(x) est&#225; en el dominio de f.</text></svg>