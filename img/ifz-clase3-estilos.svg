<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 560' width='900' height='560'><rect width='900' height='560' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight="bold" fill='#1e1b4b' text-anchor='start'>Los 5 estilos de interacción de un vistazo</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Una idea buena y una mala de cada uno (del resumen final del profe).</text><text x='240' y='88' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight="bold" fill='#16a34a' text-anchor='start'>✅ Lo mejor</text><text x='590' y='88' font-family='Arial, Helvetica, sans-serif' font-size='15' font-weight="bold" fill='#ef4444' text-anchor='start'>❌ Lo peor</text><rect x='20' y='100' width='860' height='80' rx='12' fill='#7c3aed' fill-opacity='.08' stroke='#7c3aed' stroke-width='2'/><text x='34' y='146' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight="bold" fill='#7c3aed' text-anchor='start'>Manipulación directa</text><text x='240' y='133' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Ves los objetos y los mueves.</text><text x='240' y='158' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Fácil de aprender y recordar.</text><text x='590' y='133' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Difícil de programar;</text><text x='590' y='158' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>pide pantalla gráfica y ratón.</text><rect x='20' y='190' width='860' height='80' rx='12' fill='#3b82f6' fill-opacity='.08' stroke='#3b82f6' stroke-width='2'/><text x='34' y='236' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight="bold" fill='#3b82f6' text-anchor='start'>Menús de selección</text><text x='240' y='223' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Acortan el aprendizaje;</text><text x='240' y='248' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>estructuran las decisiones.</text><text x='590' y='223' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Pueden ser lentos para</text><text x='590' y='248' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>el usuario frecuente.</text><rect x='20' y='280' width='860' height='80' rx='12' fill='#16a34a' fill-opacity='.08' stroke='#16a34a' stroke-width='2'/><text x='34' y='326' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight="bold" fill='#16a34a' text-anchor='start'>Formularios</text><text x='240' y='313' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Simplifican meter datos;</text><text x='240' y='338' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>casi no hay que aprender.</text><text x='590' y='313' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Consumen espacio</text><text x='590' y='338' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>en la pantalla.</text><rect x='20' y='370' width='860' height='80' rx='12' fill='#ef4444' fill-opacity='.08' stroke='#ef4444' stroke-width='2'/><text x='34' y='416' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight="bold" fill='#ef4444' text-anchor='start'>Lenguaje de comandos</text><text x='240' y='403' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Flexible y rápido;</text><text x='240' y='428' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>permite macros (expertos).</text><text x='590' y='403' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Hay que memorizar;</text><text x='590' y='428' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>errores mal gestionados.</text><rect x='20' y='460' width='860' height='80' rx='12' fill='#999' fill-opacity='.08' stroke='#999' stroke-width='2'/><text x='34' y='506' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight="bold" fill='#555' text-anchor='start'>Lenguaje natural</text><text x='240' y='493' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>No hay que aprender</text><text x='240' y='518' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>ninguna sintaxis.</text><text x='590' y='493' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Ambiguo e impredecible;</text><text x='590' y='518' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>pide aclaraciones.</text></svg>