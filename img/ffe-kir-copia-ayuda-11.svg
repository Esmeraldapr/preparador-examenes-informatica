<svg viewBox='0 0 300 185' xmlns='http://www.w3.org/2000/svg' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Arial,sans-serif}</style><rect width='300' height='185' fill='white'/><text x='150' y='18'  font-size='12' font-weight='bold' fill='#7c3aed' text-anchor='middle'>Malla 1 (izquierda), vuelta ↻ como I1</text><text x='10' y='40'  font-size='11' font-weight='bold' fill='#111' text-anchor='start'>R1</text><text x='62' y='40'  font-size='10' fill='#555' text-anchor='start'>vamos como I1</text><text x='292' y='40'  font-size='11' font-weight='bold' fill='#16a34a' text-anchor='end'>+I1·R1</text><text x='10' y='59'  font-size='11' font-weight='bold' fill='#111' text-anchor='start'>V2</text><text x='62' y='59'  font-size='10' fill='#555' text-anchor='start'>bajamos: entra por −, sale por +</text><text x='292' y='59'  font-size='11' font-weight='bold' fill='#16a34a' text-anchor='end'>+V2</text><text x='10' y='78'  font-size='11' font-weight='bold' fill='#111' text-anchor='start'>R4</text><text x='62' y='78'  font-size='10' fill='#555' text-anchor='start'>bajamos como I2</text><text x='292' y='78'  font-size='11' font-weight='bold' fill='#16a34a' text-anchor='end'>+I2·R4</text><text x='10' y='97'  font-size='11' font-weight='bold' fill='#111' text-anchor='start'>R3</text><text x='62' y='97'  font-size='10' fill='#555' text-anchor='start'>vamos como I1</text><text x='292' y='97'  font-size='11' font-weight='bold' fill='#16a34a' text-anchor='end'>+I1·R3</text><text x='10' y='116'  font-size='11' font-weight='bold' fill='#111' text-anchor='start'>V1</text><text x='62' y='116'  font-size='10' fill='#555' text-anchor='start'>subimos: entra por +, sale por −</text><text x='292' y='116'  font-size='11' font-weight='bold' fill='#ef4444' text-anchor='end'>−V1</text><line x1='10' y1='129' x2='290' y2='129' stroke='#ddd' stroke-width='1'/><text x='150' y='149'  font-size='11' font-weight='bold' fill='#16a34a' text-anchor='middle'>−V1 + V2 = I1·R1 + I1·R3 + I2·R4</text><text x='150' y='165'  font-size='9' fill='#555' text-anchor='middle'>pilas a la izquierda del = · resistencias a la derecha</text></svg>