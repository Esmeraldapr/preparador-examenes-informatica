<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 222" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">UD1 Campo eléctrico: las 5 piezas</text><rect x="10.0" y="24.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><rect x="14.0" y="28.0" width="24.0" height="26.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1"/><text x="26.0" y="46.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">1</text><text x="46.0" y="39.0" font-size="9.4" fill="#7c3aed" text-anchor="start" font-weight="bold">Carga eléctrica</text><text x="46.0" y="52.0" font-size="7.8" fill="#333" text-anchor="start">propiedad de la materia: dual, se conserva y está cuantizada</text><rect x="10.0" y="61.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><rect x="14.0" y="65.0" width="24.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/><text x="26.0" y="83.0" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="bold">2</text><text x="46.0" y="76.0" font-size="9.4" fill="#3b82f6" text-anchor="start" font-weight="bold">Campo y potencial</text><text x="46.0" y="89.0" font-size="7.8" fill="#333" text-anchor="start">cómo se describe el espacio alrededor de las cargas</text><rect x="10.0" y="98.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><rect x="14.0" y="102.0" width="24.0" height="26.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="26.0" y="120.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">3</text><text x="46.0" y="113.0" font-size="9.4" fill="#16a34a" text-anchor="start" font-weight="bold">Ley de Gauss</text><text x="46.0" y="126.0" font-size="7.8" fill="#333" text-anchor="start">relación entre el flujo y la carga encerrada</text><rect x="10.0" y="135.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><rect x="14.0" y="139.0" width="24.0" height="26.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1"/><text x="26.0" y="157.0" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="bold">4</text><text x="46.0" y="150.0" font-size="9.4" fill="#ef4444" text-anchor="start" font-weight="bold">Conductores y dieléctricos</text><text x="46.0" y="163.0" font-size="7.8" fill="#333" text-anchor="start">cómo responde cada material al campo</text><rect x="10.0" y="172.0" width="280.0" height="34.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><rect x="14.0" y="176.0" width="24.0" height="26.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1"/><text x="26.0" y="194.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">5</text><text x="46.0" y="187.0" font-size="9.4" fill="#7c3aed" text-anchor="start" font-weight="bold">Condensadores</text><text x="46.0" y="200.0" font-size="7.8" fill="#333" text-anchor="start">almacenan carga; se asocian en serie o en paralelo</text><text x="150.0" y="216.0" font-size="8" fill="#999" text-anchor="middle">Todo sale de una sola idea: las cargas se notan a distancia.</text></svg>