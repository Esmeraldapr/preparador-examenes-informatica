<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Qu&#233; es la capacidad</text><line x1="60" y1="34" x2="60" y2="84" stroke="#7c3aed" stroke-width="3.5"/><line x1="96" y1="34" x2="96" y2="84" stroke="#3b82f6" stroke-width="3.5"/><text x="60.0" y="28.0" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">+Q</text><text x="96.0" y="28.0" font-size="9" fill="#3b82f6" text-anchor="middle" font-weight="bold">&#8722;Q</text><line x1="60" y1="94" x2="96" y2="94" stroke="#999" stroke-width="1"/><text x="78.0" y="106.0" font-size="9" fill="#999" text-anchor="middle">d</text><text x="78.0" y="124.0" font-size="8" fill="#333" text-anchor="middle">dos placas separadas</text><text x="78.0" y="135.0" font-size="8" fill="#333" text-anchor="middle">por un diel&#233;ctrico</text><rect x="142.0" y="32.0" width="146.0" height="32.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="215.0" y="52.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">C = Q / V</text><text x="215.0" y="78.0" font-size="8.5" fill="#333" text-anchor="middle" font-weight="bold">Se mide en FARADIOS (F)</text><text x="215.0" y="92.0" font-size="8" fill="#999" text-anchor="middle">1 F = 1 culombio / 1 voltio</text><rect x="142.0" y="102.0" width="146.0" height="30.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="215.0" y="116.0" font-size="8.5" fill="#16a34a" text-anchor="middle" font-weight="bold">Condensador plano:</text><text x="215.0" y="127.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">C = &#949;&#8320; &#183; S / d</text><text x="150.0" y="152.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">La capacidad solo depende de la GEOMETR&#205;A y del material.</text></svg>