<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 580' width='900' height='580'><defs></defs><rect width='900' height='580' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='bold' fill='#1e1b4b' text-anchor='start'>Los 4 modelos de ciclo de vida que explicó el profe</text><text x='20' y='58' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#555' text-anchor='start'>Un ciclo de vida dice qué actividades hay, cómo se unen y cuándo se pasa de una a otra.</text><rect x='20' y='80' width='420' height='230' rx='14' fill='#7c3aed' fill-opacity='.10' stroke='#7c3aed' stroke-width='2.5'/><text x='36' y='112' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='bold' fill='#7c3aed' text-anchor='start'>1. Modelo simple</text><text x='36' y='142' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Empieza siempre igual:</text><text x='36' y='165' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>necesidades y requisitos.</text><text x='36' y='188' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Luego: diseñar, construir una</text><text x='36' y='211' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>versión interactiva y evaluar.</text><text x='36' y='234' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Se vuelve atrás las veces</text><text x='36' y='257' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>que haga falta (iterar).</text><text x='36' y='280' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>No dice qué entregables hay.</text><rect x='460' y='80' width='420' height='230' rx='14' fill='#3b82f6' fill-opacity='.10' stroke='#3b82f6' stroke-width='2.5'/><text x='476' y='112' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='bold' fill='#3b82f6' text-anchor='start'>2. Modelo en estrella</text><text x='476' y='142' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>NO tiene un orden fijo.</text><text x='476' y='165' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>En el centro está la</text><text x='476' y='188' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>EVALUACIÓN.</text><text x='476' y='211' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Se puede saltar de una</text><text x='476' y='234' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>actividad a otra, pero</text><text x='476' y='257' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>siempre pasando antes</text><text x='476' y='280' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>por la evaluación.</text><rect x='20' y='330' width='420' height='230' rx='14' fill='#16a34a' fill-opacity='.10' stroke='#16a34a' stroke-width='2.5'/><text x='36' y='362' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='bold' fill='#16a34a' text-anchor='start'>3. Ingeniería de usabilidad</text><text x='36' y='392' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Más completo. Tiene 3 fases:</text><text x='36' y='415' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>1) Análisis de requisitos</text><text x='36' y='438' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>2) Diseño, pruebas y desarrollo</text><text x='36' y='461' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>   (la más larga)</text><text x='36' y='484' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>3) Instalación</text><text x='36' y='507' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Bueno para equipos con poca</text><text x='36' y='530' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>experiencia en usabilidad.</text><rect x='460' y='330' width='420' height='230' rx='14' fill='#ef4444' fill-opacity='.10' stroke='#ef4444' stroke-width='2.5'/><text x='476' y='362' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='bold' fill='#ef4444' text-anchor='start'>4. Norma ISO 13407</text><text x='476' y='392' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Estándar internacional de</text><text x='476' y='415' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>diseño centrado en el usuario.</text><text x='476' y='438' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Vale para software y hardware.</text><text x='476' y='461' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>Complementa a la ISO 9241.</text><text x='476' y='484' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>4 principios y 4 actividades</text><text x='476' y='507' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'>(míralo en el apartado 3.4).</text><text x='476' y='530' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#1e1b4b' text-anchor='start'></text></svg>