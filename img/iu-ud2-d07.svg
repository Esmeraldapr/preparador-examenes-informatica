<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="8.5" fill="#333" text-anchor="middle" font-weight="bold">Por qu&#233; el humano no sobra aunque haya automatizaci&#243;n</text><rect x="14.0" y="24.0" width="130.0" height="72.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="79.0" y="38.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="bold">SISTEMA ABIERTO</text><text x="79.0" y="51.0" font-size="8" fill="#333" text-anchor="middle">el mundo real</text><text x="79.0" y="61.0" font-size="8" fill="#333" text-anchor="middle">infinitos sucesos</text><text x="79.0" y="71.0" font-size="8" fill="#333" text-anchor="middle">imprevisibles</text><text x="79.0" y="81.0" font-size="8" fill="#333" text-anchor="middle">&#8594; juicio humano</text><rect x="156.0" y="24.0" width="130.0" height="72.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="221.0" y="38.0" font-size="9.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">SISTEMA CERRADO</text><text x="221.0" y="51.0" font-size="8" fill="#333" text-anchor="middle">el ordenador</text><text x="221.0" y="61.0" font-size="8" fill="#333" text-anchor="middle">casos finitos</text><text x="221.0" y="71.0" font-size="8" fill="#333" text-anchor="middle">previstos de antemano</text><text x="221.0" y="81.0" font-size="8" fill="#333" text-anchor="middle">&#8594; autom&#225;tico</text><text x="150.0" y="114.0" font-size="8.5" fill="#333" text-anchor="middle">Por eso se automatiza lo rutinario, pero se mantiene</text><text x="150.0" y="126.0" font-size="8.5" fill="#333" text-anchor="middle">al humano como SUPERVISOR de lo que no estaba previsto.</text><text x="150.0" y="142.0" font-size="8.5" fill="#ef4444" text-anchor="middle" font-weight="bold">Y el dise&#241;o debe seguir siendo predecible y controlable.</text></svg>