<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 166" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Las cuatro estructuras de men&#250;</text><rect x="16.0" y="24.0" width="268.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="26.0" y="36.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">1. Men&#250; &#250;nico</text><text x="26.0" y="46.0" font-size="7.5" fill="#333" text-anchor="start">una sola pantalla de opciones</text><rect x="16.0" y="54.0" width="268.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="26.0" y="66.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">2. Secuencia lineal</text><text x="26.0" y="76.0" font-size="7.5" fill="#333" text-anchor="start">pasos encadenados: un instalador</text><rect x="16.0" y="84.0" width="268.0" height="26.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.1"/><text x="26.0" y="96.0" font-size="8.5" fill="#16a34a" text-anchor="start" font-weight="bold">3. &#193;rbol</text><text x="26.0" y="106.0" font-size="7.5" fill="#333" text-anchor="start">el m&#225;s importante y el m&#225;s usado</text><rect x="16.0" y="114.0" width="268.0" height="26.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.1"/><text x="26.0" y="126.0" font-size="8.5" fill="#3b82f6" text-anchor="start" font-weight="bold">4. Red (c&#237;clica o ac&#237;clica)</text><text x="26.0" y="136.0" font-size="7.5" fill="#333" text-anchor="start">varios caminos: la web es esto</text><text x="150.0" y="160.0" font-size="8" fill="#999" text-anchor="middle">El &#225;rbol es el m&#225;s importante de los cuatro.</text></svg>