<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img"><rect width="300" height="150" fill="#fff"/><text x="150" y="14" text-anchor="middle" font-size="10" fill="#666" font-family="Arial, sans-serif">De dentro hacia fuera, hasta llegar a la fuente</text><rect x="20" y="24" width="260" height="19" rx="6" fill="#faf9ff" stroke="#7c3aed" stroke-width="1.4"/><circle cx="32" cy="33.5" r="7" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="32" y="37.5" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">1</text><text x="46" y="37" text-anchor="start" font-size="10" fill="#333" font-family="Arial, sans-serif">R3 ∥ R4 = 40 ∥ 40</text><text x="272" y="37" text-anchor="end" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">= 20 Ω</text><rect x="20" y="47" width="260" height="19" rx="6" fill="#faf9ff" stroke="#7c3aed" stroke-width="1.4"/><circle cx="32" cy="56.5" r="7" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="32" y="60.5" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">2</text><text x="46" y="60" text-anchor="start" font-size="10" fill="#333" font-family="Arial, sans-serif">+ R5 (serie): 20 + 10</text><text x="272" y="60" text-anchor="end" font-size="10" fill="#7c3aed" font-weight="700" font-family="Arial, sans-serif">= 30 Ω</text><rect x="20" y="70" width="260" height="19" rx="6" fill="#faf9ff" stroke="#3b82f6" stroke-width="1.4"/><circle cx="32" cy="79.5" r="7" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><text x="32" y="83.5" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">3</text><text x="46" y="83" text-anchor="start" font-size="10" fill="#333" font-family="Arial, sans-serif">∥ R2: 30 ∥ 60</text><text x="272" y="83" text-anchor="end" font-size="10" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">= 20 Ω</text><rect x="20" y="93" width="260" height="19" rx="6" fill="#faf9ff" stroke="#3b82f6" stroke-width="1.4"/><circle cx="32" cy="102.5" r="7" fill="#fff" stroke="#3b82f6" stroke-width="1.6"/><text x="32" y="106.5" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">4</text><text x="46" y="106" text-anchor="start" font-size="10" fill="#333" font-family="Arial, sans-serif">+ R1 (serie): 20 + 8</text><text x="272" y="106" text-anchor="end" font-size="10" fill="#3b82f6" font-weight="700" font-family="Arial, sans-serif">= 28 Ω</text><rect x="20" y="120" width="260" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="150" y="136" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700" font-family="Arial, sans-serif">V = I × Req = 2,5 × 28 = 70 V</text></svg>