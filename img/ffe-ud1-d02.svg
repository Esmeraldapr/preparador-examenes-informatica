<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 168" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_1127" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a2_1127" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a3_1127" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker><marker id="a4_1127" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#999"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Ley de Coulomb: qu&#233; manda m&#225;s</text><rect x="40.0" y="22.0" width="220.0" height="26.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="40.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">F = K &#183; q&#8321; &#183; q&#8322; / r&#178;</text><rect x="14.0" y="56.0" width="140.0" height="21.0" rx="3" fill="#fafafa" stroke="#999" stroke-width="0.9"/><text x="22.0" y="70.0" font-size="8" fill="#333" text-anchor="start">Doblas una carga</text><line x1="158.0" y1="66.0" x2="172.0" y2="66.0" stroke="#999" stroke-width="1" marker-end="url(#a1_1127)"/><text x="178.0" y="70.0" font-size="8.5" fill="#16a34a" text-anchor="start" font-weight="bold">F se DOBLA</text><rect x="14.0" y="80.0" width="140.0" height="21.0" rx="3" fill="#fafafa" stroke="#999" stroke-width="0.9"/><text x="22.0" y="94.0" font-size="8" fill="#333" text-anchor="start">Doblas las dos cargas</text><line x1="158.0" y1="90.0" x2="172.0" y2="90.0" stroke="#999" stroke-width="1" marker-end="url(#a2_1127)"/><text x="178.0" y="94.0" font-size="8.5" fill="#16a34a" text-anchor="start" font-weight="bold">F se hace 4 veces mayor</text><rect x="14.0" y="104.0" width="140.0" height="21.0" rx="3" fill="#fafafa" stroke="#999" stroke-width="0.9"/><text x="22.0" y="118.0" font-size="8" fill="#333" text-anchor="start">Doblas la distancia</text><line x1="158.0" y1="114.0" x2="172.0" y2="114.0" stroke="#999" stroke-width="1" marker-end="url(#a3_1127)"/><text x="178.0" y="118.0" font-size="8.5" fill="#ef4444" text-anchor="start" font-weight="bold">F se divide entre 4</text><rect x="14.0" y="128.0" width="140.0" height="21.0" rx="3" fill="#fafafa" stroke="#999" stroke-width="0.9"/><text x="22.0" y="142.0" font-size="8" fill="#333" text-anchor="start">Triplicas la distancia</text><line x1="158.0" y1="138.0" x2="172.0" y2="138.0" stroke="#999" stroke-width="1" marker-end="url(#a4_1127)"/><text x="178.0" y="142.0" font-size="8.5" fill="#ef4444" text-anchor="start" font-weight="bold">F se divide entre 9</text><text x="150.0" y="164.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">La distancia va al CUADRADO: pesa mucho m&#225;s que la carga.</text></svg>