<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">f(x) = x/(x⁴ + 3): ¿par o impar?</text><text x="150.0" y="27.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">Sustituye −x y compara con f(x):</text><rect x="10.0" y="34.0" width="280.0" height="40.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="50.0" font-size="9.6" fill="#7c3aed" text-anchor="middle" font-weight="bold">f(−x) = (−x)/((−x)⁴ + 3) = −x/(x⁴ + 3)</text><text x="150.0" y="66.0" font-size="7.6" fill="#333" text-anchor="middle">(−x)⁴ = x⁴ porque el exponente es PAR; arriba cambia de signo</text><rect x="10.0" y="80.0" width="280.0" height="22.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="95.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="bold">f(−x) = −f(x)   →   IMPAR</text><line x1="60.0" y1="143.0" x2="240.0" y2="143.0" stroke="#999" stroke-width="1.1"/><line x1="150.0" y1="110.0" x2="150.0" y2="176.0" stroke="#999" stroke-width="1.1"/><line x1="75.0" y1="141.0" x2="75.0" y2="145.0" stroke="#999" stroke-width="1"/><text x="75.0" y="154.0" font-size="8.5" fill="#999" text-anchor="middle">−2</text><line x1="225.0" y1="141.0" x2="225.0" y2="145.0" stroke="#999" stroke-width="1"/><text x="225.0" y="154.0" font-size="8.5" fill="#999" text-anchor="middle">2</text><path d="M60.0,148.2 L61.1,148.4 L62.2,148.6 L63.4,148.8 L64.5,149.0 L65.6,149.2 L66.8,149.4 L67.9,149.6 L69.0,149.9 L70.1,150.1 L71.2,150.4 L72.4,150.6 L73.5,150.9 L74.6,151.2 L75.8,151.5 L76.9,151.8 L78.0,152.1 L79.1,152.4 L80.2,152.8 L81.4,153.1 L82.5,153.5 L83.6,153.9 L84.8,154.2 L85.9,154.6 L87.0,155.0 L88.1,155.5 L89.2,155.9 L90.4,156.3 L91.5,156.7 L92.6,157.2 L93.8,157.6 L94.9,158.1 L96.0,158.5 L97.1,158.9 L98.2,159.4 L99.4,159.8 L100.5,160.2 L101.6,160.6 L102.8,160.9