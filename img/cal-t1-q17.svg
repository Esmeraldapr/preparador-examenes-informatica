<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">−5/2 = −2,5: ¿dónde encaja?</text><rect x="10.0" y="26.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="43.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">¿Natural (1, 2, 3…)?</text><text x="282.0" y="43.0" font-size="8.4" fill="#ef4444" text-anchor="end" font-weight="bold">NO: es negativo</text><rect x="10.0" y="56.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="73.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">¿Entero (…−2, −1, 0, 1…)?</text><text x="282.0" y="73.0" font-size="8.4" fill="#ef4444" text-anchor="end" font-weight="bold">NO: tiene decimales</text><rect x="10.0" y="86.0" width="280.0" height="26.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1.2"/><text x="20.0" y="103.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">¿Irracional (√2, π)?</text><text x="282.0" y="103.0" font-size="8.4" fill="#ef4444" text-anchor="end" font-weight="bold">NO: es una fracción exacta</text><rect x="10.0" y="116.0" width="280.0" height="26.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.2"/><text x="20.0" y="133.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">Es RACIONAL (ℚ)</text><text x="282.0" y="133.0" font-size="8.4" fill="#16a34a" text-anchor="end" font-weight="bold">… pero esa opción no está</text><rect x="50.0" y="150.0" width="200.0" height="24.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="166.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">Ninguna de las otras opciones</text><text x="150.0" y="182.0" font-size="8" fill="#999" text-anchor="middle">Un decimal exacto o periódico SIEMPRE es racional.</text></svg>