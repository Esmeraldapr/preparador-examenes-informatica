<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 178" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">ISO 9241 y las cinco medidas pr&#225;cticas</text><rect x="12.0" y="22.0" width="130.0" height="76.0" rx="3" fill="#f6f8ff" stroke="#3b82f6" stroke-width="1.3"/><text x="77.0" y="38.0" font-size="9" fill="#3b82f6" text-anchor="middle" font-weight="bold">NORMA ISO 9241</text><text x="77.0" y="50.0" font-size="6.8" fill="#999" text-anchor="middle">ergonom&#237;a hombre-sistema</text><text x="77.0" y="64.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Efectividad</text><text x="77.0" y="76.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Eficiencia</text><text x="77.0" y="88.0" font-size="8.4" fill="#333" text-anchor="middle" font-weight="bold">Satisfacci&#243;n</text><rect x="158.0" y="22.0" width="130.0" height="76.0" rx="3" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.3"/><text x="223.0" y="38.0" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">OTROS AUTORES</text><text x="223.0" y="50.0" font-size="6.8" fill="#999" text-anchor="middle">5 medidas pr&#225;cticas</text><text x="223.0" y="62.0" font-size="7.4" fill="#333" text-anchor="middle">Tiempo de aprendizaje</text><text x="223.0" y="73.0" font-size="7.4" fill="#333" text-anchor="middle">Velocidad de actuaci&#243;n</text><text x="223.0" y="84.0" font-size="7.4" fill="#333" text-anchor="middle">Tasa de errores</text><text x="223.0" y="95.0" font-size="7.4" fill="#333" text-anchor="middle">Retenci&#243;n &#183; Satisfacci&#243;n subjetiva</text><text x="150.0" y="112.0" font-size="7.8" fill="#333" text-anchor="middle">Las cinco medidas miran m&#225;s a la EFICIENCIA y la SATISFACCI&#211;N</text><text x="150.0" y="123.0" font-size="7.8" fill="#333" text-anchor="middle">que a la efectividad que persigue la ISO.</text><rect x="12.0" y="130.0" width="276.0" height="40.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="150.0" y="144.0" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">En el examen preguntan por el NOMBRE de la medida:</text><text x="150.0" y="156.0" font-size="7.6" fill="#333" text-anchor="middle">&#171;cu&#225;nto tarda un usuario en aprender&#187; &#8594; tiempo de aprendizaje.</text><text x="150.0" y="166.0" font-size="7.6" fill="#333" text-anchor="middle">&#171;cu&#225;ntos errores comete&#187; &#8594; tasa de errores por usuario.</text></svg>