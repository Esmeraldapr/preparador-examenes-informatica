<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a1_2867" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#16a34a"/></marker></defs><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Aprendizaje en varias capas</text><rect x="60.0" y="24.0" width="180.0" height="28.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="150.0" y="42.0" font-size="8.5" fill="#16a34a" text-anchor="middle" font-weight="bold">Capa 1: lo m&#237;nimo para empezar</text><rect x="45.0" y="58.0" width="210.0" height="28.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="76.0" font-size="8.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">Capa 2: m&#225;s objetos y acciones</text><rect x="30.0" y="92.0" width="240.0" height="28.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="150.0" y="110.0" font-size="8.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">Capa 3: todo el programa</text><line x1="150.0" y1="126.0" x2="150.0" y2="112.0" stroke="#16a34a" stroke-width="1.3" marker-end="url(#a1_2867)"/><text x="150.0" y="138.0" font-size="8.5" fill="#333" text-anchor="middle">El usuario decide cu&#225;ndo sube de capa.</text><text x="150.0" y="148.0" font-size="8" fill="#999" text-anchor="middle">Tambi&#233;n se aplica a manuales, ayuda y mensajes.</text></svg>