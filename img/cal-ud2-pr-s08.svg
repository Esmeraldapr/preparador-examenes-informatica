<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 118" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Uno elevado a infinito: siempre es el n&#250;mero e</text><rect x="14.0" y="24.0" width="272.0" height="30.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="150.0" y="44.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">lim (1 + 1/x)&#739; = e   cuando x &#8594; +&#8734;</text><text x="150.0" y="70.0" font-size="9" fill="#333" text-anchor="middle">Si el exponente es 4x en vez de x, el resultado</text><text x="150.0" y="82.0" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">se eleva a 4:  (1 + 1/x)&#8308;&#739; &#8594; e&#8308;</text><text x="150.0" y="102.0" font-size="8.5" fill="#999" text-anchor="middle">Truco: multiplica lo peque&#241;o del par&#233;ntesis por el</text><text x="150.0" y="113.0" font-size="8.5" fill="#999" text-anchor="middle">exponente: (1/x)&#183;4x = 4. Ese 4 es el exponente de e.</text></svg>