<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400'><rect width='900' height='400' fill='white'/><text x='20' y='34' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='bold' fill='#1e1b4b'>Directrices para organizar la interfaz (lo que dijo el profe)</text><rect x='20' y='56' width='276' height='330' rx='14' fill='#3b82f6' fill-opacity='.08' stroke='#3b82f6' stroke-width='2.5'/><text x='36' y='90' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#3b82f6'>🗂️ Organizar la pantalla</text><text x='36' y='126' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>1. Consistencia: misma palabra</text><text x='36' y='146' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    para lo mismo</text><text x='36' y='180' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>2. Leer rápido: columnas claras,</text><text x='36' y='200' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    números a la derecha</text><text x='36' y='234' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>3. Menos memoria: que no tenga</text><text x='36' y='254' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    que recordar de otra pantalla</text><text x='36' y='288' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>4. Flexibilidad: ordenar, filtrar,</text><text x='36' y='308' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    quitar columnas</text><rect x='312' y='56' width='276' height='330' rx='14' fill='#ef4444' fill-opacity='.08' stroke='#ef4444' stroke-width='2.5'/><text x='328' y='90' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#ef4444'>👀 Atraer la atención</text><text x='328' y='126' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>Solo para lo urgente o importante:</text><text x='328' y='160' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• negrita, subrayado, recuadro</text><text x='328' y='194' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• tamaño de letra distinto</text><text x='328' y='228' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• pocas fuentes distintas</text><text x='328' y='262' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• invertir colores</text><text x='328' y='296' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• parpadeo (muy poco)</text><text x='328' y='330' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>• colores bien elegidos</text><text x='328' y='364' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>Sin abusar, «con cariño»</text><rect x='604' y='56' width='276' height='330' rx='14' fill='#16a34a' fill-opacity='.08' stroke='#16a34a' stroke-width='2.5'/><text x='620' y='90' font-family='Arial, Helvetica, sans-serif' font-size='17' font-weight='bold' fill='#16a34a'>⌨️ Entrada de datos</text><text x='620' y='126' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>1. Consistencia (mismas</text><text x='620' y='146' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    abreviaturas y pasos)</text><text x='620' y='180' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>2. Mínimo de acciones: mejor</text><text x='620' y='200' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    desplegable que escribir</text><text x='620' y='234' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>3. Menos memoria: no pedir</text><text x='620' y='254' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>    lo que ya metió</text><text x='620' y='288' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>4. Entrada y salida compatibles</text><text x='620' y='322' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#1e1b4b' xml:space='preserve'>5. Flexibilidad, pero con cuidado</text></svg>