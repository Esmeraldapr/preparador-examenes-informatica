<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 144" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="14.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="bold">a</text><text x="156.0" y="17.0" font-size="8" fill="#7c3aed" text-anchor="start" font-weight="bold">n</text><text x="163.0" y="14.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="bold">= 1/(n + 1)</text><line x1="42.0" y1="102.0" x2="266.0" y2="102.0" stroke="#999" stroke-width="1"/><line x1="42.0" y1="107.0" x2="42.0" y2="34.0" stroke="#999" stroke-width="1"/><line x1="42.0" y1="41.3" x2="266.0" y2="41.3" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4,3"/><text x="270.0" y="44.3" font-size="8.5" fill="#16a34a" text-anchor="start" font-weight="bold">1/2</text><line x1="42.0" y1="102.0" x2="266.0" y2="102.0" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,3"/><text x="270.0" y="105.0" font-size="9" fill="#ef4444" text-anchor="start" font-weight="bold">0</text><circle cx="48.0" cy="41.3" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="48.0" y="114.0" font-size="7" fill="#999" text-anchor="middle">1</text><circle cx="77.7" cy="61.5" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="77.7" y="114.0" font-size="7" fill="#999" text-anchor="middle">2</text><circle cx="107.4" cy="71.6" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="107.4" y="114.0" font-size="7" fill="#999" text-anchor="middle">3</text><circle cx="137.1" cy="77.7" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="137.1" y="114.0" font-size="7" fill="#999" text-anchor="middle">4</text><circle cx="166.9" cy="81.8" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="166.9" y="114.0" font-size="7" fill="#999" text-anchor="middle">5</text><circle cx="196.6" cy="84.7" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="196.6" y="114.0" font-size="7" fill="#999" text-anchor="middle">6</text><circle cx="226.3" cy="86.8" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="226.3" y="114.0" font-size="7" fill="#999" text-anchor="middle">7</text><circle cx="256.0" cy="88.5" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.6"/><text x="256.0" y="114.0" font-size="7" fill="#999" text-anchor="middle">8</text><text x="56.0" y="30.0" font-size="7.6" fill="#16a34a" text-anchor="start" font-weight="bold">M&#193;XIMO: el primer t&#233;rmino, 1/2</text><text x="150.0" y="58.0" font-size="7.4" fill="#ef4444" text-anchor="start" font-weight="bold">se acerca a 0 pero NO lo toca</text><text x="150.0" y="130.0" font-size="8.4" fill="#ef4444" text-anchor="middle" font-weight="bold">&#205;nfimo = 0, pero no se alcanza: NO hay m&#237;nimo.</text><text x="150.0" y="141.0" font-size="7.8" fill="#333" text-anchor="middle">El m&#225;ximo s&#237; existe porque 1/2 es uno de los t&#233;rminos.</text></svg>