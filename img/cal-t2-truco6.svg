<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Raíz cuadrada: ¿dónde existe? (tabla de signos)</text><text x="150.0" y="28.0" font-size="8.6" fill="#333" text-anchor="middle" font-weight="bold">√(x² − x − 6):  1) iguala a 0   2) mira el signo</text><text x="150.0" y="42.0" font-size="8" fill="#999" text-anchor="middle">x² − x − 6 = (x − 3)(x + 2) → raíces x = −2 y x = 3</text><line x1="20.0" y1="74.0" x2="280.0" y2="74.0" stroke="#333" stroke-width="1.6"/><line x1="105.0" y1="69.0" x2="105.0" y2="79.0" stroke="#333" stroke-width="1.6"/><line x1="195.0" y1="69.0" x2="195.0" y2="79.0" stroke="#333" stroke-width="1.6"/><text x="105.0" y="92.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">−2</text><text x="195.0" y="92.0" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">3</text><rect x="20.0" y="52.0" width="82.0" height="14.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1"/><text x="60.5" y="62.0" font-size="8.6" fill="#16a34a" text-anchor="middle" font-weight="bold">+  existe</text><rect x="108.0" y="52.0" width="84.0" height="14.0" rx="3" fill="#fff5f5" stroke="#ef4444" stroke-width="1"/><text x="150.0" y="62.0" font-size="8.6" fill="#ef4444" text-anchor="middle" font-weight="bold">−  NO existe</text><rect x="198.0" y="52.0" width="82.0" height="14.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1"/><text x="237.5" y="62.0" font-size="8.6" fill="#16a34a" text-anchor="middle" font-weight="bold">+  existe</text><text x="150.0" y="118.0" font-size="8.2" fill="#999" text-anchor="middle">Valor de prueba: x = 0 → 0 − 0 − 6 = −6 (negativo)</text><text x="150.0" y="130.0" font-size="8.2" fill="#999" text-anchor="middle">así sabes el signo del tramo del medio; los de fuera son +</text><rect x="10.0" y="142.0" width="280.0" height="70.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.2"/><text x="150.0" y="157.0" font-size="9.2" fill="#16a34a" text-anchor="middle" font-weight="bold">Dominio = (−∞, −2] ∪ [3, +∞)</text><text x="150.0" y="171.0" font-size="8.2" fill="#333" text-anchor="middle">En x = −2 solo existe el lado izquierdo → no hay límite</text><text x="150.0" y="183.0" font-size="8.2" fill="#333" text-anchor="middle">En x = 3 solo existe el lado derecho → no hay límite</text><text x="150.0" y="199.0" font-size="8.8" fill="#16a34a" text-anchor="middle" font-weight="bold">→ dos discontinuidades no evitables</text></svg>