<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Racional con x → ∞: compara los GRADOS</text><rect x="10.0" y="24.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="18.0" y="38.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">grado arriba < grado abajo</text><text x="282.0" y="38.0" font-size="8.2" fill="#999" text-anchor="end">ej. x/(x² + 1)</text><text x="18.0" y="53.0" font-size="8.6" fill="#16a34a" text-anchor="start" font-weight="bold">→ y = 0  (horizontal)</text><rect x="10.0" y="68.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/><text x="18.0" y="82.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">grados iguales</text><text x="282.0" y="82.0" font-size="8.2" fill="#999" text-anchor="end">ej. 2x²/(x² + 1)</text><text x="18.0" y="97.0" font-size="8.6" fill="#3b82f6" text-anchor="start" font-weight="bold">→ y = 2  (cociente de coeficientes)</text><rect x="10.0" y="112.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="18.0" y="126.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">arriba = abajo + 1</text><text x="282.0" y="126.0" font-size="8.2" fill="#999" text-anchor="end">ej. x²/(x − 1)</text><text x="18.0" y="141.0" font-size="8.6" fill="#7c3aed" text-anchor="start" font-weight="bold">→ oblicua: divide y mira el cociente</text><rect x="10.0" y="156.0" width="280.0" height="38.0" rx="3" fill="#fff" stroke="#ef4444" stroke-width="1.2"/><text x="18.0" y="170.0" font-size="8.6" fill="#333" text-anchor="start" font-weight="bold">arriba ≥ abajo + 2</text><text x="282.0" y="170.0" font-size="8.2" fill="#999" text-anchor="end">ej. x³/(x − 1)</text><text x="18.0" y="185.0" font-size="8.6" fill="#ef4444" text-anchor="start" font-weight="bold">→ ni horizontal ni oblicua (límite ±∞)</text><rect x="10.0" y="202.0" width="280.0" height="28.0" rx="3" fill="#f7f7f9" stroke="#333" stroke-width="1.1"/><text x="150.0" y="214.0" font-size="8" fill="#333" text-anchor="middle">Vertical: iguala el denominador a 0 (si ese factor</text><text x="150.0" y="225.0" font-size="8" fill="#333" text-anchor="middle">no se cancela con el numerador).</text></svg>