<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 172" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="150.0" y="13.0" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">f(x) = (2x² − 3)/(x² + 2x + 1)</text><text x="150.0" y="28.0" font-size="8.8" fill="#333" text-anchor="middle" font-weight="bold">Solo molesta el denominador: iguálalo a 0</text><rect x="10.0" y="36.0" width="280.0" height="30.0" rx="3" fill="#f7f3ff" stroke="#7c3aed" stroke-width="1.3"/><text x="150.0" y="56.0" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">x² + 2x + 1 = (x + 1)² = 0   →   x = −1</text><line x1="24.0" y1="98.0" x2="276.0" y2="98.0" stroke="#999" stroke-width="1.3"/><line x1="24.0" y1="98.0" x2="138.0" y2="98.0" stroke="#7c3aed" stroke-width="5"/><line x1="150.0" y1="98.0" x2="276.0" y2="98.0" stroke="#7c3aed" stroke-width="5"/><circle cx="144.0" cy="98.0" r="5" fill="#fff" stroke="#ef4444" stroke-width="1.6"/><text x="144.0" y="118.0" font-size="9.5" fill="#333" text-anchor="middle" font-weight="bold">−1</text><text x="80.0" y="88.0" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="bold">sí vale</text><text x="212.0" y="88.0" font-size="8" fill="#7c3aed" text-anchor="middle" font-weight="bold">sí vale</text><text x="144.0" y="134.0" font-size="8.2" fill="#ef4444" text-anchor="middle" font-weight="bold">aquí NO (daría 0 abajo)</text><rect x="70.0" y="144.0" width="160.0" height="22.0" rx="3" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.4"/><text x="150.0" y="159.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">Dom = ℝ − {−1}</text></svg>